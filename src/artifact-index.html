<title>Rijbewijs B Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mobiele app met vaste bovenbalk (XP) en onderbalk (tabs); content scrolt ertussen.
   Palet komt uit de RVV-bordenwereld: bordblauw, bordrood, haaientandwit, asfaltgrijs met blauwe inslag. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --line:#d6dce6;
  --fg:#15202e; --fg-2:#5a6779; --fg-3:#8793a5;
  --blauw:#0b4ea2; --blauw-zacht:#e4edf9; --rood:#d2272e; --geel:#f2c200;
  --goed:#17794a; --goed-zacht:#e1f3e9; --fout:#c22a2a; --fout-zacht:#fbe6e6;
  --asfalt:#3d4652;
  --m-voorrang:#0b4ea2; --m-tekens:#b4541a; --m-weg:#0e7490; --m-bijzonder:#6d28d9;
  --m-veilig:#b91c1c; --m-milieu:#15803d; --m-wet:#a16207; --m-voertuig:#475569;
  --f-disp:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:14px; --sh:0 1px 2px rgba(21,32,46,.08), 0 6px 18px rgba(21,32,46,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151c; --surface:#19202a; --surface-2:#222b37; --line:#303b4a;
  --fg:#eaeff6; --fg-2:#a2aebf; --fg-3:#78859a;
  --blauw:#5a9bf0; --blauw-zacht:#1b2736; --rood:#f0646a;
  --goed:#4bd08a; --goed-zacht:#14301f; --fout:#f0646a; --fout-zacht:#311718;
  --asfalt:#aab6c6; --m-voorrang:#5a9bf0; --m-tekens:#e08a4e; --m-weg:#38bdf8; --m-bijzonder:#a78bfa;
  --m-veilig:#f87171; --m-milieu:#4ade80; --m-wet:#fbbf24; --m-voertuig:#94a3b8;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#19202a; --surface-2:#222b37; --line:#303b4a;
  --fg:#eaeff6; --fg-2:#a2aebf; --fg-3:#78859a;
  --blauw:#5a9bf0; --blauw-zacht:#1b2736; --rood:#f0646a;
  --goed:#4bd08a; --goed-zacht:#14301f; --fout:#f0646a; --fout-zacht:#311718;
  --asfalt:#aab6c6; --m-voorrang:#5a9bf0; --m-tekens:#e08a4e; --m-weg:#38bdf8; --m-bijzonder:#a78bfa;
  --m-veilig:#f87171; --m-milieu:#4ade80; --m-wet:#fbbf24; --m-voertuig:#94a3b8;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---- bovenbalk ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);z-index:20}
.hwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;display:flex;align-items:center;gap:12px}
.lvl{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--blauw);color:#fff;display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:800;font-size:15px}
.xpcol{flex:1 1 auto;min-width:0}
.xptop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--fg-2)}
.xptop b{font-family:var(--f-disp);font-size:13px;color:var(--fg)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blauw),var(--geel));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hbtn{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;font-size:16px}
.streak{flex:0 0 auto;font-size:12px;color:var(--fg-2);text-align:right;line-height:1.2}
.streak b{display:block;font-family:var(--f-disp);font-size:16px;color:var(--fg)}

/* ---- main ---- */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 24px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.muted{color:var(--fg-2)}
.small{font-size:13px}
.art{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:11px;border:1px solid transparent;
  background:var(--blauw);color:#fff;font-weight:600;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--surface-2);color:var(--fg);border-color:var(--line)}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.hbtn:focus-visible,.tab:focus-visible{outline:3px solid var(--geel);outline-offset:2px}

/* ---- tabs ---- */
nav{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex}
.tab{flex:1 1 0;min-width:0;background:none;border:0;padding:8px 2px 10px;cursor:pointer;color:var(--fg-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--blauw)}

/* ---- quiz ---- */
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;margin:0;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blauw)}
.opt[data-st="sel"]{border-color:var(--blauw);background:var(--blauw-zacht)}
.opt[data-st="goed"]{border-color:var(--goed);background:var(--goed-zacht)}
.opt[data-st="fout"]{border-color:var(--fout);background:var(--fout-zacht)}
.opt:disabled{cursor:default}
.fb{border-radius:11px;padding:13px 14px;border:1.5px solid}
.fb.goed{border-color:var(--goed);background:var(--goed-zacht)}
.fb.fout{border-color:var(--fout);background:var(--fout-zacht)}
.fb h4{font-size:14px;margin-bottom:4px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--fg-2)}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg-2)}
.prog .bar{flex:1;margin:0}
.xppop{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--goed);color:#fff;font-family:var(--f-disp);
  font-weight:800;padding:7px 16px;border-radius:99px;z-index:50;pointer-events:none;opacity:0;transition:opacity .25s,transform .4s}
.xppop.on{opacity:1;transform:translateX(-50%) translateY(-10px)}

/* ---- grids ---- */
.grid{display:grid;gap:10px}
.g-mod{grid-template-columns:1fr}
@media(min-width:560px){.g-mod{grid-template-columns:1fr 1fr}}
.g-sign{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.modcard{display:flex;gap:12px;align-items:center;text-align:left;border-left:4px solid var(--c);cursor:pointer;width:100%}
.ring{flex:0 0 auto;width:46px;height:46px}
.signtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:pointer;text-align:center}
.bord{display:inline-block;line-height:0;vertical-align:middle}
.bord svg{width:100%;height:100%;display:block}
.signtile .bord{margin-inline:auto}
.signtile .code{font-family:var(--f-disp);font-size:11px;color:var(--fg-2)}

/* ---- battle pass ---- */
.pass{display:flex;gap:10px;overflow-x:auto;padding-block:4px 10px;scroll-snap-type:x proximity}
.tier{flex:0 0 118px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;
  display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;opacity:.55}
.tier.unlocked{opacity:1;border-color:var(--geel);box-shadow:0 0 0 2px rgba(242,194,0,.18)}
.tier .n{font-family:var(--f-disp);font-size:11px;color:var(--fg-3)}
.tier .ic{font-size:24px;line-height:1}
.tier .nm{font-size:11.5px;font-weight:600;line-height:1.3}

/* ---- puzzel ---- */
.scene{width:100%;max-width:340px;margin:0 auto;display:block;border-radius:12px;background:var(--surface-2)}
.actorbtn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:600}
.actorbtn[data-st="sel"]{border-color:var(--blauw);background:var(--blauw-zacht)}
.actorbtn .num{width:22px;height:22px;border-radius:50%;background:var(--blauw);color:#fff;display:grid;place-items:center;font-size:12px;font-family:var(--f-disp)}

/* ---- examen ---- */
.examtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:5}
.timer{font-family:var(--f-disp);font-size:19px;font-variant-numeric:tabular-nums}
.timer.laag{color:var(--fout)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:23px;height:23px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:10.5px;cursor:pointer;
  display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.dot[data-st="done"]{background:var(--blauw);color:#fff;border-color:var(--blauw)}
.dot[data-st="mark"]{background:var(--geel);color:#15202e;border-color:var(--geel)}
.dot[data-st="now"]{outline:2px solid var(--fg);outline-offset:1px}
.score{font-family:var(--f-disp);font-size:46px;line-height:1}
table.res{width:100%;border-collapse:collapse;font-size:13.5px}
table.res td{padding:7px 0;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* ---- de wereld van de weg ---- */
/* Onder de bovenbalk loopt een strook asfalt met belijning: de app begint
   letterlijk op de weg. */
header{position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:repeating-linear-gradient(90deg,var(--asfalt) 0 14px,transparent 14px 26px);opacity:.45}
.ritwrap{margin:2px -4px 0}
.rit{width:100%;height:auto;display:block}
.klaarvlag{flex:0 0 auto;line-height:0}
.kopRij{display:flex;align-items:center;gap:10px;justify-content:space-between}
.kopRij h2{min-width:0}
.ringwrap{flex:0 0 auto;position:relative;width:46px;height:46px}
.ringwrap .ring{width:46px;height:46px}
.modico{position:absolute;inset:0;display:grid;place-items:center;line-height:0}
.modkaart{border-left:4px solid var(--c)}
.modkop{display:flex;gap:11px;align-items:center}
.modbadge{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--surface-2);
  display:grid;place-items:center;line-height:0}
.uitslaglicht{display:flex;justify-content:center;line-height:0;margin-bottom:2px}

/* ---- bord in lopende tekst ---- */
.bordchip{display:inline-flex;align-items:center;gap:4px;vertical-align:-7px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
  padding:2px 6px 2px 3px;margin:0 2px;line-height:0}
.bordchip .bord{width:26px;height:26px}
.bordchip .bc{font-family:var(--f-disp);font-size:11px;font-weight:700;color:var(--fg-2);line-height:1}
.opt .bordchip{vertical-align:-7px}

/* ---- voortgang per module in Leren ---- */
.modstat{display:flex;flex-wrap:wrap;gap:6px}
.pil{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;
  font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--fg-3);border:1px solid var(--line)}
.pil.aan{color:var(--goed);border-color:var(--goed);background:var(--goed-zacht)}
.pil.medaille{color:var(--fg);border-color:var(--geel);background:rgba(242,194,0,.14)}
.pil.nu{color:var(--blauw);border-color:var(--blauw);background:var(--blauw-zacht)}
.pilv{width:13px;height:13px;flex:0 0 auto}
.btn.sec.gedaan{border-color:var(--goed);color:var(--goed)}

/* ---- vandaag: cijfers en dagstrip ---- */
.cijfers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.cijfer{background:var(--surface-2);border-radius:10px;padding:9px 8px;text-align:center;min-width:0}
.cijfer .cv{font-family:var(--f-disp);font-weight:800;font-size:16px;line-height:1.2}
.cijfer .cl{font-size:10.5px;color:var(--fg-2);margin-top:2px}
.dagen{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dagvak{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;font-size:11.5px;color:var(--fg-3);font-weight:600}
.dagvak[data-st="af"]{background:var(--goed);border-color:var(--goed);color:#fff}
.dagvak[data-st="nu"]{border-color:var(--blauw);color:var(--blauw);box-shadow:0 0 0 2px rgba(11,78,162,.18)}
.vink{flex:0 0 auto;width:22px;height:22px}
.vink svg{width:100%;height:100%;display:block}
.modcard.gedaan .small{color:var(--goed)}

/* ---- instellingen ---- */
.schakel{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line)}
.schakel:last-of-type{border-bottom:0}
.tuimel{flex:0 0 auto;width:46px;height:27px;border-radius:99px;border:1.5px solid var(--line);
  background:var(--surface-2);cursor:pointer;padding:0;position:relative;transition:background .18s,border-color .18s}
.tuimel[data-aan="1"]{background:var(--goed);border-color:var(--goed)}
.tuimel .dop{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tuimel[data-aan="1"] .dop{transform:translateX(19px)}

/* ---- confetti ---- */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--asfalt);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="hwrap">
    <div class="lvl" id="lvl">1</div>
    <div class="xpcol">
      <div class="xptop"><b id="lvlnm">Leerling</b><span class="tnum" id="xptxt">0 / 100 XP</span></div>
      <div class="bar"><i id="xpbar" style="width:0%"></i></div>
    </div>
    <div class="streak"><b class="tnum" id="streak">0</b>dagen</div>
    <button class="hbtn" id="themebtn" title="Licht of donker" aria-label="Thema wisselen">◐</button>
    <button class="hbtn" id="setbtn" title="Instellingen" aria-label="Instellingen">⚙</button>
  </div>
</header>

<main id="main"><div class="wrap" id="view"></div></main>

<nav id="nav"></nav>
<div class="xppop" id="xppop"></div>
<div class="toast" id="toast"></div>

<script src="borden.js"></script>
<script src="content-modules.js"></script>
<script src="content-modules2.js"></script>
<script src="content-extra.js"></script>
<script>
(function(){
"use strict";
var SIGNS = window.SIGNS || [];
var MODULES = (window.MODULES || []).concat(window.MODULES2 || [])
  .sort(function(a,b){ return a.nr-b.nr; });
// Extra vragen worden per module achter de bestaande aangehaakt.
(function(){ var X = window.EXTRA || {};
  MODULES.forEach(function(m){ if(X[m.id] && X[m.id].length) m.questions = m.questions.concat(X[m.id]); });
})();
var EXAM = {vragen:50, minuten:30, grens:44};
var $ = function(s,r){return (r||document).querySelector(s)};
var el = function(tag,cls,txt){var n=document.createElement(tag); if(cls)n.className=cls; if(txt!=null)n.textContent=txt; return n};
var esc = function(s){var d=document.createElement('div'); d.textContent=s; return d.innerHTML};

/* ======================= STATE ======================= */
var S = {
  xp:0, streak:0, laatsteDag:null, dagenGedaan:{},
  mod:{}, leitner:{}, fout:[], examens:[], gezien:{},
  // Wat je vandaag gedaan hebt. Wordt vanzelf leeggemaakt zodra het een nieuwe dag is.
  dag:{datum:'', taken:{}, xp:0, goed:0, fout:0, dagnr:0},
  instel:{geluid:true, animatie:true}
};
MODULES.forEach(function(m){ S.mod[m.id]={goed:0,fout:0,les:0}; });

var LS_KEY='autotheorie-v1', db=null, userId=null, saveT=null, bron='lokaal';

function schoon(raw){
  if(!raw||typeof raw!=='object') return;
  ['xp','streak'].forEach(function(k){ if(typeof raw[k]==='number') S[k]=raw[k]; });
  if(typeof raw.laatsteDag==='string') S.laatsteDag=raw.laatsteDag;
  ['dagenGedaan','leitner','gezien'].forEach(function(k){ if(raw[k]&&typeof raw[k]==='object') S[k]=raw[k]; });
  if(Array.isArray(raw.fout)) S.fout=raw.fout.slice(0,500);
  if(Array.isArray(raw.examens)) S.examens=raw.examens.slice(-25);
  if(raw.mod&&typeof raw.mod==='object') MODULES.forEach(function(m){
    var r=raw.mod[m.id]; if(r) S.mod[m.id]={goed:+r.goed||0, fout:+r.fout||0, les:+r.les||0};
  });
  if(raw.dag&&typeof raw.dag==='object') S.dag={
    datum: typeof raw.dag.datum==='string'?raw.dag.datum:'',
    taken: (raw.dag.taken&&typeof raw.dag.taken==='object')?raw.dag.taken:{},
    xp:+raw.dag.xp||0, goed:+raw.dag.goed||0, fout:+raw.dag.fout||0,
    dagnr:+raw.dag.dagnr||0
  };
  if(raw.instel&&typeof raw.instel==='object'){
    S.instel.geluid   = raw.instel.geluid!==false;
    S.instel.animatie = raw.instel.animatie!==false;
  }
}

/* ---------- Wat je vandaag deed ---------- */
function dagState(){
  var t=vandaagStr();
  if(S.dag.datum!==t) S.dag={datum:t, taken:{}, xp:0, goed:0, fout:0, dagnr:0};
  return S.dag;
}
function taakKlaar(sleutel){
  var d=dagState();
  if(d.taken[sleutel]) return false;   // al eerder vandaag gedaan
  d.taken[sleutel]=1; bewaar();
  return true;
}
function telAntwoord(goed){ var d=dagState(); goed?d.goed++:d.fout++; }
/* De taken die bij de dag van vandaag horen. */
function dagTaken(dag){
  var plan=DAGPLAN[dag-1]; if(!plan) return [];
  if(dag<=10){
    var mod=MODULES.filter(function(m){return m.id===plan.mod})[0];
    var lijst=[{k:'les', nm:'Lesstof lezen'},{k:'quiz', nm:'Quiz'},{k:'borden', nm:'Flashcards borden'}];
    if(mod && mod.puzzles.length) lijst.push({k:'puzzel', nm:'Situatiepuzzel'});
    return lijst;
  }
  return [{k:'examen', nm:'Proefexamen'},{k:'fouten', nm:'Foutenbak'}];
}
function laadLokaal(){ try{ var r=localStorage.getItem(LS_KEY); if(r) schoon(JSON.parse(r)); }catch(e){} }
function bewaar(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(db&&userId){ clearTimeout(saveT); saveT=setTimeout(function(){

/* Geluid wordt ter plekke opgewekt met de Web Audio API: geen bestanden,
   dus het werkt ook offline. Browsers staan audio pas toe na een klik,
   en dat is hier altijd het geval. */
var AC=null;
function audioCtx(){
  if(!S.instel.geluid) return null;
  try{
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = AC || new C();
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
/* Speelt een reeks tonen af. [[frequentie, startInSeconden, duur], ...] */
function tonen(reeks, vorm, volume){
  var ac=audioCtx(); if(!ac) return;
  try{
    reeks.forEach(function(t){
      var osc=ac.createOscillator(), g=ac.createGain();
      osc.type = vorm || 'sine';
      osc.frequency.value = t[0];
      var start = ac.currentTime + t[1], eind = start + t[2];
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(volume||0.12, start+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, eind);
      osc.connect(g); g.connect(ac.destination);
      osc.start(start); osc.stop(eind+0.02);
    });
  }catch(e){}
}
var GELUID = {
  goed:    function(){ tonen([[660,0,.09],[880,.07,.13]], 'sine', .10); },
  fout:    function(){ tonen([[220,0,.16]], 'triangle', .09); },
  klein:   function(){ tonen([[523,0,.09],[659,.08,.09],[784,.16,.18]], 'sine', .11); },
  groot:   function(){ tonen([[523,0,.1],[659,.1,.1],[784,.2,.1],[1047,.3,.3]], 'sine', .12); },
  level:   function(){ tonen([[440,0,.1],[554,.1,.1],[659,.2,.1],[880,.3,.35]], 'sine', .12); },
  pass:    function(){ tonen([[784,0,.1],[988,.1,.1],[1175,.2,.26]], 'sine', .11); }
};

/* Confetti: snippers in de vorm van verkeersborden, die dwarrelen of
   vanuit het midden wegschieten. */
var SVGNS='http://www.w3.org/2000/svg';
var CONF_KLEUR=['#f2c200','#0b4ea2','#d2272e','#17794a','#ffffff','#5a9bf0','#e8803a'];

function confettiStuk(svg, maat, kleur){
  var soort=Math.random(), e;
  if(soort<0.30){                                   // rond bord
    e=document.createElementNS(SVGNS,'circle');
    e.setAttribute('r',maat/2); e.setAttribute('fill',kleur);
  } else if(soort<0.52){                            // waarschuwingsdriehoek
    e=document.createElementNS(SVGNS,'polygon');
    var h=maat*0.9;
    e.setAttribute('points','0,'+(-h/2)+' '+(maat/2)+','+(h/2)+' '+(-maat/2)+','+(h/2));
    e.setAttribute('fill',kleur);
  } else if(soort<0.66){                            // gele ruit, de voorrangsweg
    e=document.createElementNS(SVGNS,'polygon');
    e.setAttribute('points','0,'+(-maat/2)+' '+(maat/2)+',0 0,'+(maat/2)+' '+(-maat/2)+',0');
    e.setAttribute('fill','#f2c200');
  } else {                                          // gewone snipper
    e=document.createElementNS(SVGNS,'rect');
    e.setAttribute('width',maat); e.setAttribute('height',maat*(0.45+Math.random()*0.5));
    e.setAttribute('x',-maat/2); e.setAttribute('y',-maat/3);
    e.setAttribute('rx',1); e.setAttribute('fill',kleur);
  }
  svg.appendChild(e); return e;
}
function confetti(aantal, duurMs, modus){
  if(!S.instel.animatie || GEEN_BEWEGING) return;
  var svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('class','confetti'); svg.setAttribute('aria-hidden','true');
  svg.setAttribute('preserveAspectRatio','none');
  var W=window.innerWidth, H=window.innerHeight;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  document.body.appendChild(svg);

  var stukken=[];
  for(var i=0;i<aantal;i++){
    var maat=6+Math.random()*9;
    var kleur=CONF_KLEUR[(Math.random()*CONF_KLEUR.length)|0];
    var e=confettiStuk(svg, maat, kleur), p;
    if(modus==='knal'){                 // schiet vanuit het midden naar buiten
      var hoek=Math.random()*Math.PI*2, kracht=4+Math.random()*9;
      p={el:e, x:W/2, y:H*0.42, vx:Math.cos(hoek)*kracht, vy:Math.sin(hoek)*kracht-4,
         hoek:Math.random()*360, draai:(Math.random()-0.5)*22};
    } else {                            // dwarrelt van boven naar beneden
      p={el:e, x:Math.random()*W, y:-20-Math.random()*H*0.6,
         vx:(Math.random()-0.5)*1.8, vy:2.2+Math.random()*3.6,
         hoek:Math.random()*360, draai:(Math.random()-0.5)*16};
    }
    p.zwaai=Math.random()*Math.PI*2;
    stukken.push(p);
  }
  var begin=performance.now(), duur=duurMs||2600;
  function stap(nu){
    var verstreken=nu-begin;
    if(verstreken>duur){ svg.remove(); return; }
    svg.style.opacity = verstreken>duur-700 ? (duur-verstreken)/700 : 1;
    for(var i=0;i<stukken.length;i++){
      var p=stukken[i];
      p.zwaai+=0.09;
      p.x += p.vx + Math.sin(p.zwaai)*0.7;   // lichte zijwaartse zwaai
      p.y += p.vy; p.vy += 0.10; p.vx *= 0.995;
      p.hoek += p.draai;
      p.el.setAttribute('transform','translate('+p.x+' '+p.y+') rotate('+p.hoek+')');
    }
    requestAnimationFrame(stap);
  }
  requestAnimationFrame(stap);
}

/* De borden zijn de officiele RVV-tekeningen uit borden.js. Ze worden inline
   geplaatst en door de wrapper op maat geschaald; de verhouding blijft intact. */
function bordSVG(s,size){
  var sz = size||60;
  if(!s || !s.svg) return '<span class=\"bord\" style=\"width:'+sz+'px;height:'+sz+'px\"></span>';
  return '<span class=\"bord\" role=\"img\" aria-label=\"'+esc(s.c+': '+s.n)+'\" style=\"width:'+sz+'px;height:'+sz+'px\">'+s.svg+'</span>';

var ALLE=[];
// Een bordvraag kan alleen gesteld worden als het bord ook echt in de set zit.
var SIGN_CODES={}; SIGNS.forEach(function(s){ SIGN_CODES[s.c]=s; });

/* ---------- Bordcodes in lopende tekst vervangen door het bord zelf ----------
   "bord F1" zegt niets als je het bord niet ziet. Overal waar een code uit de
   bordenset in een tekst staat, komt het plaatje erbij te staan. */
var CODE_RE = new RegExp('\\b(' +
  Object.keys(SIGN_CODES).sort(function(a,b){ return b.length-a.length; })
    .map(function(c){ return c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|') +
  ')\\b', 'g');

function bordChip(s){
  var sp=document.createElement('span');
  sp.className='bordchip';
  sp.title=s.c+': '+s.n;
  var b=document.createElement('span');
  b.innerHTML=bordSVG(s,26);
  sp.appendChild(b);
  var code=document.createElement('span'); code.className='bc'; code.textContent=s.c;
  sp.appendChild(code);
  return sp;
}
/* Geeft een fragment terug met de tekst, waarin elke bekende bordcode
   een plaatje met code is geworden. */
function metBorden(tekst){
  var frag=document.createDocumentFragment();
  if(tekst==null){ return frag; }
  var t=String(tekst), laatst=0, m;
  CODE_RE.lastIndex=0;
  while((m=CODE_RE.exec(t))!==null){
    var s=SIGN_CODES[m[1]];
    if(!s) continue;                       // code zonder tekening: laat de tekst staan
    if(m.index>laatst) frag.appendChild(document.createTextNode(t.slice(laatst,m.index)));
    frag.appendChild(bordChip(s));
    laatst=m.index+m[1].length;
  }
  if(laatst<t.length) frag.appendChild(document.createTextNode(t.slice(laatst)));
  return frag;
}
/* Als el() maar dan met borden in de tekst. */
function elB(tag, cls, tekst){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  n.appendChild(metBorden(tekst));
  return n;
}

      var b=elB('button','opt',lab);
      b.onclick=function(){ if(antwoordGegeven)return;
        var k=keuze.indexOf(i); if(k<0)keuze.push(i); else keuze.splice(k,1);
        b.dataset.st = keuze.indexOf(i)<0 ? '' : 'sel'; };
      opts_wrap.appendChild(b);
    });
    var ok=el('button','btn wide','Controleer');
    ok.onclick=function(){ if(antwoordGegeven)return;
      var a=q.a.slice().sort(), k=keuze.slice().sort();
      var goed = a.length===k.length && a.every(function(v,i){return v===k[i]});
      Array.prototype.forEach.call(opts_wrap.children,function(c,j){ c.disabled=true;
        if(q.a.indexOf(j)>=0) c.dataset.st='goed'; else if(keuze.indexOf(j)>=0) c.dataset.st='fout'; else c.dataset.st=''; });
      ok.remove(); klaar(goed); };
    box.appendChild(ok);
  } else if(q.t==='order'){
    box.insertBefore(el('div','small muted','Klik ze aan in de juiste volgorde.'), opts_wrap);
    var knoppen=[];
    q.o.forEach(function(lab,i){
      var b=el('button','actorbtn'); var num=el('span','num',''); num.style.visibility='hidden';
      b.appendChild(num); b.appendChild(el('span',null,lab));
      b.onclick=function(){ if(antwoordGegeven)return;
        var p=volgorde.indexOf(i);
        if(p>=0){ volgorde.splice(p,1); } else { volgorde.push(i); }
        knoppen.forEach(function(kb,ki){ var pos=volgorde.indexOf(ki);
          kb.dataset.st = pos<0?'':'sel';
          var n=kb.querySelector('.num');
          if(pos<0){ n.style.visibility='hidden'; n.textContent=''; } else { n.style.visibility='visible'; n.textContent=pos+1; } });
        ok2.disabled = volgorde.length!==q.o.length; };
      knoppen.push(b); opts_wrap.appendChild(b);
    });
    var ok2=el('button','btn wide','Controleer'); ok2.disabled=true;
    ok2.onclick=function(){ if(antwoordGegeven)return;
      var goed = volgorde.length===q.a.length && volgorde.every(function(v,i){return v===q.a[i]});
      knoppen.forEach(function(kb){kb.disabled=true});
      if(!goed){ var hint=el('div','small muted','Juiste volgorde: '+q.a.map(function(i){return q.o[i]}).join(' → ')); box.appendChild(hint); }
      ok2.remove(); klaar(goed); };
    box.appendChild(ok2);
  } else if(q.t==='fill'){
    var inp=document.createElement('input');
    inp.type='text'; inp.id='fill-'+q.id.replace(/[^a-z0-9]/gi,''); inp.placeholder='Typ je antwoord';
    inp.style.cssText='width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit';
    opts_wrap.appendChild(inp);
    var ok3=el('button','btn wide','Controleer');
    ok3.onclick=function(){ if(antwoordGegeven)return;
      // Cijfers moeten meetellen, anders zou "1,6" met elk antwoord overeenkomen.
      var norm=function(x){return (x||'').toLowerCase().replace(/[^a-z0-9]/g,'')};
      var goed = norm(inp.value)!=='' && norm(inp.value)===norm(q.a);
      inp.disabled=true; inp.style.borderColor = goed?'var(--goed)':'var(--fout)';
      if(!goed) box.appendChild(el('div','small muted','Juiste antwoord: '+q.a));
      ok3.remove(); klaar(goed); };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') ok3.click(); });
    box.appendChild(ok3);
  }
  return box;
}

/* ======================= SCENE TEKENEN (puzzels) ======================= */
/* Een route bestaat uit twee delen: het naderen van het kruispunt (dat loopt in een
   lus zolang de vraag openstaat) en de volledige doorsteek (die na het antwoord in
   de juiste volgorde wordt afgespeeld). Rechts rijden bepaalt de rijstrook. */
function route(a){
  var o = a.soort==='fiets' ? 6.5 : a.soort==='tram' ? -7 : 0;  // fietspad ligt rechts, tram in het midden
  var N = 43 - o, Z = 57 + o, W = 43 - o, O = 57 + o;  // N/Z = x-stroken, W/O = y-stroken
  var naar = a.naar || 'rd', full, app, lbl;
  if(a.van==='zuid'){              // rijdt naar het noorden
    lbl = [Z, 88];
    app  = 'M'+Z+' 102 L'+Z+' 70';
    full = naar==='rd'    ? 'M'+Z+' 102 L'+Z+' -2'
         : naar==='rechts'? 'M'+Z+' 102 L'+Z+' '+O+' L102 '+O
         :                  'M'+Z+' 102 L'+Z+' '+W+' L-2 '+W;
  } else if(a.van==='noord'){      // rijdt naar het zuiden
    lbl = [N, 12];
    app  = 'M'+N+' -2 L'+N+' 30';
    full = naar==='rd'    ? 'M'+N+' -2 L'+N+' 102'
         : naar==='rechts'? 'M'+N+' -2 L'+N+' '+W+' L-2 '+W
         :                  'M'+N+' -2 L'+N+' '+O+' L102 '+O;
  } else if(a.van==='west'){       // rijdt naar het oosten
    lbl = [12, O];
    app  = 'M-2 '+O+' L30 '+O;
    full = naar==='rd'    ? 'M-2 '+O+' L102 '+O
         : naar==='rechts'? 'M-2 '+O+' L'+N+' '+O+' L'+N+' 102'
         :                  'M-2 '+O+' L'+Z+' '+O+' L'+Z+' -2';
  } else if(a.van==='oost'){       // rijdt naar het westen
    lbl = [88, W];
    app  = 'M102 '+W+' L70 '+W;
    full = naar==='rd'    ? 'M102 '+W+' L-2 '+W
         : naar==='rechts'? 'M102 '+W+' L'+Z+' '+W+' L'+Z+' -2'
         :                  'M102 '+W+' L'+N+' '+W+' L'+N+' 102';
  } else if(a.van==='uitrit'){
    lbl = [50, 88];
    app  = 'M50 102 L50 76';
    full = 'M50 102 L50 54 L102 54';
  } else {                          // voetganger op het trottoir langs de uitrit
    lbl = [16, 58];
    app  = 'M-2 65 L34 65';
    full = 'M-2 65 L102 65';
  }
  return {full:full, app:app, lbl:lbl};
}
function actorVorm(a){
  var kl = a.kleur==='jij' ? '#f2c200'
         : a.soort==='tram' ? '#d2272e'
         : a.soort==='fiets' ? '#4bd08a'
         : a.soort==='voet' ? '#ffffff' : '#9fd0ff';
  // Alles wijst naar +x, zodat rotate="auto" de richting van de route volgt.
  if(a.soort==='voet')  return '<circle cx="0" cy="-3" r="2.6" fill="'+kl+'"/><rect x="-2" y="0" width="4" height="6.5" rx="1.6" fill="'+kl+'"/>';
  if(a.soort==='fiets') return '<circle cx="-3" cy="2" r="2.6" fill="none" stroke="'+kl+'" stroke-width="1.2"/><circle cx="3" cy="2" r="2.6" fill="none" stroke="'+kl+'" stroke-width="1.2"/><path d="M-3 2 0 -3h3" stroke="'+kl+'" stroke-width="1.2" fill="none"/>';
  if(a.soort==='tram')  return '<rect x="-8" y="-3.5" width="16" height="7" rx="1.5" fill="'+kl+'"/><rect x="2" y="-2.3" width="4" height="4.6" fill="#fff"/>';
  return '<rect x="-6" y="-3.4" width="12" height="6.8" rx="2" fill="'+kl+'"/><rect x="0.6" y="-2.4" width="3.6" height="4.8" rx="1" fill="#1a2330" opacity=".55"/>';
}
var GEEN_BEWEGING = false;
try{ GEEN_BEWEGING = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

function sceneSVG(sc, mode, volgorde){
  var bewegend = !GEEN_BEWEGING;
  var s='<svg viewBox="0 0 100 100" class="scene" role="img" aria-label="Verkeerssituatie op een kruispunt">';
  if(sc.type==='uitrit'){
    s+='<rect x="0" y="36" width="100" height="24" fill="#4a5361"/>';
    s+='<rect x="0" y="60" width="100" height="9" fill="#b9c0cb"/>';   // trottoir
    s+='<rect x="42" y="69" width="16" height="31" fill="#6b7382"/>';  // uitrit
    s+='<path d="M0 48h100" stroke="#fff" stroke-width="1" stroke-dasharray="6 5"/>';
  } else {
    s+='<rect x="0" y="36" width="100" height="28" fill="#4a5361"/>';
    s+='<rect x="36" y="0" width="28" height="100" fill="#4a5361"/>';
    s+='<path d="M0 50h30M70 50h30" stroke="#fff" stroke-width="1.2" stroke-dasharray="6 5"/>';
    s+='<path d="M50 0v30M50 70v30" stroke="#fff" stroke-width="1.2" stroke-dasharray="6 5"/>';
    if(sc.borden==='haaientanden-zuid'){
      for(var i=0;i<6;i++){ var x=37.5+i*4.5; s+='<path d="M'+x+' 69 L'+(x+3)+' 69 L'+(x+1.5)+' 65.5 Z" fill="#fff"/>'; }
    }
  }
  var acts = sc.actors||[];
  acts.forEach(function(a){
    var r=route(a), vorm=actorVorm(a);
    if(!bewegend){
      // Zonder beweging: iedereen staat stil vlak voor het kruispunt.
      s+='<g><path d="'+r.app+'" fill="none" stroke="none"/>'+vorm+
         '<animateMotion dur="0.001s" fill="freeze" rotate="auto" path="'+r.app+'" keyPoints="1;1" keyTimes="0;1" calcMode="linear"/></g>';
    } else if(mode==='solve'){
      var i = (volgorde||[]).indexOf(a.id); if(i<0) i = acts.length;
      s+='<g>'+vorm+'<animateMotion begin="'+(i*1.5)+'s" dur="1.5s" fill="freeze" rotate="auto" path="'+r.full+'"/>'+
         '<animateMotion dur="0.001s" fill="freeze" rotate="auto" path="'+r.app+'" keyPoints="1;1" keyTimes="0;1" calcMode="linear"/></g>';
    } else {
      s+='<g>'+vorm+'<animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" rotate="auto" path="'+r.app+'"/></g>';
    }
    s+='<text x="'+r.lbl[0]+'" y="'+r.lbl[1]+'" text-anchor="middle" fill="#fff" stroke="#2a3140" stroke-width="2.2" paint-order="stroke" font-family="Archivo, Arial" font-weight="800" font-size="6">'+esc(a.label)+'</text>';
  });
  s+='</svg>';
  return s;
}

/* Eén programmadag per kalenderdag. Rond je dag 1 af, dan blijf je vandaag
   op dag 1 staan (met het vinkje) in plaats van meteen door te schuiven naar
   dag 2; anders zou het werk van vandaag als voortgang van morgen tellen. */
function huidigeDag(){
  var d=dagState();
  if(d.dagnr) return d.dagnr;
  var i=1; while(i<14 && S.dagenGedaan[i]) i++;
  d.dagnr=i;            // alleen in het geheugen: tekenen mag nooit opslaan,
  return i;             // anders overschrijft de eerste render je voortgang
}

function vVandaag(v){
  var dag=huidigeDag(), plan=DAGPLAN[dag-1], d=dagState();
  var taken=dagTaken(dag);
  var af=taken.filter(function(t){ return d.taken[t.k]; }).length;
  var alles = af===taken.length && taken.length>0;
  var mod = plan && plan.mod ? MODULES.filter(function(m){return m.id===plan.mod})[0] : null;
  var h=el('div','stack');

  /* ---- Kop: wat heb je vandaag gedaan ---- */

  kt.appendChild(el('div','eyebrow','Vandaag · dag '+dag+' van 14'));
  var kopRij=el('div','kopRij');

  if(alles){ var vl=el('div','klaarvlag'); vl.innerHTML=AFB.vlag(34); kopRij.appendChild(vl); }
  kt.appendChild(kopRij);
  kt.appendChild(el('div','small muted', alles

    : (dag<=10 && mod ? 'Module: '+mod.titel : 'Herhalen en proefexamen')));
  top.appendChild(kt);
  /* De rit van vandaag: je auto schuift op naar de finish naarmate je taken afvinkt. */
  var rit=el('div','ritwrap'); rit.innerHTML=AFB.rit(pct, alles); top.appendChild(rit);

  /* Drie cijfers over vandaag, zodat je je inspanning terugziet. */
  var cij=el('div','cijfers');
  var totaal=d.goed+d.fout;
  [['XP vandaag', '+'+d.xp],
   ['Vragen', totaal ? d.goed+'/'+totaal+' goed' : '—'],
   ['Reeks', S.streak+(S.streak===1?' dag':' dagen')]].forEach(function(p){
    var c=el('div','cijfer');
    c.appendChild(el('div','cv tnum',p[1]));
    c.appendChild(el('div','cl',p[0]));
    cij.appendChild(c);
  });
  top.appendChild(cij);
  h.appendChild(top);

  /* ---- De taken van vandaag, met hun staat ---- */
  var acties=el('div','stack');
  function taakKaart(k, titel, sub, fn){
    return knopKaart(titel, sub, fn, !!d.taken[k]);
  }
  if(dag<=10 && mod){
    acties.appendChild(taakKaart('les','Lesstof lezen', mod.lessons.length+' kaartjes · '+mod.titel, function(){ startLes(mod); }));
    acties.appendChild(taakKaart('quiz','Quiz', '10 vragen uit '+mod.titel, function(){ startQuiz(schud(mod.questions).slice(0,10), 'Quiz · '+mod.titel, 'quiz'); }));
    acties.appendChild(taakKaart('borden','Flashcards borden', '20 borden volgens het Leitner-systeem', function(){ TAB='borden'; teken(); startFlash(); }));
    if(mod.puzzles.length) acties.appendChild(taakKaart('puzzel','Situatiepuzzel', mod.puzzles.length+' kruispunten', function(){ startPuzzels(mod); }));
  } else {
    acties.appendChild(taakKaart('examen','Proefexamen', EXAM.vragen+' vragen · '+EXAM.minuten+' minuten · '+EXAM.grens+' goed om te slagen', function(){ TAB='examen'; teken(); startExamen(); }));
    acties.appendChild(taakKaart('fouten','Foutenbak', S.fout.length?S.fout.length+' vragen die je fout had':'Je foutenbak is leeg', function(){
      if(!S.fout.length){ toast('Je foutenbak is leeg'); return; }
      startQuiz(S.fout.map(vraagById).filter(Boolean).slice(0,15), 'Foutenbak', 'fouten'); }));
  }
  if(dag<=10 && S.fout.length) acties.appendChild(knopKaart('Foutenbak wegwerken', S.fout.length+' vragen die je fout had', function(){
    startQuiz(S.fout.map(vraagById).filter(Boolean).slice(0,15), 'Foutenbak'); }, false));
  h.appendChild(acties);

  /* ---- De veertien dagen in één oogopslag ---- */
  var pl=el('div','card stack');
  pl.appendChild(el('div','eyebrow','Jouw 14 dagen'));
  var strip=el('div','dagen');
  for(var i=1;i<=14;i++){
    var vak=el('div','dagvak tnum',String(i));
    if(S.dagenGedaan[i]) vak.dataset.st='af';
    else if(i===dag) vak.dataset.st='nu';
    vak.title='Dag '+i+(S.dagenGedaan[i]?' · afgerond':i===dag?' · vandaag':'');
    strip.appendChild(vak);
  }
  pl.appendChild(strip);

    S.examens.slice().reverse().slice(0,8).forEach(function(e){
      var tr=document.createElement('tr');
      var td1=document.createElement('td'); td1.textContent=e.datum+(e.gezakt?' · gezakt':' · geslaagd');
      var td2=document.createElement('td'); td2.textContent=e.goed+'/'+e.totaal;
      tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
    });
    r.appendChild(tb); h.appendChild(r);
  }
  v.appendChild(h);
}
function startExamen(){
  var n=Math.min(EXAM.vragen, ALLE.length);
  examState={ vragen:schud(ALLE).slice(0,n), i:0, ant:{}, mark:{}, eind:Date.now()+EXAM.minuten*60000, klaar:false };
  TAB='examen';
  clearInterval(examTimer);
  examTimer=setInterval(function(){
    if(!examState||examState.klaar){ clearInterval(examTimer); return; }
    var over=examState.eind-Date.now();
    var t=$('#examtimer');
    if(t){ t.textContent=tijd(over); t.classList.toggle('laag', over<120000); }
    if(over<=0){ clearInterval(examTimer); eindExamen(); }
  },1000);
  teken();
}
function tijd(ms){ if(ms<0)ms=0; var s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function tekenExamen(v){
  var E=examState, q=E.vragen[E.i];
  var h=el('div','stack');
  var top=el('div','examtop');
  top.appendChild(el('div','eyebrow','Vraag '+(E.i+1)+' van '+E.vragen.length));
  var t=el('div','timer tnum',tijd(E.eind-Date.now())); t.id='examtimer'; top.appendChild(t);
  h.appendChild(top);

  var c=el('div','card stack');
  if(q.t==='sign'&&q.signCode){ var sg=SIGNS.filter(function(s){return s.c===q.signCode})[0];
    if(sg){ var hold=el('div'); hold.style.textAlign='center'; hold.innerHTML=bordSVG(sg,110); c.appendChild(hold); } }
  var vr=elB('h3',null,q.v); vr.style.fontSize='17px'; c.appendChild(vr);
  var ow=el('div','stack'); ow.style.gap='8px'; c.appendChild(ow);
  var huidig=E.ant[E.i];

  function zet(val){ E.ant[E.i]=val; teken(); }
  if(q.t==='jn'){
    ['Ja','Nee'].forEach(function(lab,i){ var b=el('button','opt',lab);
      if(huidig===i) b.dataset.st='sel'; b.onclick=function(){zet(i)}; ow.appendChild(b); });
  } else if(q.t==='mc'||q.t==='sign'){
    q.o.forEach(function(lab,i){ var b=elB('button','opt',lab);
      if(huidig===i) b.dataset.st='sel'; b.onclick=function(){zet(i)}; ow.appendChild(b); });
  } else if(q.t==='multi'){
    c.insertBefore(el('div','small muted','Meerdere antwoorden zijn goed.'), ow);
    var cur=Array.isArray(huidig)?huidig.slice():[];
    q.o.forEach(function(lab,i){ var b=elB('button','opt',lab);
      if(cur.indexOf(i)>=0) b.dataset.st='sel';
      b.onclick=function(){ var p=cur.indexOf(i); if(p<0)cur.push(i); else cur.splice(p,1); zet(cur.slice()); };
      ow.appendChild(b); });
  } else if(q.t==='order'){
    c.insertBefore(el('div','small muted','Klik ze aan in de juiste volgorde.'), ow);
    var cur2=Array.isArray(huidig)?huidig.slice():[];
    q.o.forEach(function(lab,i){ var b=el('button','actorbtn');
      var pos=cur2.indexOf(i); var n=el('span','num', pos<0?'':String(pos+1));
      if(pos<0) n.style.visibility='hidden';
      b.appendChild(n); b.appendChild(el('span',null,lab));
      if(pos>=0) b.dataset.st='sel';
      b.onclick=function(){ var p=cur2.indexOf(i); if(p<0)cur2.push(i); else cur2.splice(p,1); zet(cur2.slice()); };
      ow.appendChild(b); });
  } else if(q.t==='fill'){
    var inp=document.createElement('input'); inp.type='text'; inp.id='exfill'+E.i; inp.placeholder='Typ je antwoord';
    inp.value = typeof huidig==='string'?huidig:'';
    inp.style.cssText='width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit';
    inp.oninput=function(){ E.ant[E.i]=inp.value; };
    ow.appendChild(inp);
  }
  h.appendChild(c);

  var row=el('div'); row.style.cssText='display:flex;gap:8px';
  var vb=el('button','btn sec','Vorige'); vb.disabled=E.i===0; vb.onclick=function(){E.i--;teken()};
  var mb=el('button','btn sec', E.mark[E.i]?'Markering weg':'Markeren');
  mb.onclick=function(){ E.mark[E.i]=!E.mark[E.i]; teken(); };
  var nb=el('button','btn','Volgende'); nb.style.flex='1'; nb.disabled=E.i===E.vragen.length-1;
  nb.onclick=function(){E.i++;teken()};
  row.appendChild(vb); row.appendChild(mb); row.appendChild(nb);
  h.appendChild(row);

  var dc=el('div','card stack');
  dc.appendChild(el('div','eyebrow','Overzicht'));
  var dots=el('div','dots');
  E.vragen.forEach(function(_,i){
    var d=el('button','dot',String(i+1)); d.type='button';
    var beantwoord = E.ant[i]!==undefined && E.ant[i]!=='' && !(Array.isArray(E.ant[i])&&!E.ant[i].length);
    d.dataset.st = E.mark[i]?'mark':(beantwoord?'done':'');
    if(i===E.i){ d.style.outline='2px solid var(--fg)'; d.style.outlineOffset='1px'; }
    d.onclick=function(){E.i=i;teken();$('#main').scrollTop=0};
    dots.appendChild(d);
  });
  dc.appendChild(dots);
  var aantal=Object.keys(E.ant).filter(function(k){var a=E.ant[k];return a!==undefined&&a!==''&&!(Array.isArray(a)&&!a.length)}).length;
  dc.appendChild(el('div','small muted', aantal+' van '+E.vragen.length+' beantwoord'));
  var ib=el('button','btn wide','Examen inleveren'); ib.onclick=function(){
    eindExamen(); };
  dc.appendChild(ib);
  h.appendChild(dc);
  v.appendChild(h);
}
function juist(q, ant){
  if(ant===undefined) return false;
  if(q.t==='jn'||q.t==='mc'||q.t==='sign') return ant===q.a;
  if(q.t==='multi'){ if(!Array.isArray(ant)) return false;
    var a=q.a.slice().sort(), k=ant.slice().sort();
    return a.length===k.length && a.every(function(v,i){return v===k[i]}); }
  if(q.t==='order'){ return Array.isArray(ant) && ant.length===q.a.length && ant.every(function(v,i){return v===q.a[i]}); }
  if(q.t==='fill'){ var n=function(x){return (x||'').toLowerCase().replace(/[^a-z0-9]/g,'')}; return n(ant)!=='' && n(ant)===n(q.a); }
  return false;
}
function eindExamen(){
  clearInterval(examTimer);
  var E=examState; if(!E||E.klaar) return;
  E.klaar=true;
  var goed=0, perMod={}, foutLijst=[];
  E.vragen.forEach(function(q,i){
    var ok=juist(q,E.ant[i]);
    perMod[q.modTitel]=perMod[q.modTitel]||{g:0,t:0};
    perMod[q.modTitel].t++;
    if(ok){ goed++; perMod[q.modTitel].g++; S.fout=S.fout.filter(function(x){return x!==q.id}); }
    else { foutLijst.push(q); if(S.fout.indexOf(q.id)<0) S.fout.push(q.id); }
    var st=S.mod[q.mod]; if(st){ ok?st.goed++:st.fout++; }
  });
  var grens = Math.round(EXAM.grens/EXAM.vragen*E.vragen.length);
  var geslaagd = goed>=grens;
  S.examens.push({datum:vandaagStr(), goed:goed, totaal:E.vragen.length, gezakt:!geslaagd});
  if(S.examens.length>25) S.examens=S.examens.slice(-25);
  geefXP(geslaagd?100:40, 'proefexamen'); voltooiTaak('examen'); bewaar();

  var v=$('#view'); v.innerHTML='';
  var h=el('div','stack');
  var c=el('div','card stack'); c.style.textAlign='center';
  var licht=el('div','uitslaglicht'); licht.innerHTML=AFB.stoplicht(geslaagd?'groen':'rood', 86);
  c.appendChild(licht);
  c.appendChild(el('div','eyebrow', geslaagd?'Geslaagd':'Gezakt'));
  var sc=el('div','score tnum',goed+'/'+E.vragen.length); sc.style.color= geslaagd?'var(--goed)':'var(--fout)';
  c.appendChild(sc);
  c.appendChild(el('div','muted','Grens voor dit examen: '+grens+' goed'+(E.vragen.length!==EXAM.vragen?' (geschaald naar '+E.vragen.length+' vragen)':'')));
  h.appendChild(c);

  var a=el('div','card stack');
  a.appendChild(el('div','eyebrow','Per onderwerp'));
  var tb=el('table','res');
  Object.keys(perMod).forEach(function(k){
    var tr=document.createElement('tr');
    var td1=document.createElement('td'); var p=Math.round(perMod[k].g/perMod[k].t*100);
    td1.textContent=k+(p<75?' · zwak punt':'');
    var td2=document.createElement('td'); td2.textContent=perMod[k].g+'/'+perMod[k].t;
    tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
  });
  a.appendChild(tb);
  h.appendChild(a);

  if(foutLijst.length){
    var f=el('div','card stack');
    f.appendChild(el('div','eyebrow','Je fouten ('+foutLijst.length+')'));
    foutLijst.slice(0,12).forEach(function(q){
      var d=el('div'); d.style.cssText='padding:9px 0;border-bottom:1px solid var(--line)';
      d.appendChild(elB('div','small',q.v));
      var u=elB('div','small muted',q.u); d.appendChild(u);
      d.appendChild(el('div','art',q.art||''));
      f.appendChild(d);
    });
    if(foutLijst.length>12) f.appendChild(el('div','small muted','En nog '+(foutLijst.length-12)+' andere. Ze staan in je foutenbak.'));
    var ob=el('button','btn wide','Fouten direct oefenen');
    ob.onclick=function(){ examState=null; startQuiz(foutLijst.slice(0,15),'Foutenbak'); };
    f.appendChild(ob);
    h.appendChild(f);
  }
  var ab=el('button','btn sec wide','Terug naar overzicht');
  ab.onclick=function(){ examState=null; TAB='vandaag'; teken(); };
  h.appendChild(ab);
  v.appendChild(h); $('#main').scrollTop=0;
}

function vPass(v){
  var t=passTier();
  var h=el('div','stack');
  h.appendChild(el('h2',null,'Battle pass'));
  var c=el('div','card stack');
  c.appendChild(el('div','eyebrow','Tier '+t+' van 30'));

  c.appendChild(el('div','small muted', volgende ? ((volgende.xp-S.xp)+' XP tot tier '+volgende.tier+': '+volgende.nm) : 'Alles vrijgespeeld. Netjes.'));

  h.appendChild(c);

  var strip=el('div','pass');
  PASS.forEach(function(p){
    var d=el('div','tier'+(S.xp>=p.xp?' unlocked':''));
    d.appendChild(el('div','n','TIER '+p.tier));
    d.appendChild(el('div','ic',p.ic));
    d.appendChild(el('div','nm',p.nm));
    d.appendChild(el('div','art tnum',p.xp+' XP'));

  });
  h.appendChild(strip);

  var u=el('div','card stack');
  u.appendChild(el('div','eyebrow','Uitdagingen'));
  var uit=[
    {nm:'Maak vandaag een quiz van 10 vragen', xp:10, klaar:S.laatsteDag===vandaagStr()},
    {nm:'Werk je foutenbak leeg', xp:40, klaar:S.fout.length===0},
    {nm:'Zet 10 borden in bakje 3 of hoger', xp:30, klaar:SIGNS.filter(function(s){return bakVan(s.c)>=3}).length>=10},
    {nm:'Haal een proefexamen', xp:60, klaar:S.examens.some(function(e){return !e.gezakt})},
    {nm:'Zeven dagen op rij leren', xp:70, klaar:S.streak>=7}
  ];
  uit.forEach(function(x){
    var r=el('div'); r.style.cssText='display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)';
    var l=el('div','small',(x.klaar?'✓ ':'○ ')+x.nm); if(x.klaar) l.style.color='var(--goed)';
    r.appendChild(l); r.appendChild(el('div','art','+'+x.xp+' XP'));
    u.appendChild(r);
  });
  h.appendChild(u);

  var w=el('div','card stack');
  w.appendChild(el('div','eyebrow','Let op'));
  w.appendChild(el('div','small muted','Dit is zelfgemaakt lesmateriaal op basis van het RVV 1990, de WVW 1994 en de Regeling voertuigen. Het is geen officieel CBR-materiaal. Maak daarnaast de voorbeeldvragen van het CBR zelf.'));
  h.appendChild(w);
  v.appendChild(h);
}
