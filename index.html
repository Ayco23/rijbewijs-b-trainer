bijzonder: [
  {t:'mc', k:'uitrit-verlaten-voorgaan', b:'voorrang-uitrit', v:'Je rijdt hier een uitrit uit, de weg op. Wat doe je?', o:['Je laat al het verkeer voorgaan, ook de voetgangers','Je gaat voor, je komt van rechts','Je stopt verplicht en rijdt dan door'], a:0, u:'Een uitrit verlaten is een bijzondere manoeuvre. Je laat al het verkeer voorgaan, ook voetgangers op het trottoir.', art:'RVV 1990, art. 54'},
  {t:'jn', k:'vluchtstrook-file-omzeilen', b:'bijz-file', v:'Je staat hier in de file en de vluchtstrook is leeg. Mag je die gebruiken om door te rijden?', a:1, u:'Nee. De vluchtstrook is uitsluitend voor noodgevallen.', art:'RVV 1990, art. 43'},
  {t:'mc', k:'autoweg-minimumsnelheid', b:'weg-autoweg', v:'Je rijdt hier. Hoe hard moet je voertuig minimaal kunnen en mogen rijden?', o:['50 km per uur','40 km per uur','60 km per uur'], a:0, u:'Op de autoweg 50 km per uur, op de autosnelweg 60 km per uur.', art:'RVV 1990, art. 42'},
  {t:'mc', k:'tunnel-file-eerste-actie', b:'bijz-tunnel', v:'Je rijdt hier de tunnel in en er ontstaat file. Wat doe je als eerste?', o:['Alarmlichten aan en afstand houden','Keren en de tunnel weer uit rijden','Uitstappen om te kijken wat er is'], a:0, u:'Alarmlichten aan, afstand houden en bij langer stilstaan de motor uit. Keren in een tunnel mag niet en is levensgevaarlijk.', art:'WVW 1994, art. 5'},
  {t:'mc', k:'overweg-andreaskruis-naderen', b:'bijz-overweg-and', v:'Je nadert deze overweg. Wat doe je?', o:['Snelheid minderen en goed naar beide kanten kijken','Op snelheid doorrijden, er waarschuwt niets','Altijd volledig stoppen voor het kruis'], a:0, u:'Er zijn geen bomen of lichten die je waarschuwen, dus je kijkt zelf. Steek alleen over als je er helemaal voorbij kunt.', art:'RVV 1990, art. 14'},
  {t:'multi', k:'invoegen-snelweg-handelingen', b:'weg-invoegen', v:'Je rijdt hier de invoegstrook op naar de snelweg. Wat hoort daarbij? Vink alles aan wat klopt.', o:['Je snelheid aanpassen aan het verkeer op de snelweg','Richting aangeven','Over je schouder kijken','Aan het eind van de strook stoppen als het druk is'], a:[0,1,2], u:'Stilstaan aan het eind van de invoegstrook is juist gevaarlijk; je kunt dan niet meer mee op snelheid.', art:'RVV 1990, art. 54 en 55'},
  {t:'jn', k:'erf-parkeren-buiten-vak', b:'bijz-erf', v:'Je zet je auto hier op het erf buiten de vakken neer. Mag dat?', a:1, u:'Nee. Op een erf parkeer je alleen in de vakken of op plaatsen met de letter P.', art:'RVV 1990, art. 46'},
  {t:'mc', k:'blokmarkering-betekenis', b:'tekens-markering-blok', v:'Je ziet hier een blokmarkering naast je rijstrook. Wat betekent die?', o:['Daar splitst een rijstrook af of voegt er een in','Je mag er niet overheen rijden','Het is een vluchtstrook'], a:0, u:'Een blokmarkering scheidt bijvoorbeeld een uitvoeg- of invoegstrook van de doorgaande rijbaan. Overschrijden mag.', art:'RVV 1990, art. 76'},
  {t:'mc', k:'rotonde-tweestrooks-derde-afslag', b:'bo-rotonde', v:'Je rijdt hier een rotonde met twee rijstroken op en moet de derde afslag hebben. Welke strook kies je?', o:['De binnenste, en op tijd naar buiten wisselen','De buitenste, helemaal tot je afslag','Dat maakt niet uit, je wisselt vlak voor de afslag'], a:0, u:'Voor een latere afslag gebruik je de binnenste strook en wissel je op tijd naar buiten, met richting aangeven en een schouderblik.', art:'RVV 1990, art. 54 en 55'},
  {t:'jn', k:'achteruit-parkeervak-voorgaan', b:'bijz-achteruit', v:'Je rijdt hier achteruit het parkeervak uit. Moet je al het andere verkeer voor laten gaan?', a:0, u:'Ja. Achteruitrijden is een bijzondere manoeuvre. Je laat al het overige verkeer voorgaan en kijkt goed, ook naar wat je niet kunt zien.', art:'RVV 1990, art. 54'},
  {t:'mc', k:'afrit-waar-afremmen', b:'weg-autosnelweg', v:'Je verlaat hier de snelweg via een afrit met een scherpe bocht. Waar rem je af?', o:['Op de uitvoegstrook, vóór de bocht','Pas in de bocht zelf','Op de doorgaande rijbaan, vóór de afrit'], a:0, u:'Remmen doe je op de uitvoegstrook, niet op de doorgaande rijbaan en niet in de bocht zelf.', art:'RVV 1990, art. 19'},
  {t:'mc', k:'smalle-weg-vrachtwagen-tegemoet', b:'weg-buitenkom', v:'Je rijdt hier op een smalle weg en er komt een vrachtwagen aan. Wat doe je?', o:['Snelheid minderen en zo ver mogelijk rechts houden','Op snelheid doorrijden, er is ruimte genoeg','Midden op de weg blijven en hem laten uitwijken'], a:0, u:'Rechts houden en snelheid minderen. Let op de zuigende luchtstroom en op een zachte berm.', art:'RVV 1990, art. 3'},
  {t:'multi', k:'autoweg-verboden-weggebruikers', b:'weg-autoweg', v:'Je rijdt hier. Welke van deze weggebruikers horen hier niet te rijden? Vink alles aan wat klopt.', o:['Een bromfiets','Een landbouwtrekker','Een fietser','Een auto met caravan'], a:[0,1,2], u:'Alleen motorvoertuigen die minimaal 50 km per uur kunnen en mogen rijden zijn toegestaan. Een auto met caravan mag er dus wel.', art:'RVV 1990, art. 42'},
  {t:'mc', k:'overweg-lichten-knipperen-door', b:'bijz-overweg-licht', v:'De bomen gaan hier omhoog, maar de rode lichten knipperen nog. Wat doe je?', o:['Wachten tot de lichten uit zijn','Oversteken, de bomen zijn immers omhoog','Langzaam oversteken en goed kijken'], a:0, u:'Zolang de rode lichten knipperen mag je niet oversteken; er kan een tweede trein aankomen.', art:'RVV 1990, art. 71'},
  {t:'jn', k:'busstrook-file-vermijden', b:'weg-busstrook', v:'Je staat in de file en de strook hiernaast met het opschrift LIJNBUS is leeg. Mag je die gebruiken?', a:1, u:'Nee. Een busbaan of busstrook is alleen voor lijnbussen en voor de voertuigen die op een onderbord staan.', art:'RVV 1990, art. 81'},
  {t:'mc', k:'wegrijden-vanaf-kant-volgorde', v:'Je wilt vanuit een parkeervak langs de kant wegrijden. Wat is de juiste volgorde?', o:['Spiegels, richting aangeven, schouderblik, dan pas wegrijden','Richting aangeven, wegrijden en daarna in je spiegel kijken','In je spiegel kijken en meteen wegrijden'], a:0, u:'Wegrijden is een bijzondere manoeuvre: eerst kijken en aangeven, daarna pas rijden, en al het verkeer gaat voor.', art:'RVV 1990, art. 54 en 55'}
],

tekens: [
  {t:'mc', k:'rangorde-bord-boven-regel', v:'Een verkeersbord zegt iets anders dan de gewone verkeersregel. Wat volg je?', o:['Het verkeersbord','De verkeersregel','Wat jou op dat moment het veiligst lijkt'], a:0, u:'Verkeerstekens gaan boven de verkeersregels. Verkeerslichten gaan weer boven de tekens, en aanwijzingen van een verkeersregelaar boven alles.', art:'RVV 1990, art. 84'},
  {t:'jn', k:'rode-rand-is-gebod', v:'Je ziet een rond bord met een rode rand en een witte achtergrond. Betekent zo’n bord een gebod?', a:1, u:'Nee. Een rode rand met wit duidt op een verbod of een geslotenverklaring. Een blauwe cirkel is het gebod.', art:'RVV 1990, bijlage 1'},
  {t:'mc', k:'gele-streep-doorgetrokken', v:'Langs de rand van de weg ligt een gele doorgetrokken streep. Wat mag je daar niet?', o:['Stilstaan','Alleen parkeren; stilstaan mag er wel','Alleen laden en lossen'], a:0, u:'Geel doorgetrokken verbiedt stilstaan. Geel onderbroken verbiedt alleen parkeren.', art:'RVV 1990, art. 23 en 24'},
  {t:'mc', k:'dubbele-doorgetrokken-inhalen', b:'weg-inhalen-streep', v:'Je wilt hier inhalen. In het midden liggen twee doorgetrokken strepen. Mag dat?', o:['Nee, je mag die strepen niet overschrijden','Ja, als er geen tegenligger aankomt','Ja, maar alleen om landbouwverkeer te passeren'], a:0, u:'Een doorgetrokken streep mag je niet overschrijden, en bij een dubbele geldt dat voor beide richtingen.', art:'RVV 1990, art. 76'},
  {t:'multi', k:'tekens-die-jou-laten-wachten', v:'Je nadert een kruispunt. Bij welke van deze tekens moet jij voorrang verlenen? Vink alles aan wat klopt.', o:['Haaientanden op het wegdek','Een omgekeerde driehoek met een rode rand','Een achthoekig rood bord met STOP','Een bord met een gele ruit'], a:[0,1,2], u:'De gele ruit geeft jou juist voorrang: je rijdt dan op een voorrangsweg.', art:'RVV 1990, art. 80 en bijlage 1'},
  {t:'mc', k:'onderbord-beperkt-verbod', b:'tekens-bord-onderbord', v:'Je ziet hier een verbodsbord met daaronder een wit bord met zwarte letters. Wat doet dat onderbord?', o:['Het beperkt of verruimt het bord erboven','Het is een advies dat je mag negeren','Het geldt alleen voor fietsers'], a:0, u:'Een onderbord geeft een voorwaarde: een tijdvak, een afstand, een richting of een uitzondering.', art:'RVV 1990, art. 67'},
  {t:'jn', k:'groene-pijl-naast-rood', v:'Naast het rode licht brandt een groene pijl naar rechts. Mag je rechtsaf als je het andere verkeer voor laat gaan?', a:0, u:'Ja. De pijl geeft toestemming voor die richting. Verkeer dat al groen heeft, zoals fietsers en voetgangers, gaat voor.', art:'RVV 1990, art. 68'},
  {t:'mc', k:'rood-kruis-groene-pijl', b:'weg-rijstrook-kruis', v:'Boven de rijstroken hangen hier een rood kruis en een groene pijl omlaag. Waar mag je rijden?', o:['Onder de groene pijl','Onder het rode kruis','Op allebei de stroken'], a:0, u:'Een groene pijl omlaag betekent dat de strook open is; een rood kruis betekent gesloten. Gebruik de strook pas weer als het kruis weg is.', art:'RVV 1990, art. 73'},
  {t:'mc', k:'wit-buslicht-betekenis', b:'tekens-bus-licht', v:'Je ziet bij deze halte een wit licht branden. Wat betekent dat voor jou?', o:['Niets: dat licht is voor de bestuurder van de bus of tram','Dat je moet stoppen','Dat jij voorrang hebt'], a:0, u:'De witte lichten zijn bestemd voor bestuurders van een tram of lijnbus, niet voor het overige verkeer.', art:'RVV 1990, art. 70'},
  {t:'jn', k:'bord-half-achter-boom', v:'Een verkeersbord zit half achter een boom. Geldt dat bord dan nog voor jou?', a:0, u:'Ja, het bord geldt. Is het echt niet te zien, dan kan dat bij een bekeuring een argument zijn. Meld slecht zichtbare borden bij de wegbeheerder.', art:'RVV 1990, art. 63'},
  {t:'mc', k:'haaientanden-wegdek-handelen', b:'bo-haaientanden', v:'Je nadert dit kruispunt en op jouw weg liggen haaientanden. Wat doe je?', o:['Je mindert vaart en laat het verkeer op de kruisende weg voorgaan','Je stopt altijd eerst bij de tanden','Je rijdt door, jij hebt voorrang'], a:0, u:'De punten wijzen naar de bestuurder die voorrang moet verlenen. Stoppen hoeft niet als het vrij is.', art:'RVV 1990, art. 80'},
  {t:'multi', k:'verbodsborden-herkennen', v:'Je let onderweg op de vorm en de kleur van borden. Welke van deze zijn verbodsborden? Vink alles aan wat klopt.', o:['Een rode cirkel met een wit vlak en een getal','Een rode cirkel met een doorgestreept symbool','Een rode cirkel met een wit balkje','Een blauwe cirkel met een witte pijl'], a:[0,1,2], u:'Een blauwe cirkel is een gebod en een rode driehoek een waarschuwing.', art:'RVV 1990, bijlage 1'},
  {t:'mc', k:'verkeerslicht-helemaal-uit', v:'Het verkeerslicht voor je is helemaal uit en knippert ook niet. Wat doe je?', o:['Je kijkt naar de borden en de markering, en anders geldt verkeer van rechts','Je rijdt door, de regeling is buiten werking','Je stopt eerst verplicht bij de streep'], a:0, u:'Zonder werkende lichten val je terug op de verkeerstekens en anders op de verkeersregels.', art:'RVV 1990, art. 84'},
  {t:'mc', k:'erfbord-wat-verandert', b:'bijz-erf', v:'Je rijdt hier een erf op. Wat verandert er voor jou vanaf dat bord?', o:['Je rijdt stapvoets en voetgangers mogen de hele breedte gebruiken','Je mag 30 km per uur en voetgangers blijven op de stoep','Er verandert niets, het is alleen een aanduiding'], a:0, u:'Op een erf rijd je stapvoets, niet harder dan 15 km per uur, en voetgangers mogen de volle breedte van de weg gebruiken.', art:'RVV 1990, art. 44 en 45'},
  {t:'jn', k:'regelaar-stopt-je-bij-groen', b:'tekens-regelaar', v:'Het licht staat op groen, maar de verkeersregelaar geeft jou een stopteken. Moet je stoppen?', a:0, u:'Ja. Aanwijzingen van een bevoegde verkeersregelaar gaan boven verkeerslichten, borden en regels.', art:'RVV 1990, art. 82 en 84'},
  {t:'mc', k:'einde-zone-doorgestreept', b:'weg-30zone', v:'Je rijdt in deze zone en komt een bord tegen waarop de 30 schuin is doorgestreept. Wat betekent dat?', o:['De zone is afgelopen; de normale snelheid van die weg geldt weer','Je mag vanaf daar overal 50 km per uur','Je moet nog 30 blijven rijden tot het kruispunt'], a:0, u:'Een zonebord geldt tot het bijbehorende eindbord. Daarna geldt de snelheid die bij die weg hoort, binnen de kom meestal 50.', art:'RVV 1990, art. 20'}
],

veilig: [
  {t:'mc', k:'reactieafstand-tachtig', b:'voert-remweg', v:'Je rijdt 80 km per uur en er steekt plotseling iemand over. Hoeveel meter leg je af voor je begint te remmen?', o:['Ongeveer 22 meter','Ongeveer 5 meter','Ongeveer 60 meter'], a:0, u:'Bij ongeveer één seconde reactietijd leg je op 80 km per uur ruim 22 meter af voordat je ook maar begint te remmen.', art:'Rijtechnisch gegeven'},
  {t:'jn', k:'beladen-auto-remweg', v:'Je rijdt met een volgeladen auto. Is je remweg dan langer dan met een lege auto?', a:0, u:'Ja, in de regel wel. Meer massa betekent meer energie die de remmen moeten wegwerken, dus een langere remweg.', art:'Rijtechnisch gegeven'},
  {t:'mc', k:'zomerbanden-vier-graden', b:'veilig-gladheid', v:'Je rijdt hier met zomerbanden bij vier graden. Wat is het grootste risico?', o:['Veel minder grip bij remmen en sturen','Dat je banden sneller slijten','Dat je meer brandstof verbruikt'], a:0, u:'Zomerbandenrubber wordt hard onder ongeveer zeven graden. De grip neemt sterk af, juist bij remmen en sturen.', art:'Regeling voertuigen'},
  {t:'mc', k:'rook-onder-motorkap', v:'Er komt rook onder je motorkap vandaan terwijl je rijdt. Wat doe je?', o:['Veilig stoppen, motor uit, afstand nemen en bij vuur 112 bellen','Doorrijden naar de dichtstbijzijnde garage','Stoppen en de motorkap meteen helemaal openen'], a:0, u:'Stop veilig, zet de motor uit en blijf uit de buurt. De kap helemaal openen geeft het vuur zuurstof.', art:'WVW 1994, art. 5'},
  {t:'multi', k:'reactietijd-langer-avondrit', v:'Je moet vanavond nog twee uur rijden. Wat maakt je reactietijd langer? Vink alles aan wat klopt.', o:['Dat je moe bent','Een glas alcohol','Een medicijn met een waarschuwing op de verpakking','Je telefoon bedienen onder het rijden','Onderweg even pauzeren'], a:[0,1,2,3], u:'Alles wat je aandacht of je alertheid aantast, maakt je reactietijd langer. Een pauze doet juist het omgekeerde.', art:'WVW 1994, art. 5 en 8'},
  {t:'mc', k:'onderstuur-natte-bocht', b:'veilig-regen', v:'Je rijdt hier door een bocht en je voorwielen schuiven rechtdoor. Wat doe je?', o:['Gas los en minder insturen','Harder insturen','Vol op de rem'], a:0, u:'Dat is onderstuur. Harder insturen helpt niet; je neemt gas terug zodat de voorwielen weer grip krijgen.', art:'Rijtechnisch gegeven'},
  {t:'jn', k:'abs-sturen-tijdens-remmen', v:'Je maakt een noodstop met ABS en er ligt iets op de weg. Kun je tijdens het remmen blijven sturen?', a:0, u:'Ja, dat is precies het voordeel: de wielen blokkeren niet, dus je kunt tijdens het remmen blijven sturen.', art:'Regeling voertuigen'},
  {t:'mc', k:'ongeval-eerste-handeling', b:'veilig-ongeval', v:'Je komt hier als eerste bij een ongeval aan. Wat doe je als eerste?', o:['Zorgen dat je zelf veilig staat','Meteen naar de slachtoffers toe lopen','Foto’s maken voor de verzekering'], a:0, u:'Zorg eerst dat je zelf veilig staat, waarschuw dan het overige verkeer en verleen daarna hulp. Anders word je zelf een slachtoffer.', art:'WVW 1994, art. 7'},
  {t:'mc', k:'verblind-door-tegenligger', b:'veilig-verblinding', v:'Je wordt hier verblind door de tegenligger. Wat doe je?', o:['Naar de rechterkant van de weg kijken en snelheid minderen','Ook je groot licht aanzetten','Vol remmen en stilstaan'], a:0, u:'Richt je blik op de rechterwegrand en minder snelheid. Terugschijnen maakt het voor jullie allebei erger.', art:'RVV 1990, art. 32 lid 2'},
  {t:'multi', k:'pech-buiten-kom-handelingen', b:'veilig-pech', v:'Je staat hier met pech langs een weg buiten de bebouwde kom. Wat doe je? Vink alles aan wat klopt.', o:['Je alarmlichten aanzetten','Een veiligheidshesje aantrekken','De gevarendriehoek op ongeveer 30 meter zetten','Achter de vangrail of in de berm wachten','In de auto blijven zitten'], a:[0,1,2,3], u:'Blijf nooit op de rijbaan staan en ga op een drukke weg ook niet in de auto zitten.', art:'RVV 1990, art. 58'},
  {t:'jn', k:'blikschade-doorrijden', v:'Je bent betrokken bij een aanrijding met alleen blikschade. Mag je doorrijden?', a:1, u:'Nee. Doorrijden na een ongeval is strafbaar, ook bij alleen blikschade. Je wisselt gegevens uit of laat ze achter.', art:'WVW 1994, art. 7'},
  {t:'mc', k:'dodehoek-vrachtwagen', b:'veilig-dodehoek', v:'Je rijdt hier naast een vrachtwagen. Wat doe je?', o:['Erachter blijven of er ruim en vlot voorbijgaan','Rustig naast de cabine blijven rijden','Dicht achter hem gaan hangen'], a:0, u:'Hang niet naast de cabine. Blijf erachter of ga er ruim voorbij, zodat de chauffeur je kan zien.', art:'WVW 1994, art. 5'},
  {t:'mc', k:'blikveld-bij-hoge-snelheid', v:'Je snelheid neemt toe. Wat gebeurt er met wat je ziet?', o:['Je blikveld wordt smaller','Je ziet juist meer van wat van opzij komt','Er verandert niets aan je zicht'], a:0, u:'Hoe harder je rijdt, hoe smaller je blikveld wordt. Je ziet minder van wat van opzij komt.', art:'Rijtechnisch gegeven'},
  {t:'jn', k:'microslaap-honderd-meter', v:'Je valt bij 100 km per uur vier seconden weg. Heb je dan meer dan honderd meter blind gereden?', a:0, u:'Ja. Op 100 km per uur leg je per seconde bijna 28 meter af. Vier seconden is meer dan honderd meter zonder te kijken.', art:'Rijtechnisch gegeven'},
  {t:'mc', k:'hulpdiensten-passeren-snelweg', b:'veilig-ongeval', v:'Je nadert hier een ongeval waar de hulpdiensten al bezig zijn. Wat doe je?', o:['Snelheid minderen, ruimte houden en doorrijden','Langzaam langsrijden om te zien of je kunt helpen','Op de vluchtstrook stoppen'], a:0, u:'Kijkfiles veroorzaken nieuwe ongelukken. Minder snelheid, hou ruimte en rijd door.', art:'WVW 1994, art. 5'}
],

milieu: [
  {t:'mc', k:'zuinig-rijden-in-de-stad', v:'Je rijdt veel in de stad en wilt zuiniger rijden. Wat levert het meeste op?', o:['Vooruitkijken en vloeiend rijden','Zo snel mogelijk optrekken naar de maximumsnelheid','De airco uitzetten'], a:0, u:'Vloeiend rijden voorkomt onnodig optrekken en remmen; daar zit de grootste winst, en het is ook veiliger.', art:'Het Nieuwe Rijden'},
  {t:'jn', k:'korte-rit-koude-motor', v:'Je rijdt elke dag drie kilometer naar je werk. Verbruik je dan meer per kilometer dan op een lange rit?', a:0, u:'Ja. De eerste kilometers zijn het duurst, want een koude motor verbruikt meer. Korte ritten zijn daardoor relatief onzuinig.', art:'Het Nieuwe Rijden'},
  {t:'mc', k:'warmdraaien-op-de-oprit', b:'milieu-stilstaan', v:'Je laat je auto hier warmdraaien voordat je wegrijdt. Wat klopt?', o:['Het is onnodig en verspilt brandstof','Het is beter voor de motor','Bij vorst ben je er zelfs toe verplicht'], a:0, u:'Een moderne motor warmt het snelst op tijdens rustig rijden. Stationair warmdraaien kost alleen maar brandstof.', art:'Het Nieuwe Rijden'},
  {t:'multi', k:'verbruik-op-vakantie', v:'Je gaat met een volle auto op vakantie. Wat verhoogt je verbruik? Vink alles aan wat klopt.', o:['Een dakkoffer','Te lage bandenspanning','Bagage die je niet nodig hebt','Hard rijden op de snelweg','Rustig optrekken'], a:[0,1,2,3], u:'Rustig optrekken verlaagt het verbruik juist. De rest kost allemaal extra brandstof.', art:'Het Nieuwe Rijden'},
  {t:'mc', k:'alcohol-afbraak-per-uur', b:'wet-alcohol', v:'Je hebt gisteravond gedronken. Hoeveel standaardglazen breekt je lichaam ongeveer per uur af?', o:['Ongeveer één glas','Ongeveer twee glazen','Ongeveer drie glazen'], a:0, u:'Ongeveer één glas per uur. Je kunt dat niet versnellen met koffie, eten of een douche.', art:'WVW 1994, art. 8'},
  {t:'jn', k:'telefoon-in-houder-navigeren', b:'wet-telefoon', v:'Je navigeert met je telefoon in een houder aan de voorruit. Mag dat?', a:0, u:'Ja, in een houder mag. Vasthouden mag niet. Stel je route bij voorkeur in vóór vertrek.', art:'RVV 1990, art. 61a'},
  {t:'mc', k:'agressief-rijden-verbruik', v:'Je trekt hard op en remt steeds laat. Wat doet dat met je verbruik?', o:['Het stijgt fors','Het blijft ongeveer gelijk','Het daalt, want je bent eerder thuis'], a:0, u:'Hard optrekken en laat remmen kan het verbruik tientallen procenten verhogen, en verhoogt ook het ongevalsrisico.', art:'Het Nieuwe Rijden'},
  {t:'mc', k:'milieuzone-niet-toegestaan', b:'milieu-zone', v:'Je rijdt hier een milieuzone in met een auto die niet aan de eisen voldoet. Wat gebeurt er?', o:['Je bent in overtreding en krijgt een boete via je kenteken','Je mag er één keer per dag in','Je mag er stapvoets doorheen'], a:0, u:'Camera’s lezen je kenteken. Voldoe je niet aan de eisen van de zone, dan volgt een boete.', art:'RVV 1990, art. 86d'},
  {t:'jn', k:'elektrisch-helemaal-schoon', v:'Je vriend zegt dat een elektrische auto helemaal geen uitstoot veroorzaakt. Klopt dat?', a:1, u:'Nee. Tijdens het rijden stoot een elektrische auto niets uit, maar de productie van accu’s en het opwekken van stroom kosten wel energie. Lokaal is de winst het grootst.', art:'Milieubeleid rijksoverheid'},

<script>
/* Taferelen bij de lesstof: 18 schematische diagrammen als inline SVG.
   Inline en niet als bestand, omdat de artifact-CSP externe afbeeldingen
   blokkeert — dezelfde reden als bij de borden.

   Kleurafspraak: lijnen en tekst gebruiken currentColor, zodat ze in het
   lichte en het donkere thema meelopen met de tekstkleur van de container.
   Vlakken op de achtergrond gebruiken var(--surface-2) en secundaire lijnen
   var(--line) / var(--fg-3) — dat zijn de variabelen die index.html echt
   definieert. Alleen echte verkeerskleuren staan hard in de code: asfalt,
   belijning, rood/oranje/groen en glas. Die betekenen iets en mogen dus niet
   per thema verschuiven.

   Elke functie geeft een string terug met een <svg> van 320 breed zonder
   height; index.html schaalt via CSS (width:100%). Mobiel-eerst: ze worden
   op ongeveer 360 px bekeken, dus lettergroottes blijven 11-13. */
(function(){

/* Hulpvormen. Ze staan binnen de IIFE en niet in het object zelf, want
   window.ILLUSTRATIES moet precies de 18 taferelen bevatten: index.html mag
   er overheen lopen zonder op hulpsleutels te stuiten. Ze geven een fragment
   terug zonder <svg>-wikkel, omdat ze altijd in een tafereel landen. */
function autoZij(kleur){
  return '<g>' +
    '<path d="M5 24h62v-6c0-2.4-1.8-4.2-4.8-4.8l-7.2-6c-1.8-1.8-3.6-2.4-6-2.4H26c-3 0-4.8 1-6.6 3L14 13.2C8 14.2 5 16.2 5 19z" fill="' + kleur + '"/>' +
    '<path d="M25 7h10v6H19z" fill="#cfe2ff" opacity=".85"/>' +
    '<path d="M37 7h7c1.6 0 2.4.5 3.6 1.7L51.2 13H37z" fill="#cfe2ff" opacity=".85"/>' +
    '<circle cx="20" cy="25" r="6.5" fill="#222"/><circle cx="20" cy="25" r="2.6" fill="#bbb"/>' +
    '<circle cx="54" cy="25" r="6.5" fill="#222"/><circle cx="54" cy="25" r="2.6" fill="#bbb"/>' +
    '</g>';
}
function mens(x, y, kleur){
  return '<g transform="translate(' + x + ' ' + y + ')">' +
    '<circle cx="0" cy="-18" r="5" fill="' + kleur + '"/>' +
    '<path d="M0 -13v10M-6 -8h12M0 -3l-5 9M0 -3l5 9" stroke="' + kleur + '" stroke-width="2.5" stroke-linecap="round" fill="none"/>' +
    '</g>';
}

window.ILLUSTRATIES = {

  /* Het sterkste diagram van de set: twee balken onder elkaar laten zien dat
     bij dubbele snelheid de reactieafstand verdubbelt maar de remweg vier
     keer zo lang wordt. Daarom staan beide balken op dezelfde schaal. */
  stopafstand: function(){
    return '<svg viewBox="0 0 320 170" width="100%" role="img" ' +
      'aria-label="Balkdiagram: bij 50 km per uur is de stopafstand ongeveer 14 plus 13 is 27 meter, bij 100 km per uur 28 plus 50 is 78 meter. De snelheid verdubbelt, de remweg wordt vier keer zo lang.">' +
      '<rect x="0" y="0" width="320" height="170" rx="8" fill="var(--surface-2)"/>' +
      /* Schaal: 1 meter = 3,4 px, zodat 78 m net binnen de breedte past. */
      '<text x="14" y="22" font-size="12" fill="currentColor" font-weight="700">Stopafstand</text>' +
      '<rect x="100" y="14" width="12" height="9" rx="2" fill="#2f6bbf"/>' +
      '<text x="117" y="22" font-size="11" fill="currentColor">reactie</text>' +
      '<rect x="168" y="14" width="12" height="9" rx="2" fill="#e8403f"/>' +
      '<text x="185" y="22" font-size="11" fill="currentColor">remweg</text>' +

      '<text x="14" y="52" font-size="12" fill="currentColor">50 km/h</text>' +
      '<rect x="14" y="58" width="48" height="18" rx="3" fill="#2f6bbf"/>' +
      '<rect x="62" y="58" width="44" height="18" rx="3" fill="#e8403f"/>' +
      '<text x="16" y="71" font-size="11" fill="#fff">14 m</text>' +
      '<text x="66" y="71" font-size="11" fill="#fff">13 m</text>' +
      '<text x="114" y="71" font-size="12" fill="currentColor" font-weight="700">= 27 m</text>' +

      '<text x="14" y="104" font-size="12" fill="currentColor">100 km/h</text>' +
      '<rect x="14" y="110" width="95" height="18" rx="3" fill="#2f6bbf"/>' +
      '<rect x="109" y="110" width="170" height="18" rx="3" fill="#e8403f"/>' +
      '<text x="16" y="123" font-size="11" fill="#fff">28 m</text>' +
      '<text x="113" y="123" font-size="11" fill="#fff">50 m</text>' +
      '<text x="14" y="146" font-size="12" fill="currentColor" font-weight="700">= 78 m</text>' +

      '<path d="M70 150h236" stroke="var(--fg-3)" stroke-width="1" stroke-dasharray="3 3"/>' +
      '<text x="76" y="163" font-size="11" fill="currentColor">2x snelheid = 4x remweg</text>' +
      '</svg>';
  },

  /* Twee seconden is de enige regel die je rijdend kunt tellen; de maatpijl
     laat zien dat het om tijd gaat en niet om een vast aantal meters. */
  tweeseconden: function(){
    return '<svg viewBox="0 0 320 130" width="100%" role="img" ' +
      'aria-label="Twee auto\'s achter elkaar met een tussenruimte van twee seconden.">' +
      '<rect x="0" y="40" width="320" height="56" fill="#424b58"/>' +
      '<rect x="0" y="66" width="320" height="3" fill="#fff" opacity=".2"/>' +
      '<g transform="translate(10 48)">' + autoZij('#f2c200') + '</g>' +
      '<g transform="translate(222 48)">' + autoZij('#2f6bbf') + '</g>' +
      '<path d="M86 104h148" stroke="currentColor" stroke-width="2"/>' +
      '<path d="M86 104l9-5v10zM234 104l-9-5v10z" fill="currentColor"/>' +
      '<rect x="134" y="94" width="52" height="20" rx="5" fill="var(--surface-2)" stroke="currentColor" stroke-width="1"/>' +
      '<text x="145" y="108" font-size="12" fill="currentColor" font-weight="700">2 sec</text>' +
      '<text x="10" y="26" font-size="12" fill="currentColor">Tel: 21 - 22 nadat de voorligger een punt passeert</text>' +
      '</svg>';
  },

  /* Bovenaanzicht: de spiegels dekken kegels af, en wat daartussen valt is de
     dode hoek. De fietser staat er in, want dat is het hele punt. */
  dodehoek: function(){
    return '<svg viewBox="0 0 320 150" width="100%" role="img" ' +
      'aria-label="Auto van bovenaf met spiegelvelden en het gearceerde dodehoekgebied, met een fietser daarin.">' +
      '<defs><pattern id="ill-arc" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect x="0" y="0" width="3" height="7" fill="#e8403f" opacity=".45"/></pattern></defs>' +
      '<rect x="0" y="0" width="320" height="150" rx="8" fill="var(--surface-2)"/>' +
      /* Spiegelvelden als lichte kegels vanuit de buitenspiegels. */
      '<path d="M118 52 L10 16 L10 60 Z" fill="#2f6bbf" opacity=".22"/>' +
      '<path d="M118 98 L10 134 L10 90 Z" fill="#2f6bbf" opacity=".22"/>' +
      /* Dode hoek: tussen spiegelveld en ooghoek, links achter. */
      '<path d="M122 96 L58 128 L22 128 L112 104 Z" fill="url(#ill-arc)" stroke="#e8403f" stroke-width="1"/>' +
      /* Auto van boven, neus naar rechts. */
      '<rect x="118" y="58" width="130" height="34" rx="12" fill="currentColor" opacity=".85"/>' +

<script>
/* Verkeerssituaties bij de vragen: inline SVG, gezien vanuit de bestuurdersstoel.

   - dezelfde reden als bij de borden en de lesillustraties.

   examenbeeld.js met overgenomen beeld op dezelfde sleutels; beeldVoor() in index.html
   kiest die eerst. Een sleutel die hier staat werkt dus overal, ook publiek.

   Afspraken, gelijk aan illustraties.js:
   - viewBox 320 breed, geen height; index.html schaalt via CSS
   - lijnen en tekst in currentColor zodat licht en donker thema meelopen
   - var(--surface-2) en var(--line) voor achtergrondvlakken
   - echte verkeerskleuren hard gecodeerd: asfalt, belijning, rood/oranje/groen, glas

(function(){

window.SITUATIES = {};

/* ======================= HULPVORMEN =======================

   situatie meetellen. Ze geven een fragment terug zonder <svg>-wikkel. */

/* Echte verkeerskleuren. Ze betekenen iets en mogen dus niet met het thema meebewegen. */
var ASFALT = '#4a5361', BERM = '#6f7a66', STREEP = '#ffffff';
var ROOD = '#c1121c', BLAUW = '#0b4ea2', GEEL = '#f2c200', GROEN = '#2b9c57';

function svgWikkel(hoogte, label, inhoud){
  return '<svg viewBox="0 0 320 ' + hoogte + '" width="100%" role="img" aria-label="' + label + '">' +
    inhoud + '</svg>';
}

/* De bestuurdersblik: lucht boven de horizon, berm eronder, wegdek als trapezium dat
   naar het verdwijnpunt toeloopt. Alle rijbaanvragen delen deze bak, zodat een bord of
   streep in elk tafereel op dezelfde hoogte en schaal staat. */
var HORIZON = 72;
function wegVooruit(hoogte, linksOnder, rechtsOnder, linksBoven, rechtsBoven){
  return '<rect x="0" y="0" width="320" height="' + HORIZON + '" fill="var(--surface-2)"/>' +
    '<rect x="0" y="' + HORIZON + '" width="320" height="' + (hoogte - HORIZON) + '" fill="' + BERM + '"/>' +
    '<path d="M' + linksBoven + ' ' + HORIZON + 'H' + rechtsBoven + 'L' + rechtsOnder + ' ' + hoogte +
      'H' + linksOnder + 'Z" fill="' + ASFALT + '"/>';
}
/* Een streep in perspectief: van een punt op de horizon naar een punt onderaan. */
function streep(xBoven, xOnder, hoogte, kleur, breedOnder, streepjes){
  var k = kleur || STREEP;
  return '<path d="M' + xBoven + ' ' + HORIZON + 'L' + xOnder + ' ' + hoogte + '" stroke="' + k +
    '" stroke-width="' + (breedOnder || 4) + '" fill="none"' +
    (streepjes ? ' stroke-dasharray="' + streepjes + '"' : '') + '/>';

/* Borden worden schematisch nagetekend (vorm + kleur + symbool) en niet uit borden.js

function paal(x, yTop, yBodem){
  return '<rect x="' + (x - 1.6) + '" y="' + yTop + '" width="3.2" height="' + (yBodem - yTop) +
    '" fill="var(--fg-3)"/>';

function bordRond(x, y, r, binnen){
  return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#f7fbf5" stroke="' + ROOD +
    '" stroke-width="' + (r * 0.30) + '"/>' + (binnen || '');

function bordBlauwVlak(x, y, b, h, binnen){
  return '<rect x="' + (x - b / 2) + '" y="' + (y - h / 2) + '" width="' + b + '" height="' + h +

}
function bordWitVlak(x, y, b, h, binnen){
  return '<rect x="' + (x - b / 2) + '" y="' + (y - h / 2) + '" width="' + b + '" height="' + h +

}
function bordDriehoek(x, y, b, binnen){
  var h = b * 0.87;
  return '<path d="M' + x + ' ' + (y - h / 2) + 'L' + (x + b / 2) + ' ' + (y + h / 2) + 'H' + (x - b / 2) +

function bordB6(x, y, b){
  var h = b * 0.87;
  return '<path d="M' + (x - b / 2) + ' ' + (y - h / 2) + 'H' + (x + b / 2) + 'L' + x + ' ' + (y + h / 2) +
    'Z" fill="#f7fbf5" stroke="' + ROOD + '" stroke-width="' + (b * 0.15) + '" stroke-linejoin="round"/>';
}
function bordB7(x, y, r){
  var p = '', i, a;
  for(i = 0; i < 8; i++){
    a = (Math.PI / 4) * i + Math.PI / 8;
    p += (i ? 'L' : 'M') + (x + r * Math.cos(a)).toFixed(1) + ' ' + (y + r * Math.sin(a)).toFixed(1);
  }
  return '<path d="' + p + 'Z" fill="' + ROOD + '" stroke="#fff" stroke-width="1.6"/>' +
    '<text x="' + x + '" y="' + (y + r * 0.32) + '" text-anchor="middle" font-size="' + (r * 0.8) +
    '" font-weight="800" fill="#fff">STOP</text>';

/* B1: gele ruit met witte rand. */
function bordB1(x, y, r){
  return '<path d="M' + x + ' ' + (y - r) + 'L' + (x + r) + ' ' + y + 'L' + x + ' ' + (y + r) + 'L' + (x - r) +
    ' ' + y + 'Z" fill="#fff"/>' +
    '<path d="M' + x + ' ' + (y - r * 0.62) + 'L' + (x + r * 0.62) + ' ' + y + 'L' + x + ' ' + (y + r * 0.62) +
    'L' + (x - r * 0.62) + ' ' + y + 'Z" fill="' + GEEL + '"/>';

/* F5: rode pijl omhoog (jij) rechts, zwarte pijl omlaag links - zo staat hij in RVV
   bijlage 1, en de richting van de pijlen is precies waar de vraag over gaat. */
function bordF5(x, y, r){
  var pijl = function(px, op, kl){
    var t = op ? -1 : 1;
    return '<path d="M' + px + ' ' + (y + t * r * 0.55) + 'l' + (r * 0.26) + ' ' + (t * r * 0.3) +
      'h' + (-r * 0.13) + 'v' + (-t * r * 0.85) + 'h' + (-r * 0.26) + 'v' + (t * r * 0.85) +
      'h' + (-r * 0.13) + 'Z" fill="' + kl + '"/>';
  };
  return bordRond(x, y, r, '') + pijl(x + r * 0.33, true, ROOD) + pijl(x - r * 0.33, false, GRIJS);

/* Auto van achteren: dat is wat je als bestuurder van je voorligger ziet. */
function autoAchter(x, y, b, kleur){

    '<rect x="' + (b / 2 - b * 0.2) + '" y="' + (-h * 0.42) + '" width="' + (b * 0.16) + '" height="' +

function autoVoor(x, y, b, kleur){

/* Beweging. GEEN_BEWEGING staat in index.html en kan bij het laden van dit bestand nog
   niet bestaan, dus hij wordt pas bij het tekenen uitgelezen - net als sceneSVG() doet.
   Het meegegeven pad eindigt altijd op het beslismoment: staat beweging uit, dan springt
   het voertuig daar in een tik naartoe en blijft staan. */
function stil(){
  return !!window.GEEN_BEWEGING;
}
function motie(pad, dur, draai){
  var r = draai || '0';
  if(stil()){
    return '<animateMotion dur="0.001s" fill="freeze" rotate="' + r + '" path="' + pad +
      '" keyPoints="1;1" keyTimes="0;1" calcMode="linear"/>';
  }
  return '<animateMotion dur="' + dur + 's" repeatCount="indefinite" rotate="' + r + '" path="' + pad + '"/>';
}
/* Een zwaailicht dat uit gaat als beweging uit staat: knipperen is ook beweging. */
function zwaai(x, y, r, kleur){
  var c = '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + kleur + '"';
  if(stil()) return c + '/>';
  return c + '><animate attributeName="opacity" values="1;0.25;1" dur="0.6s" repeatCount="indefinite"/></circle>';
}

/* De bo-taferelen zijn van bovenaf, net als de bestaande puzzels: op een kruispunt is
   dat het enige aanzicht waarin alle vier de takken tegelijk te zien zijn. */
function kruisBoven(hoogte){
  var h = hoogte;
  return '<rect x="0" y="0" width="320" height="' + h + '" fill="var(--surface-2)"/>' +
    '<rect x="0" y="' + (h / 2 - 34) + '" width="320" height="68" fill="' + ASFALT + '"/>' +
    '<rect x="126" y="0" width="68" height="' + h + '" fill="' + ASFALT + '"/>' +
    '<path d="M0 ' + (h / 2) + 'h110M210 ' + (h / 2) + 'h110" stroke="' + STREEP + '" stroke-width="2" ' +
    'stroke-dasharray="12 10"/>' +
    '<path d="M160 0v' + (h / 2 - 40) + 'M160 ' + (h / 2 + 40) + 'V' + h + '" stroke="' + STREEP +
    '" stroke-width="2" stroke-dasharray="12 10"/>';
}
/* Haaientanden als rij driehoekjes die naar jou wijzen. */
function haaientanden(x, y, aantal, richting){
  var s = '', i, bx;
  for(i = 0; i < aantal; i++){
    bx = x + i * 9;
    s += '<path d="M' + bx + ' ' + y + 'h7l-3.5 ' + (richting * 7) + 'Z" fill="' + STREEP + '"/>';
  }
  return s;
}

<script>
/* Verkeerssituaties, deel 2: veilig rijden, verkeerstekens, milieu, wetgeving,
   voertuigkennis. Zie situaties.js voor de afspraken en docs/beeldsleutels.md voor
   de namenlijst.

   Gesplitst over twee bestanden zodat er parallel aan getekend kan worden; de app ziet
   één window.SITUATIES. Dit bestand vult aan en vervangt niet, dus het moet ná
   situaties.js geladen worden. */
(function(){

if(!window.SITUATIES) window.SITUATIES = {};

/* ---------------------------------------------------------------------------
   Hulpvormen. Ze staan binnen de IIFE en niet in S2, want window.SITUATIES moet
   precies de beeldsleutels bevatten: controleer.js loopt erover heen en zou een
   hulpsleutel als ongebruikte situatie aanrekenen. Ze geven een fragment terug
   zonder <svg>-wikkel, omdat ze altijd in een tafereel landen.

   Maatafspraak voor de bestuurdersbeelden: viewBox 320x180, horizon op y=62. Het
   wegvlak loopt van (124,62)-(196,62) naar (-50,180)-(370,180), zodat alles wat
   verderop ligt vanzelf smaller en hoger staat.
   --------------------------------------------------------------------------- */

var HORIZON = 62;

/* De weg zelf. Asfalt is een echte kleur en mag dus niet met het thema meebewegen;
   de lucht wel, die is sfeer en gebruikt var(--surface-2). */
function wegVlak(luchtKleur, asfaltKleur){
  return '<rect x="0" y="0" width="320" height="' + HORIZON + '" fill="' + (luchtKleur || 'var(--surface-2)') + '"/>' +
    '<rect x="0" y="' + HORIZON + '" width="320" height="' + (180 - HORIZON) + '" fill="#5a6372"/>' +
    '<path d="M124 ' + HORIZON + 'h72l174 ' + (180 - HORIZON) + 'H-50z" fill="' + (asfaltKleur || '#4a5361') + '"/>';
}

/* Belijning in perspectief: de streep smalt naar de horizon toe en wordt korter,
   anders leest het beeld als een plat bovenaanzicht. */
function middenstreep(doorgetrokken){
  if(doorgetrokken) return '<path d="M158 ' + HORIZON + ' L158 180" stroke="#fff" stroke-width="4" opacity=".9"/>';
  return '<path d="M159 66l2 10h-4zM159 84l3 16h-7zM160 110l5 28h-12zM161 148l8 32h-20z" fill="#fff" opacity=".9"/>';
}
function kantstreep(){
  return '<path d="M124 ' + HORIZON + 'L-30 180h-16L120 ' + HORIZON + 'z" fill="#fff" opacity=".75"/>' +
    '<path d="M196 ' + HORIZON + 'L350 180h16L200 ' + HORIZON + 'z" fill="#fff" opacity=".75"/>';
}

/* De motorkap onderin maakt duidelijk dat je zelf achter het stuur zit; zonder dat
   anker leest een vooraanzicht al snel als een plaatje van buitenaf. */
function motorkap(kleur){
  return '<path d="M-10 180q170 -40 340 0z" fill="' + (kleur || '#2f6bbf') + '"/>' +
    '<path d="M-10 180q170 -40 340 0" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/>';
}

/* Achteraanzicht van een auto, geschaald. s=1 is ongeveer 80 px breed, dus een auto
   vlak voor je; verderop zet je hem kleiner neer. */
function autoAchter(x, y, s, kleur){
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' +
    '<rect x="-38" y="-44" width="76" height="34" rx="9" fill="' + kleur + '"/>' +
    '<rect x="-42" y="-16" width="84" height="22" rx="6" fill="' + kleur + '"/>' +
    '<rect x="-27" y="-39" width="54" height="22" rx="4" fill="#2a3140" opacity=".8"/>' +
    '<rect x="-40" y="-12" width="13" height="9" rx="2.5" fill="#e8403f"/>' +
    '<rect x="27" y="-12" width="13" height="9" rx="2.5" fill="#e8403f"/>' +
    '<rect x="-20" y="2" width="40" height="7" rx="2" fill="var(--surface-2)" stroke="currentColor" stroke-width="1"/>' +
    '<rect x="-36" y="6" width="10" height="7" rx="2" fill="#222"/>' +
    '<rect x="26" y="6" width="10" height="7" rx="2" fill="#222"/>' +
    '</g>';
}

/* Vooraanzicht: een tegenligger. Koplampen krijgen hun kleur mee, want bij groot
   licht en bij dimlicht is juist dat het verschil. */
function autoVoor(x, y, s, kleur, lampKleur){
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' +
    '<rect x="-36" y="-42" width="72" height="32" rx="9" fill="' + kleur + '"/>' +
    '<rect x="-40" y="-16" width="80" height="22" rx="6" fill="' + kleur + '"/>' +
    '<rect x="-25" y="-37" width="50" height="21" rx="4" fill="#2a3140" opacity=".75"/>' +
    '<circle cx="-28" cy="-6" r="6" fill="' + (lampKleur || '#fff3c4') + '"/>' +
    '<circle cx="28" cy="-6" r="6" fill="' + (lampKleur || '#fff3c4') + '"/>' +
    '<rect x="-34" y="6" width="10" height="7" rx="2" fill="#222"/>' +
    '<rect x="24" y="6" width="10" height="7" rx="2" fill="#222"/>' +
    '</g>';
}

/* Schematische borden: vorm, kleur en symbool. Overgetrokken uit de RVV-vormen en
   niet uit borden.js, want dat bestand hoort bij de bordenmodule. */
function bordRond(cx, cy, r, rand, vulling){
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (vulling || '#fff') + '" ' +
    'stroke="' + rand + '" stroke-width="' + (r * 0.22) + '"/>';
}
function bordDriehoek(cx, cy, r){
  return '<path d="M' + cx + ' ' + (cy - r) + 'L' + (cx + r * 0.92) + ' ' + (cy + r * 0.62) +
    'H' + (cx - r * 0.92) + 'z" fill="#fff" stroke="#e8403f" stroke-width="' + (r * 0.2) + '" stroke-linejoin="round"/>';
}
function bordVierkant(cx, cy, h, vulling){
  return '<rect x="' + (cx - h / 2) + '" y="' + (cy - h / 2) + '" width="' + h + '" height="' + h +
    '" rx="2" fill="' + (vulling || '#1a56a8') + '" stroke="#fff" stroke-width="2"/>';
}
function paal(x, yTop, yBot){
  return '<rect x="' + (x - 2) + '" y="' + yTop + '" width="4" height="' + (yBot - yTop) + '" fill="var(--fg-3)"/>';
}

/* Mensje in vooraanzicht; schaal s houdt het perspectief kloppend. */
function mensje(x, y, s, kleur){
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' +
    '<circle cx="0" cy="-30" r="7" fill="' + kleur + '"/>' +
    '<path d="M-8 -22h16l-2 18h-12z" fill="' + kleur + '"/>' +
    '<path d="M-5 -4l-2 16M5 -4l2 16" stroke="' + kleur + '" stroke-width="3.5" stroke-linecap="round"/>' +
    '</g>';
}

/* Fietser van achteren: wat je in de praktijk ziet als je hem inhaalt. */
function fietserAchter(x, y, s, kleur){
  return '<g transform="translate(' + x + ' ' + y + ') scale(' + s + ')">' +
    '<ellipse cx="0" cy="-2" rx="8" ry="10" fill="none" stroke="currentColor" stroke-width="3"/>' +
    '<path d="M0 -12v-14" stroke="currentColor" stroke-width="3"/>' +
    '<path d="M-9 -26h18" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>' +
    '<path d="M-7 -24l7 -8l7 8z" fill="' + kleur + '"/>' +
    '<path d="M-7 -30h14v-10h-14z" fill="' + kleur + '"/>' +
    '<circle cx="0" cy="-46" r="6.5" fill="' + kleur + '"/>' +
    '<rect x="-3" y="-4" width="6" height="4" rx="1.5" fill="#e8403f"/>' +
    '</g>';
}

/* Maatpijl met bijschrift. Elke "hoeveel"-vraag hangt hieraan, dus hij staat los
   zodat alle afstanden er hetzelfde uitzien. */
function maat(x1, y1, x2, y2, tekst, kleur){
  var k = kleur || '#f2c200';
  var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  var br = tekst.length * 6.6 + 12;
  return '<path d="M' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2 + '" stroke="' + k + '" stroke-width="2"/>' +
    '<circle cx="' + x1 + '" cy="' + y1 + '" r="3" fill="' + k + '"/>' +
    '<circle cx="' + x2 + '" cy="' + y2 + '" r="3" fill="' + k + '"/>' +
    '<rect x="' + (mx - br / 2) + '" y="' + (my - 9) + '" width="' + br + '" height="18" rx="5" ' +
    'fill="var(--surface-2)" stroke="' + k + '" stroke-width="1"/>' +
    '<text x="' + mx + '" y="' + (my + 4) + '" text-anchor="middle" font-size="11" fill="currentColor" font-weight="700">' + tekst + '</text>';
}

/* Bijschrift in een kader: leesbaar op elk thema, ook boven asfalt. */
function bijschrift(x, y, tekst, kleur){
  var br = tekst.length * 6.3 + 14;
  return '<rect x="' + x + '" y="' + y + '" width="' + br + '" height="19" rx="5" fill="var(--surface-2)" ' +
    'stroke="' + (kleur || 'var(--line)') + '" stroke-width="1"/>' +
    '<text x="' + (x + 7) + '" y="' + (y + 13) + '" font-size="11" fill="currentColor">' + tekst + '</text>';
}

/* Paneel voor de rechte aanzichten (dashboard, rijbewijs, diagram). */
function paneel(h, titel){
  return '<rect x="0" y="0" width="320" height="' + h + '" rx="8" fill="var(--surface-2)"/>' +
    (titel ? '<text x="14" y="21" font-size="12" fill="currentColor" font-weight="700">' + titel + '</text>' : '');

function svg(h, label, inhoud){
  return '<svg viewBox="0 0 320 ' + h + '" width="100%" role="img" aria-label="' + label + '">' + inhoud + '</svg>';

var LS_KEY='autotheorie-v1', db=null, userId=null, saveT=null, bron='lokaal';

function schoon(raw){
  if(!raw||typeof raw!=='object') return;
  ['xp','streak'].forEach(function(k){ if(typeof raw[k]==='number') S[k]=raw[k]; });
  if(typeof raw.laatsteDag==='string') S.laatsteDag=raw.laatsteDag;
  ['dagenGedaan','leitner','gezien'].forEach(function(k){ if(raw[k]&&typeof raw[k]==='object') S[k]=raw[k]; });
  if(Array.isArray(raw.fout)) S.fout=raw.fout.slice(0,500);
  if(Array.isArray(raw.examens)) S.examens=raw.examens.slice(-25);
  if(raw.mod&&typeof raw.mod==='object') MODULES.forEach(function(m){
    var r=raw.mod[m.id]; if(r) S.mod[m.id]={goed:+r.goed||0, fout:+r.fout||0, les:+r.les||0};
  });
  if(raw.dag&&typeof raw.dag==='object') S.dag={
    datum: typeof raw.dag.datum==='string'?raw.dag.datum:'',
    taken: (raw.dag.taken&&typeof raw.dag.taken==='object')?raw.dag.taken:{},
    xp:+raw.dag.xp||0, goed:+raw.dag.goed||0, fout:+raw.dag.fout||0,
    dagnr:+raw.dag.dagnr||0
  };
  /* Beloningen worden gemerget op dagnummer in plaats van vervangen. initOpslag
     laat de serverversie winnen zodra daar meer XP in zit; zonder deze merge
     zou een oudere serverversie de hele collectie wissen. */
  if(Array.isArray(raw.beloningen)){
    var bezetDag={};
    S.beloningen.forEach(function(b){ bezetDag[b.d]=1; });
    raw.beloningen.forEach(function(b){
      if(!b||typeof b!=='object') return;
      var d=+b.d, p=+b.p;
      if(!(d>=1&&d<=14) || !(p>=1&&p<=151) || bezetDag[d]) return;
      bezetDag[d]=1;
      S.beloningen.push({d:d, p:p, s:b.s?1:0, t:typeof b.t==='string'?b.t:''});
    });
    S.beloningen.sort(function(a,b){ return a.d-b.d; });
  }
  if(raw.instel&&typeof raw.instel==='object'){
    S.instel.geluid   = raw.instel.geluid!==false;
    S.instel.animatie = raw.instel.animatie!==false;
  }
}

/* ---------- Wat je vandaag deed ---------- */
function dagState(){
  var t=vandaagStr();
  if(S.dag.datum!==t) S.dag={datum:t, taken:{}, xp:0, goed:0, fout:0, dagnr:0};
  return S.dag;
}
function taakKlaar(sleutel){
  var d=dagState();
  if(d.taken[sleutel]) return false;   // al eerder vandaag gedaan
  d.taken[sleutel]=1; bewaar();
  return true;
}
function telAntwoord(goed){ var d=dagState(); goed?d.goed++:d.fout++; }
/* De taken die bij de dag van vandaag horen. */
function dagTaken(dag){
  var plan=DAGPLAN[dag-1]; if(!plan) return [];
  if(dag<=10){
    var mod=MODULES.filter(function(m){return m.id===plan.mod})[0];
    var lijst=[{k:'les', nm:'Lesstof lezen'},{k:'quiz', nm:'Quiz'},{k:'borden', nm:'Flashcards borden'}];
    if(mod && mod.puzzles.length) lijst.push({k:'puzzel', nm:'Situatiepuzzel'});
    return lijst;
  }
  return [{k:'examen', nm:'Proefexamen'},{k:'fouten', nm:'Foutenbak'}];
}
function laadLokaal(){ try{ var r=localStorage.getItem(LS_KEY); if(r) schoon(JSON.parse(r)); }catch(e){} }
function bewaar(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(db&&userId){ clearTimeout(saveT); saveT=setTimeout(function(){
    try{ db.collection('data/users/'+userId).doc('voortgang').set(JSON.parse(JSON.stringify(S))); }catch(e){}
  },700); }
}
async function initOpslag(){
  /* Wie al dagen had afgerond voordat de beloningen bestonden, krijgt ze hier
     alsnog. Geen bewaar(): de uitkomst is deterministisch, dus de eerstvolgende
     echte wijziging legt precies hetzelfde vast. Opslaan in een opstartpad is
     bovendien precies waar het eerder misging. */
  laadLokaal(); vulBeloningenTerug(); teken();
  try{
    var user = await (window.claude && window.claude.use ? window.claude.use('user') : null);
    var d = await (window.claude && window.claude.use ? window.claude.use('db') : null);
    if(!user||!d) return;
    userId = await user.id(); db = d;
    var doc = await db.collection('data/users/'+userId).doc('voortgang').get();
    var data = doc && (doc.data ? (typeof doc.data==='function'?doc.data():doc.data) : null);
    if(data && typeof data.xp==='number' && data.xp>=S.xp){ schoon(data); bron='account'; }
    else if(S.xp>0){ bewaar(); }
    // De serverversie kan dagen bevatten die hier nog geen beloning hadden.
    if(vulBeloningenTerug()) bewaar();
    bron='account'; teken(); toast('Voortgang gesynchroniseerd met je account');
  }catch(e){ /* lokaal blijft werken */ }
}

/* ======================= GELUID EN CONFETTI ======================= */
/* Geluid wordt ter plekke opgewekt met de Web Audio API: geen bestanden,
   dus het werkt ook offline. Browsers staan audio pas toe na een klik,
   en dat is hier altijd het geval. */
var AC=null;
function audioCtx(){
  if(!S.instel.geluid) return null;
  try{
    var C = window.AudioContext || window.webkitAudioContext;
    if(!C) return null;
    AC = AC || new C();
    if(AC.state==='suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}
/* Speelt een reeks tonen af. [[frequentie, startInSeconden, duur], ...] */
function tonen(reeks, vorm, volume){
  var ac=audioCtx(); if(!ac) return;
  try{
    reeks.forEach(function(t){
      var osc=ac.createOscillator(), g=ac.createGain();
      osc.type = vorm || 'sine';
      osc.frequency.value = t[0];
      var start = ac.currentTime + t[1], eind = start + t[2];
      g.gain.setValueAtTime(0.0001, start);
      g.gain.exponentialRampToValueAtTime(volume||0.12, start+0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, eind);
      osc.connect(g); g.connect(ac.destination);
      osc.start(start); osc.stop(eind+0.02);
    });
  }catch(e){}
}
var GELUID = {
  goed:    function(){ tonen([[660,0,.09],[880,.07,.13]], 'sine', .10); },
  fout:    function(){ tonen([[220,0,.16]], 'triangle', .09); },
  klein:   function(){ tonen([[523,0,.09],[659,.08,.09],[784,.16,.18]], 'sine', .11); },
  groot:   function(){ tonen([[523,0,.1],[659,.1,.1],[784,.2,.1],[1047,.3,.3]], 'sine', .12); },
  level:   function(){ tonen([[440,0,.1],[554,.1,.1],[659,.2,.1],[880,.3,.35]], 'sine', .12); },
  pass:    function(){ tonen([[784,0,.1],[988,.1,.1],[1175,.2,.26]], 'sine', .11); }
};

/* Confetti: snippers in de vorm van verkeersborden, die dwarrelen of
   vanuit het midden wegschieten. */
var SVGNS='http://www.w3.org/2000/svg';
var CONF_KLEUR=['#f2c200','#0b4ea2','#d2272e','#17794a','#ffffff','#5a9bf0','#e8803a'];

function confettiStuk(svg, maat, kleur){
  var soort=Math.random(), e;
  if(soort<0.30){                                   // rond bord
    e=document.createElementNS(SVGNS,'circle');
    e.setAttribute('r',maat/2); e.setAttribute('fill',kleur);
  } else if(soort<0.52){                            // waarschuwingsdriehoek
    e=document.createElementNS(SVGNS,'polygon');
    var h=maat*0.9;
    e.setAttribute('points','0,'+(-h/2)+' '+(maat/2)+','+(h/2)+' '+(-maat/2)+','+(h/2));
    e.setAttribute('fill',kleur);
  } else if(soort<0.66){                            // gele ruit, de voorrangsweg
    e=document.createElementNS(SVGNS,'polygon');
    e.setAttribute('points','0,'+(-maat/2)+' '+(maat/2)+',0 0,'+(maat/2)+' '+(-maat/2)+',0');
    e.setAttribute('fill','#f2c200');
  } else {                                          // gewone snipper
    e=document.createElementNS(SVGNS,'rect');
    e.setAttribute('width',maat); e.setAttribute('height',maat*(0.45+Math.random()*0.5));
    e.setAttribute('x',-maat/2); e.setAttribute('y',-maat/3);
    e.setAttribute('rx',1); e.setAttribute('fill',kleur);
  }
  svg.appendChild(e); return e;
}
function confetti(aantal, duurMs, modus){
  if(!S.instel.animatie || GEEN_BEWEGING) return;
  var svg=document.createElementNS(SVGNS,'svg');
  svg.setAttribute('class','confetti'); svg.setAttribute('aria-hidden','true');
  svg.setAttribute('preserveAspectRatio','none');
  var W=window.innerWidth, H=window.innerHeight;
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  document.body.appendChild(svg);

  var stukken=[];
  for(var i=0;i<aantal;i++){
    var maat=6+Math.random()*9;
    var kleur=CONF_KLEUR[(Math.random()*CONF_KLEUR.length)|0];
    var e=confettiStuk(svg, maat, kleur), p;
    if(modus==='knal'){                 // schiet vanuit het midden naar buiten
      var hoek=Math.random()*Math.PI*2, kracht=4+Math.random()*9;
      p={el:e, x:W/2, y:H*0.42, vx:Math.cos(hoek)*kracht, vy:Math.sin(hoek)*kracht-4,
         hoek:Math.random()*360, draai:(Math.random()-0.5)*22};
    } else {                            // dwarrelt van boven naar beneden
      p={el:e, x:Math.random()*W, y:-20-Math.random()*H*0.6,
         vx:(Math.random()-0.5)*1.8, vy:2.2+Math.random()*3.6,
         hoek:Math.random()*360, draai:(Math.random()-0.5)*16};
    }
    p.zwaai=Math.random()*Math.PI*2;
    stukken.push(p);
  }
  var begin=performance.now(), duur=duurMs||2600;
  function stap(nu){
    var verstreken=nu-begin;
    if(verstreken>duur){ svg.remove(); return; }
    svg.style.opacity = verstreken>duur-700 ? (duur-verstreken)/700 : 1;
    for(var i=0;i<stukken.length;i++){
      var p=stukken[i];
      p.zwaai+=0.09;
      p.x += p.vx + Math.sin(p.zwaai)*0.7;   // lichte zijwaartse zwaai
      p.y += p.vy; p.vy += 0.10; p.vx *= 0.995;
      p.hoek += p.draai;
      p.el.setAttribute('transform','translate('+p.x+' '+p.y+') rotate('+p.hoek+')');
    }
    requestAnimationFrame(stap);
  }
  requestAnimationFrame(stap);
}
/* Eén ingang voor alle vieringen, zodat geluid en beeld samen blijven lopen. */
function vier(soort){

  if(soort==='groot'){                       // dag af of examen gehaald

  } else if(soort==='pass'){

}

function voltooiTaak(sleutel){

/* ======================= BELONINGEN (Pokemon) ======================= */
/* Elke afgeronde programmadag levert een Pokemon op. De app kent alleen het
   pokedexnummer; sprite, cry en naam volgen daaruit. Zo blijft S klein genoeg
   om bij elke wijziging naar de database te gaan.

   Welke je krijgt volgt deterministisch uit het dagnummer, niet uit
   Math.random(). Anders geeft herladen of synchroniseren een andere uitkomst
   dan wat er al in de collectie staat. */

/* Legendaries en starters: alleen op een mijlpaaldag. */
var POKE_ZELDZAAM = [1,2,3,4,5,6,7,8,9,144,145,146,150,151];
var POKE_GEWOON = (function(){
  var uit={}, r=[];
  POKE_ZELDZAAM.forEach(function(p){ uit[p]=1; });
  for(var i=1;i<=151;i++) if(!uit[i]) r.push(i);
  return r;
})();
function mijlpaalDag(dag){ return dag%5===0 || dag===14; }
function pokeNaam(p){
  var n = window.POKE_NAMEN && window.POKE_NAMEN[p-1];
  return n || ('Nr. '+p);
}
/* Kleine deterministische generator (mulberry32). Hetzelfde zaad geeft altijd
   dezelfde reeks, dus dag 3 levert op elk apparaat dezelfde Pokemon op. */
function zaad(n){
  var a = n>>>0;
  return function(){
    a = (a + 0x6D2B79F5)>>>0;
    var t = a;
    t = Math.imul(t ^ (t>>>15), t|1);
    t ^= t + Math.imul(t ^ (t>>>7), t|61);
    return (((t ^ (t>>>14))>>>0) / 4294967296);
  };
}
/* Trekt uit de pool en schuift door zolang je dat nummer al hebt. */
function trekPoke(pool, rnd, bezet){
  var start = Math.floor(rnd()*pool.length) % pool.length;
  for(var i=0;i<pool.length;i++){
    var p = pool[(start+i)%pool.length];
    if(!bezet[p]) return p;
  }
  return pool[start];   // alles al bezeten: dan maar een dubbele
}
/* Idempotent op het dagnummer: tweemaal aanroepen voor dezelfde dag geeft
   nooit een tweede beloning. `stil` is het terugvullen achteraf — dan telt de
   foutloze dag van vandaag niet mee, want die ging over een andere dag. */
function kenBeloningToe(dag, stil){
  if(!(dag>=1&&dag<=14)) return null;
  for(var i=0;i<S.beloningen.length;i++) if(S.beloningen[i].d===dag) return null;
  var rnd = zaad(dag*7919+104729);
  var bezet={};
  S.beloningen.forEach(function(b){ bezet[b.p]=1; });
  var p = trekPoke(mijlpaalDag(dag)?POKE_ZELDZAAM:POKE_GEWOON, rnd, bezet);
  /* Shiny verdien je: een foutloze dag geeft hem altijd. Daarnaast een kleine
     vaste kans, zodat het niet alleen voor de perfecte dagen is weggelegd. */
  var d = dagState();
  var foutloos = !stil && d.fout===0 && (d.goed+d.fout)>=10;
  var shiny = foutloos || rnd()<0.0625;
  var b = {d:dag, p:p, s:shiny?1:0, t:vandaagStr()};
  S.beloningen.push(b);
  S.beloningen.sort(function(a,b2){ return a.d-b2.d; });
  return b;
}
/* Wie al dagen had afgerond voordat dit bestond, krijgt ze alsnog: stil, zonder
   confetti, zodat het Collectie-tabblad niet leeg opent. */
function vulBeloningenTerug(){
  var nieuw=0;
  for(var dag=1;dag<=14;dag++) if(S.dagenGedaan[dag] && kenBeloningToe(dag,true)) nieuw++;
  return nieuw;
}

/* ---------- Sprite en geluid ---------- */
/* De artifact-CSP blokkeert externe afbeeldingen, dus daar zitten de sprites
   als data-URI in poke-sprites.js. Dat bestand gaat bewust niet mee naar de
   publieke repo (de tekeningen zijn van The Pokemon Company); die variant laadt
   ze van PokeAPI. Dat is deze ene if. */
function spriteBron(id, shiny){
  var bron = shiny ? window.POKE_SHINY : window.POKE_SPRITE;
  if(bron && bron[id]) return 'data:image/png;base64,'+bron[id];
  return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+
         (shiny?'shiny/':'')+id+'.png';
}
/* Alleen náást de artifact gepubliceerd; elders bestaat dit pad niet en valt
   het geluid terug op de synth. */
function cryBron(id){ return 'poke/cry/'+id+'.ogg'; }

/* Safari en iOS spelen geen Ogg Vorbis en falen daarbij stil. Eén keer vragen
   is genoeg; daarna weten we het voor de hele sessie. */
var KAN_OGG = (function(){
  try{ return !!document.createElement('audio').canPlayType('audio/ogg; codecs="vorbis"'); }
  catch(e){ return false; }
})();
/* Elk pokedexnummer krijgt zijn eigen reeks tonen, zodat de terugval niet voor
   alle 151 hetzelfde piepje is. Respecteert S.instel.geluid via tonen(). */
function synthCry(id){
  var rnd = zaad(id*2654435761);
  var basis = 300 + (id%24)*18;
  var reeks = [], t = 0;
  for(var i=0;i<4;i++){
    var f = basis * (1 + Math.floor(rnd()*7)/6);
    var duur = 0.07 + rnd()*0.08;
    reeks.push([Math.round(f), t, duur]);
    t += duur*0.8;
  }
  tonen(reeks, (id%3===0)?'triangle':'sawtooth', 0.07);
}
/* Start het geluid meteen bij de klik: iOS laat audio alleen binnen de
   gebruikersactie toe. Elke tak die misgaat valt terug op de synth. */
function speelCry(id){
  if(!S.instel.geluid) return;
  if(!KAN_OGG){ synthCry(id); return; }
  var gedaan = false;
  function terugval(){ if(gedaan) return; gedaan=true; synthCry(id); }
  try{
    var a = new Audio(cryBron(id));
    a.volume = 0.5;
    a.addEventListener('error', terugval);
    a.addEventListener('playing', function(){ gedaan = true; });
    var pr = a.play();
    if(pr && pr.catch) pr.catch(terugval);
    setTimeout(terugval, 900);   // stil mislukt: dan alsnog een geluidje
  }catch(e){ terugval(); }
}

/* ======================= BORDEN ======================= */
/* De borden zijn de officiele RVV-tekeningen uit borden.js. Ze worden inline
   geplaatst en door de wrapper op maat geschaald; de verhouding blijft intact. */
function bordSVG(s,size){
  var sz = size||60;
  if(!s || !s.svg) return '<span class=\"bord\" style=\"width:'+sz+'px;height:'+sz+'px\"></span>';
  return '<span class=\"bord\" role=\"img\" aria-label=\"'+esc(s.c+': '+s.n)+'\" style=\"width:'+sz+'px;height:'+sz+'px\">'+s.svg+'</span>';
}

/* ======================= VRAGEN-POOL ======================= */
var ALLE=[];
// Een bordvraag kan alleen gesteld worden als het bord ook echt in de set zit.
var SIGN_CODES={}; SIGNS.forEach(function(s){ SIGN_CODES[s.c]=s; });

/* ---------- Bordcodes in lopende tekst vervangen door het bord zelf ----------
   "bord F1" zegt niets als je het bord niet ziet. Overal waar een code uit de
   bordenset in een tekst staat, komt het plaatje erbij te staan. */
var CODE_RE = new RegExp('\\b(' +
  Object.keys(SIGN_CODES).sort(function(a,b){ return b.length-a.length; })
    .map(function(c){ return c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join('|') +
  ')\\b', 'g');

function bordChip(s){
  var sp=document.createElement('span');
  sp.className='bordchip';
  sp.title=s.c+': '+s.n;
  var b=document.createElement('span');
  b.innerHTML=bordSVG(s,26);
  sp.appendChild(b);
  var code=document.createElement('span'); code.className='bc'; code.textContent=s.c;
  sp.appendChild(code);
  return sp;
}
/* Geeft een fragment terug met de tekst, waarin elke bekende bordcode
   een plaatje met code is geworden. */
function metBorden(tekst){
  var frag=document.createDocumentFragment();
  if(tekst==null){ return frag; }
  var t=String(tekst), laatst=0, m;
  CODE_RE.lastIndex=0;
  while((m=CODE_RE.exec(t))!==null){
    var s=SIGN_CODES[m[1]];
    if(!s) continue;                       // code zonder tekening: laat de tekst staan
    if(m.index>laatst) frag.appendChild(document.createTextNode(t.slice(laatst,m.index)));
    frag.appendChild(bordChip(s));
    laatst=m.index+m[1].length;
  }
  if(laatst<t.length) frag.appendChild(document.createTextNode(t.slice(laatst)));
  return frag;
}
/* Als el() maar dan met borden in de tekst. */
function elB(tag, cls, tekst){
  var n=document.createElement(tag);
  if(cls) n.className=cls;
  n.appendChild(metBorden(tekst));
  return n;
}
/* Beeld bij een vraag. Twee bronnen op dezelfde sleutels: EXAMENBEELD zit alleen in
   de priveversie, SITUATIES gaat overal mee. De app weet niet welke van de twee hij te
   pakken krijgt, zodat dezelfde vraag in beide varianten werkt. */
function beeldVoor(sleutel){
  if(!sleutel) return null;
  var bron = (window.EXAMENBEELD && window.EXAMENBEELD[sleutel]) ||
             (window.SITUATIES && window.SITUATIES[sleutel]);
  if(!bron) return null;
  var uit = (typeof bron==='function') ? bron() : bron;
  return (typeof uit==='string' && uit) ? uit : null;
}
/* Een tafereel is SVG-opmaak of een data-URI; alleen die twee, want de CSP laat geen
   externe afbeelding door. Geeft een element terug en geen tekst: een img-tag met een
   bronattribuut in de broncode laat de controle op externe verwijzingen in tools/bouw.js
   afgaan, en dan is die controle niets meer waard. */
function beeldNode(sleutel){
  var b=beeldVoor(sleutel);
  if(!b) return null;
  var wrap=el('div','vraagbeeld');
  if(b.indexOf('<svg')===0){ wrap.innerHTML=b; return wrap; }
  var img=document.createElement('img');
  img.setAttribute('src', b);
  img.alt='Verkeerssituatie';
  wrap.appendChild(img);
  return wrap;
}
MODULES.forEach(function(m){
  m.questions = m.questions.filter(function(q){
    if(q.t==='sign' && !SIGN_CODES[q.signCode]) return false;
    /* Een vraag die met "hier" naar beeld verwijst is zonder dat beeld onbeantwoordbaar;
       wegfilteren is dan beter dan een halve vraag tonen. Zo gaat het al bij bordvragen. */
    if(q.b && !beeldVoor(q.b)) return false;
    return true;
  });
  /* Het id hangt aan de sleutel k, niet aan de positie in de array. S.fout en S.gezien
     bewaren deze id's, dus bij herordenen zou de foutenbak stil leeglopen. Vragen zonder
     k vallen terug op de index, zodat de omzetting module voor module kan. */
  m.questions.forEach(function(q,i){ q.id=m.id+'#'+(q.k||i); q.mod=m.id; q.modTitel=m.titel; ALLE.push(q); });
});
function vraagById(id){ for(var i=0;i<ALLE.length;i++) if(ALLE[i].id===id) return ALLE[i]; return null; }
function schud(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a; }

/* Aantikbaar beeld voor hotspot- en sleepvragen. Geeft coordinaten in procenten terug,
   zodat het antwoord losstaat van de schermgrootte. De aanroeper bepaalt wat er met de
   keuze gebeurt: direct nakijken in de oefenmodus, alleen onthouden in het examen. */
function beeldVeld(q, kies, start){
  var wrap=el('div','hotspot');
  var bn=beeldNode(q.b); if(bn) wrap.appendChild(bn);
  var merk=el('div','merk');
  if(q.t==='sleep'){ merk.className='merk vink'; merk.textContent='✓'; }
  merk.style.display='none';
  wrap.appendChild(merk);
  function zet(pt){ merk.style.left=pt.x+'%'; merk.style.top=pt.y+'%'; merk.style.display='block'; }
  if(start && typeof start.x==='number') zet(start);
  wrap.onclick=function(e){
    if(wrap.dataset.vast) return;
    var r=wrap.getBoundingClientRect();
    if(!r.width || !r.height) return;
    var pt={ x:Math.round((e.clientX-r.left)/r.width*1000)/10,
             y:Math.round((e.clientY-r.top)/r.height*1000)/10 };
    zet(pt); kies(pt);
  };
  return wrap;
}
/* ======================= VRAAG RENDEREN ======================= */
function toonVraag(q, opts){
  opts=opts||{};
  var box=el('div','card stack');
  var kop=el('div','eyebrow', (opts.kop || q.modTitel));
  box.appendChild(kop);
  if(q.t==='sign' && q.signCode){
    var sg=SIGNS.filter(function(s){return s.c===q.signCode})[0];
    if(sg){ var holder=el('div'); holder.style.textAlign='center'; holder.innerHTML=bordSVG(sg,110); box.appendChild(holder); }
  }
  if(q.b){ var bn2=beeldNode(q.b); if(bn2) box.appendChild(bn2); }
  var vr=elB('h3',null,q.v); vr.style.fontSize='17px'; box.appendChild(vr);
  var opts_wrap=el('div','stack'); opts_wrap.style.gap='8px'; box.appendChild(opts_wrap);
  var antwoordGegeven=false, keuze=[], volgorde=[];

  function klaar(goed){
    if(antwoordGegeven) return; antwoordGegeven=true;
    var fb=el('div','fb '+(goed?'goed':'fout'));
    fb.appendChild(el('h4',null,goed?'Goed':'Fout'));
    fb.appendChild(elB('div','small',q.u));
    if(q.art) fb.appendChild(el('div','art',q.art));
    box.appendChild(fb);
    var nb=el('button','btn wide','Volgende'); nb.onclick=function(){ opts.next&&opts.next(goed); };
    box.appendChild(nb); nb.focus();
    S.gezien[q.id]=1;
    geluid(goed?'goed':'fout'); telAntwoord(goed);
    var st=S.mod[q.mod]; if(st){ goed?st.goed++:st.fout++; }
    if(goed){ geefXP(10,'goed'); S.fout=S.fout.filter(function(x){return x!==q.id}); }
    else { if(S.fout.indexOf(q.id)<0) S.fout.push(q.id); }
    bewaar();
  }

  if(q.t==='jn'){
    ['Ja','Nee'].forEach(function(lab,i){
      var b=el('button','opt',lab);
      b.onclick=function(){ if(antwoordGegeven)return;
        var goed=(i===q.a);
        b.dataset.st=goed?'goed':'fout';
        Array.prototype.forEach.call(opts_wrap.children,function(c,j){ c.disabled=true; if(j===q.a)c.dataset.st='goed'; });
        klaar(goed); };
      opts_wrap.appendChild(b);
    });
  } else if(q.t==='mc'||q.t==='sign'){
    q.o.forEach(function(lab,i){
      var b=elB('button','opt',lab);
      b.onclick=function(){ if(antwoordGegeven)return;
        var goed=(i===q.a);
        Array.prototype.forEach.call(opts_wrap.children,function(c,j){ c.disabled=true; if(j===q.a)c.dataset.st='goed'; });
        if(!goed) b.dataset.st='fout';
        klaar(goed); };
      opts_wrap.appendChild(b);
    });
  } else if(q.t==='multi'){
    box.insertBefore(el('div','small muted','Deze vraag is alleen goed als je alle juiste antwoorden aantikt.'), opts_wrap);
    q.o.forEach(function(lab,i){
      var b=elB('button','opt',lab);
      b.onclick=function(){ if(antwoordGegeven)return;
        var k=keuze.indexOf(i); if(k<0)keuze.push(i); else keuze.splice(k,1);
        b.dataset.st = keuze.indexOf(i)<0 ? '' : 'sel'; };
      opts_wrap.appendChild(b);
    });
    var ok=el('button','btn wide','Controleer');
    ok.onclick=function(){ if(antwoordGegeven)return;
      var a=q.a.slice().sort(), k=keuze.slice().sort();
      var goed = a.length===k.length && a.every(function(v,i){return v===k[i]});
      Array.prototype.forEach.call(opts_wrap.children,function(c,j){ c.disabled=true;
        if(q.a.indexOf(j)>=0) c.dataset.st='goed'; else if(keuze.indexOf(j)>=0) c.dataset.st='fout'; else c.dataset.st=''; });
      ok.remove(); klaar(goed); };
    box.appendChild(ok);
  } else if(q.t==='order'){
    box.insertBefore(el('div','small muted','Klik ze aan in de juiste volgorde.'), opts_wrap);
    var knoppen=[];
    q.o.forEach(function(lab,i){
      var b=el('button','actorbtn'); var num=el('span','num',''); num.style.visibility='hidden';
      b.appendChild(num); b.appendChild(el('span',null,lab));
      b.onclick=function(){ if(antwoordGegeven)return;
        var p=volgorde.indexOf(i);
        if(p>=0){ volgorde.splice(p,1); } else { volgorde.push(i); }
        knoppen.forEach(function(kb,ki){ var pos=volgorde.indexOf(ki);
          kb.dataset.st = pos<0?'':'sel';
          var n=kb.querySelector('.num');
          if(pos<0){ n.style.visibility='hidden'; n.textContent=''; } else { n.style.visibility='visible'; n.textContent=pos+1; } });
        ok2.disabled = volgorde.length!==q.o.length; };
      knoppen.push(b); opts_wrap.appendChild(b);
    });
    var ok2=el('button','btn wide','Controleer'); ok2.disabled=true;
    ok2.onclick=function(){ if(antwoordGegeven)return;
      var goed = volgorde.length===q.a.length && volgorde.every(function(v,i){return v===q.a[i]});
      knoppen.forEach(function(kb){kb.disabled=true});
      if(!goed){ var hint=el('div','small muted','Juiste volgorde: '+q.a.map(function(i){return q.o[i]}).join(' → ')); box.appendChild(hint); }
      ok2.remove(); klaar(goed); };
    box.appendChild(ok2);
  } else if(q.t==='fill'){
    var inp=document.createElement('input');
    inp.type='text'; inp.id='fill-'+q.id.replace(/[^a-z0-9]/gi,''); inp.placeholder='Typ je antwoord';
    inp.style.cssText='width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit';
    opts_wrap.appendChild(inp);
    var ok3=el('button','btn wide','Controleer');
    ok3.onclick=function(){ if(antwoordGegeven)return;
      // Cijfers moeten meetellen, anders zou "1,6" met elk antwoord overeenkomen.
      var norm=function(x){return (x||'').toLowerCase().replace(/[^a-z0-9]/g,'')};
      var goed = norm(inp.value)!=='' && norm(inp.value)===norm(q.a);
      inp.disabled=true; inp.style.borderColor = goed?'var(--goed)':'var(--fout)';
      if(!goed) box.appendChild(el('div','small muted','Juiste antwoord: '+q.a));
      ok3.remove(); klaar(goed); };
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter') ok3.click(); });
    box.appendChild(ok3);
  } else if(q.t==='hotspot'||q.t==='sleep'){
    var punt=null;
    var veld=beeldVeld(q, function(pt){ punt=pt; ok4.disabled=false; });
    opts_wrap.appendChild(veld);
    opts_wrap.insertBefore(el('div','small muted', q.t==='sleep'
      ? 'Tik de juiste plek aan om het vinkje daar neer te zetten.'
      : 'Tik de juiste plek in de afbeelding aan.'), veld);
    var ok4=el('button','btn wide','Controleer'); ok4.disabled=true;
    ok4.onclick=function(){ if(antwoordGegeven)return;
      var goed=juist(q,punt);
      veld.dataset.vast='1';
      /* Het juiste gebied laten zien is hier de uitleg: bij een hotspot zegt tekst alleen
         niet waar je had moeten tikken. */
      var vak=el('div','hotvak');
      vak.style.cssText='left:'+q.a.x+'%;top:'+q.a.y+'%;width:'+q.a.w+'%;height:'+q.a.h+'%';
      vak.dataset.st = goed?'goed':'fout';
      veld.appendChild(vak);
      ok4.remove(); klaar(goed); };
    box.appendChild(ok4);
  }
  return box;
}

/* ======================= SCENE TEKENEN (puzzels) ======================= */
/* Een route bestaat uit twee delen: het naderen van het kruispunt (dat loopt in een
   lus zolang de vraag openstaat) en de volledige doorsteek (die na het antwoord in
   de juiste volgorde wordt afgespeeld). Rechts rijden bepaalt de rijstrook. */
function route(a){
  var o = a.soort==='fiets' ? 6.5 : a.soort==='tram' ? -7 : 0;  // fietspad ligt rechts, tram in het midden
  var N = 43 - o, Z = 57 + o, W = 43 - o, O = 57 + o;  // N/Z = x-stroken, W/O = y-stroken
  var naar = a.naar || 'rd', full, app, lbl;
  if(a.van==='zuid'){              // rijdt naar het noorden
    lbl = [Z, 88];
    app  = 'M'+Z+' 102 L'+Z+' 70';
    full = naar==='rd'    ? 'M'+Z+' 102 L'+Z+' -2'
         : naar==='rechts'? 'M'+Z+' 102 L'+Z+' '+O+' L102 '+O
         :                  'M'+Z+' 102 L'+Z+' '+W+' L-2 '+W;
  } else if(a.van==='noord'){      // rijdt naar het zuiden
    lbl = [N, 12];
    app  = 'M'+N+' -2 L'+N+' 30';
    full = naar==='rd'    ? 'M'+N+' -2 L'+N+' 102'
         : naar==='rechts'? 'M'+N+' -2 L'+N+' '+W+' L-2 '+W
         :                  'M'+N+' -2 L'+N+' '+O+' L102 '+O;
  } else if(a.van==='west'){       // rijdt naar het oosten
    lbl = [12, O];
    app  = 'M-2 '+O+' L30 '+O;
    full = naar==='rd'    ? 'M-2 '+O+' L102 '+O
         : naar==='rechts'? 'M-2 '+O+' L'+N+' '+O+' L'+N+' 102'
         :                  'M-2 '+O+' L'+Z+' '+O+' L'+Z+' -2';
  } else if(a.van==='oost'){       // rijdt naar het westen
    lbl = [88, W];
    app  = 'M102 '+W+' L70 '+W;
    full = naar==='rd'    ? 'M102 '+W+' L-2 '+W
         : naar==='rechts'? 'M102 '+W+' L'+Z+' '+W+' L'+Z+' -2'
         :                  'M102 '+W+' L'+N+' '+W+' L'+N+' 102';
  } else if(a.van==='uitrit'){
    lbl = [50, 88];
    app  = 'M50 102 L50 76';
    full = 'M50 102 L50 54 L102 54';
  } else {                          // voetganger op het trottoir langs de uitrit
    lbl = [16, 58];
    app  = 'M-2 65 L34 65';
    full = 'M-2 65 L102 65';
  }
  return {full:full, app:app, lbl:lbl};
}
function actorVorm(a){
  var kl = a.kleur==='jij' ? '#f2c200'
         : a.soort==='tram' ? '#d2272e'
         : a.soort==='fiets' ? '#4bd08a'
         : a.soort==='voet' ? '#ffffff' : '#9fd0ff';
  // Alles wijst naar +x, zodat rotate="auto" de richting van de route volgt.
  if(a.soort==='voet')  return '<circle cx="0" cy="-3" r="2.6" fill="'+kl+'"/><rect x="-2" y="0" width="4" height="6.5" rx="1.6" fill="'+kl+'"/>';
  if(a.soort==='fiets') return '<circle cx="-3" cy="2" r="2.6" fill="none" stroke="'+kl+'" stroke-width="1.2"/><circle cx="3" cy="2" r="2.6" fill="none" stroke="'+kl+'" stroke-width="1.2"/><path d="M-3 2 0 -3h3" stroke="'+kl+'" stroke-width="1.2" fill="none"/>';
  if(a.soort==='tram')  return '<rect x="-8" y="-3.5" width="16" height="7" rx="1.5" fill="'+kl+'"/><rect x="2" y="-2.3" width="4" height="4.6" fill="#fff"/>';
  return '<rect x="-6" y="-3.4" width="12" height="6.8" rx="2" fill="'+kl+'"/><rect x="0.6" y="-2.4" width="3.6" height="4.8" rx="1" fill="#1a2330" opacity=".55"/>';
}
var GEEN_BEWEGING = false;
try{ GEEN_BEWEGING = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

function sceneSVG(sc, mode, volgorde){
  var bewegend = !GEEN_BEWEGING;
  var s='<svg viewBox="0 0 100 100" class="scene" role="img" aria-label="Verkeerssituatie op een kruispunt">';
  if(sc.type==='uitrit'){
    s+='<rect x="0" y="36" width="100" height="24" fill="#4a5361"/>';
    s+='<rect x="0" y="60" width="100" height="9" fill="#b9c0cb"/>';   // trottoir
    s+='<rect x="42" y="69" width="16" height="31" fill="#6b7382"/>';  // uitrit
    s+='<path d="M0 48h100" stroke="#fff" stroke-width="1" stroke-dasharray="6 5"/>';
  } else {
    s+='<rect x="0" y="36" width="100" height="28" fill="#4a5361"/>';
    s+='<rect x="36" y="0" width="28" height="100" fill="#4a5361"/>';
    s+='<path d="M0 50h30M70 50h30" stroke="#fff" stroke-width="1.2" stroke-dasharray="6 5"/>';
    s+='<path d="M50 0v30M50 70v30" stroke="#fff" stroke-width="1.2" stroke-dasharray="6 5"/>';
    if(sc.borden==='haaientanden-zuid'){
      for(var i=0;i<6;i++){ var x=37.5+i*4.5; s+='<path d="M'+x+' 69 L'+(x+3)+' 69 L'+(x+1.5)+' 65.5 Z" fill="#fff"/>'; }
    }
  }
  var acts = sc.actors||[];
  acts.forEach(function(a){
    var r=route(a), vorm=actorVorm(a);
    if(!bewegend){
      // Zonder beweging: iedereen staat stil vlak voor het kruispunt.
      s+='<g><path d="'+r.app+'" fill="none" stroke="none"/>'+vorm+
         '<animateMotion dur="0.001s" fill="freeze" rotate="auto" path="'+r.app+'" keyPoints="1;1" keyTimes="0;1" calcMode="linear"/></g>';
    } else if(mode==='solve'){
      var i = (volgorde||[]).indexOf(a.id); if(i<0) i = acts.length;
      s+='<g>'+vorm+'<animateMotion begin="'+(i*1.5)+'s" dur="1.5s" fill="freeze" rotate="auto" path="'+r.full+'"/>'+
         '<animateMotion dur="0.001s" fill="freeze" rotate="auto" path="'+r.app+'" keyPoints="1;1" keyTimes="0;1" calcMode="linear"/></g>';
    } else {
      s+='<g>'+vorm+'<animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" rotate="auto" path="'+r.app+'"/></g>';
    }
    s+='<text x="'+r.lbl[0]+'" y="'+r.lbl[1]+'" text-anchor="middle" fill="#fff" stroke="#2a3140" stroke-width="2.2" paint-order="stroke" font-family="Archivo, Arial" font-weight="800" font-size="6">'+esc(a.label)+'</text>';
  });
  s+='</svg>';
  return s;
}

var DAGPLAN=[];
(function(){
  var mIds=MODULES.map(function(m){return m.id});
  for(var d=1; d<=14; d++){
    if(d<=10){
      var m=mIds[(d-1)%mIds.length];
      DAGPLAN.push({dag:d, mod:m, taken:['les','quiz','borden','puzzel']});
    } else {
      DAGPLAN.push({dag:d, mod:null, taken:['examen','fouten']});
    }
  }
})();
/* Eén programmadag per kalenderdag. Rond je dag 1 af, dan blijf je vandaag
   op dag 1 staan (met het vinkje) in plaats van meteen door te schuiven naar
   dag 2; anders zou het werk van vandaag als voortgang van morgen tellen. */
function huidigeDag(){
  var d=dagState();
  if(d.dagnr) return d.dagnr;
  var i=1; while(i<14 && S.dagenGedaan[i]) i++;
  d.dagnr=i;            // alleen in het geheugen: tekenen mag nooit opslaan,
  return i;             // anders overschrijft de eerste render je voortgang
}

    : (dag<=10 && mod ? 'Module: '+mod.titel : 'Herhalen en proefexamen')));
  top.appendChild(kt);
  /* De rit van vandaag: je auto schuift op naar de finish naarmate je taken afvinkt. */
  var rit=el('div','ritwrap'); rit.innerHTML=AFB.rit(pct, alles); top.appendChild(rit);

  /* Drie cijfers over vandaag, zodat je je inspanning terugziet. */
  var cij=el('div','cijfers');
  var totaal=d.goed+d.fout;
  [['XP vandaag', '+'+d.xp],
   ['Vragen', totaal ? d.goed+'/'+totaal+' goed' : '—'],
   ['Reeks', S.streak+(S.streak===1?' dag':' dagen')]].forEach(function(p){
    var c=el('div','cijfer');

  /* ---- De taken van vandaag, met hun staat ---- */

  }
  if(dag<=10 && mod){
    acties.appendChild(taakKaart('les','Lesstof lezen', mod.lessons.length+' kaartjes · '+mod.titel, function(){ startLes(mod); }));
    acties.appendChild(taakKaart('quiz','Quiz', '10 vragen uit '+mod.titel, function(){ startQuiz(schud(mod.questions).slice(0,10), 'Quiz · '+mod.titel, 'quiz'); }));
    acties.appendChild(taakKaart('borden','Flashcards borden', '20 borden volgens het Leitner-systeem', function(){ naarBorden(); teken(); startFlash(); }));
    if(mod.puzzles.length) acties.appendChild(taakKaart('puzzel','Situatiepuzzel', mod.puzzles.length+' kruispunten', function(){ startPuzzels(mod); }));
  } else {
    acties.appendChild(taakKaart('examen','Proefexamen', EXAM.vragen+' vragen · '+EXAM.minuten+' minuten · '+EXAM.grens+' goed om te slagen', function(){ TAB='examen'; teken(); startExamen(); }));
    acties.appendChild(taakKaart('fouten','Foutenbak', S.fout.length?S.fout.length+' vragen die je fout had':'Je foutenbak is leeg', function(){
      if(!S.fout.length){ toast('Je foutenbak is leeg'); return; }
      startQuiz(S.fout.map(vraagById).filter(Boolean).slice(0,15), 'Foutenbak', 'fouten'); }));
  }
  if(dag<=10 && S.fout.length) acties.appendChild(knopKaart('Foutenbak wegwerken', S.fout.length+' vragen die je fout had', function(){
    startQuiz(S.fout.map(vraagById).filter(Boolean).slice(0,15), 'Foutenbak'); }, false));

function knopKaart(titel, sub, fn, gedaan){

  b.style.setProperty('--c', gedaan?'var(--goed)':'var(--blauw)');

    : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.6" fill="none" stroke="var(--line)" stroke-width="1.8"/></svg>';
  b.appendChild(vink);
  var box=el('div'); box.style.flex='1'; box.style.minWidth='0';

function modStatKaart(m){
