<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rijbewijs B Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mobiele app met vaste bovenbalk (XP) en onderbalk (tabs); content scrolt ertussen.
   Palet komt uit de RVV-bordenwereld: bordblauw, bordrood, haaientandwit, asfaltgrijs met blauwe inslag. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --line:#d6dce6;
  --fg:#15202e; --fg-2:#5a6779; --fg-3:#8793a5;
  --blauw:#0b4ea2; --blauw-zacht:#e4edf9; --rood:#d2272e; --geel:#f2c200;
  --goed:#17794a; --goed-zacht:#e1f3e9; --fout:#c22a2a; --fout-zacht:#fbe6e6;
  --asfalt:#3d4652;
  --m-voorrang:#0b4ea2; --m-tekens:#b4541a; --m-weg:#0e7490; --m-bijzonder:#6d28d9;
  --m-veilig:#b91c1c; --m-milieu:#15803d; --m-wet:#a16207; --m-voertuig:#475569;
  --f-disp:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:14px; --sh:0 1px 2px rgba(21,32,46,.08), 0 6px 18px rgba(21,32,46,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151c; --surface:#19202a; --surface-2:#222b37; --line:#303b4a;
  --fg:#eaeff6; --fg-2:#a2aebf; --fg-3:#78859a;
  --blauw:#5a9bf0; --blauw-zacht:#1b2736; --rood:#f0646a;
  --goed:#4bd08a; --goed-zacht:#14301f; --fout:#f0646a; --fout-zacht:#311718;
  --asfalt:#aab6c6; --m-voorrang:#5a9bf0; --m-tekens:#e08a4e; --m-weg:#38bdf8; --m-bijzonder:#a78bfa;
  --m-veilig:#f87171; --m-milieu:#4ade80; --m-wet:#fbbf24; --m-voertuig:#94a3b8;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#19202a; --surface-2:#222b37; --line:#303b4a;
  --fg:#eaeff6; --fg-2:#a2aebf; --fg-3:#78859a;
  --blauw:#5a9bf0; --blauw-zacht:#1b2736; --rood:#f0646a;
  --goed:#4bd08a; --goed-zacht:#14301f; --fout:#f0646a; --fout-zacht:#311718;
  --asfalt:#aab6c6; --m-voorrang:#5a9bf0; --m-tekens:#e08a4e; --m-weg:#38bdf8; --m-bijzonder:#a78bfa;
  --m-veilig:#f87171; --m-milieu:#4ade80; --m-wet:#fbbf24; --m-voertuig:#94a3b8;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---- bovenbalk ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);z-index:20}
.hwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;display:flex;align-items:center;gap:12px}
.lvl{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--blauw);color:#fff;display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:800;font-size:15px}
.xpcol{flex:1 1 auto;min-width:0}
.xptop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--fg-2)}
.xptop b{font-family:var(--f-disp);font-size:13px;color:var(--fg)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blauw),var(--geel));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hbtn{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;font-size:16px}
.streak{flex:0 0 auto;font-size:12px;color:var(--fg-2);text-align:right;line-height:1.2}
.streak b{display:block;font-family:var(--f-disp);font-size:16px;color:var(--fg)}

/* ---- main ---- */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 24px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.muted{color:var(--fg-2)}
.small{font-size:13px}
.art{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:11px;border:1px solid transparent;
  background:var(--blauw);color:#fff;font-weight:600;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--surface-2);color:var(--fg);border-color:var(--line)}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.hbtn:focus-visible,.tab:focus-visible{outline:3px solid var(--geel);outline-offset:2px}

/* ---- tabs ---- */
nav{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex}
.tab{flex:1 1 0;min-width:0;background:none;border:0;padding:8px 2px 10px;cursor:pointer;color:var(--fg-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--blauw)}

/* ---- quiz ---- */
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;margin:0;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blauw)}
.opt[data-st="sel"]{border-color:var(--blauw);background:var(--blauw-zacht)}
.opt[data-st="goed"]{border-color:var(--goed);background:var(--goed-zacht)}
.opt[data-st="fout"]{border-color:var(--fout);background:var(--fout-zacht)}
.opt:disabled{cursor:default}
.fb{border-radius:11px;padding:13px 14px;border:1.5px solid}
.fb.goed{border-color:var(--goed);background:var(--goed-zacht)}
.fb.fout{border-color:var(--fout);background:var(--fout-zacht)}
.fb h4{font-size:14px;margin-bottom:4px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--fg-2)}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg-2)}
.prog .bar{flex:1;margin:0}
.xppop{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--goed);color:#fff;font-family:var(--f-disp);
  font-weight:800;padding:7px 16px;border-radius:99px;z-index:50;pointer-events:none;opacity:0;transition:opacity .25s,transform .4s}
.xppop.on{opacity:1;transform:translateX(-50%) translateY(-10px)}

/* ---- grids ---- */
.grid{display:grid;gap:10px}
.g-mod{grid-template-columns:1fr}
@media(min-width:560px){.g-mod{grid-template-columns:1fr 1fr}}
.g-sign{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.modcard{display:flex;gap:12px;align-items:center;text-align:left;border-left:4px solid var(--c);cursor:pointer;width:100%}
.ring{flex:0 0 auto;width:46px;height:46px}
.signtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:pointer;text-align:center}
.bord{display:inline-block;line-height:0;vertical-align:middle}
.bord svg{width:100%;height:100%;display:block}
.signtile .bord{margin-inline:auto}
.signtile .code{font-family:var(--f-disp);font-size:11px;color:var(--fg-2)}

/* ---- battle pass ---- */
.pass{display:flex;gap:10px;overflow-x:auto;padding-block:4px 10px;scroll-snap-type:x proximity}
.tier{flex:0 0 118px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;
  display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;opacity:.55}
.tier.unlocked{opacity:1;border-color:var(--geel);box-shadow:0 0 0 2px rgba(242,194,0,.18)}
.tier .n{font-family:var(--f-disp);font-size:11px;color:var(--fg-3)}
.tier .ic{font-size:24px;line-height:1}
.tier .nm{font-size:11.5px;font-weight:600;line-height:1.3}

/* ---- puzzel ---- */
.scene{width:100%;max-width:340px;margin:0 auto;display:block;border-radius:12px;background:var(--surface-2)}
.actorbtn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:600}
.actorbtn[data-st="sel"]{border-color:var(--blauw);background:var(--blauw-zacht)}
.actorbtn .num{width:22px;height:22px;border-radius:50%;background:var(--blauw);color:#fff;display:grid;place-items:center;font-size:12px;font-family:var(--f-disp)}

/* ---- examen ---- */
.examtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:5}
.timer{font-family:var(--f-disp);font-size:19px;font-variant-numeric:tabular-nums}
.timer.laag{color:var(--fout)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:23px;height:23px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:10.5px;cursor:pointer;
  display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.dot[data-st="done"]{background:var(--blauw);color:#fff;border-color:var(--blauw)}
.dot[data-st="mark"]{background:var(--geel);color:#15202e;border-color:var(--geel)}
.dot[data-st="now"]{outline:2px solid var(--fg);outline-offset:1px}
.score{font-family:var(--f-disp);font-size:46px;line-height:1}
table.res{width:100%;border-collapse:collapse;font-size:13.5px}
table.res td{padding:7px 0;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* ---- vandaag: ring, cijfers, dagstrip ---- */
.dagkop{display:flex;gap:14px;align-items:center}
.dagring{flex:0 0 auto;width:72px;height:72px}
.dagring svg{width:100%;height:100%;display:block}
.cijfers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.cijfer{background:var(--surface-2);border-radius:10px;padding:9px 8px;text-align:center;min-width:0}
.cijfer .cv{font-family:var(--f-disp);font-weight:800;font-size:16px;line-height:1.2}
.cijfer .cl{font-size:10.5px;color:var(--fg-2);margin-top:2px}
.dagen{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dagvak{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;font-size:11.5px;color:var(--fg-3);font-weight:600}
.dagvak[data-st="af"]{background:var(--goed);border-color:var(--goed);color:#fff}
.dagvak[data-st="nu"]{border-color:var(--blauw);color:var(--blauw);box-shadow:0 0 0 2px rgba(11,78,162,.18)}
.vink{flex:0 0 auto;width:22px;height:22px}
.vink svg{width:100%;height:100%;display:block}
.modcard.gedaan .small{color:var(--goed)}

/* ---- instellingen ---- */
.schakel{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line)}
.schakel:last-of-type{border-bottom:0}
.tuimel{flex:0 0 auto;width:46px;height:27px;border-radius:99px;border:1.5px solid var(--line);
  background:var(--surface-2);cursor:pointer;padding:0;position:relative;transition:background .18s,border-color .18s}
.tuimel[data-aan="1"]{background:var(--goed);border-color:var(--goed)}
.tuimel .dop{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tuimel[data-aan="1"] .dop{transform:translateX(19px)}

/* ---- confetti ---- */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--asfalt);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header>
  <div class="hwrap">
    <div class="lvl" id="lvl">1</div>
    <div class="xpcol">
      <div class="xptop"><b id="lvlnm">Leerling</b><span class="tnum" id="xptxt">0 / 100 XP</span></div>
      <div class="bar"><i id="xpbar" style="width:0%"></i></div>
    </div>
    <div class="streak"><b class="tnum" id="streak">0</b>dagen</div>
    <button class="hbtn" id="themebtn" title="Licht of donker" aria-label="Thema wisselen">◐</button>
    <button class="hbtn" id="setbtn" title="Instellingen" aria-label="Instellingen">⚙</button>
  </div>
</header>

<main id="main"><div class="wrap" id="view"></div></main>

<nav id="nav"></nav>
<div class="xppop" id="xppop"></div>
<div class="toast" id="toast"></div>

<script>
/* Auto-theorie B — modules: lesstof, vragen en situatiepuzzels.
   Verwijzingen naar RVV 1990 / WVW 1994 zodat je het kunt nalezen op wetten.overheid.nl. */
window.MODULES = [
{
  id: 'voorrang', nr: 2, titel: 'Voorrang', kleur: '--m-voorrang',
  samenvatting: 'Wie mag er eerst? Van rechts, haaientanden, afslaan, bijzondere manoeuvres en voorrangsvoertuigen.',
  lessons: [
    {t:'Voorrang verlenen is iets anders dan voor laten gaan', b:'Voorrang verlenen doe je tegenover bestuurders: je stelt ze in staat ongehinderd door te rijden. Voor laten gaan doe je tegenover alle weggebruikers, dus ook voetgangers. Op het examen wordt dit verschil getoetst.', a:'RVV 1990, art. 1'},
    {t:'Hoofdregel: verkeer van rechts gaat voor', b:'Op een kruispunt laat je bestuurders die van rechts komen voorgaan. Dat geldt voor alle bestuurders: auto, motor, fiets, bromfiets, ook als ze langzaam zijn.', a:'RVV 1990, art. 15 lid 1'},
    {t:'Twee uitzonderingen op verkeer van rechts', b:'1. Kom je van een onverharde weg, dan verleen je voorrang aan bestuurders op de verharde weg. 2. Een tram gaat altijd voor, ook als die van links komt.', a:'RVV 1990, art. 15 lid 2'},
    {t:'Borden en tekens gaan boven de hoofdregel', b:'Haaientanden met bord B6, een stopstreep met B7, een voorrangsweg B1 of verkeerslichten bepalen de voorrang. Pas als die er niet zijn, geldt verkeer van rechts. Een verkeersregelaar gaat boven alles.', a:'RVV 1990, art. 82 en 84'},
    {t:'Haaientanden: de punten wijzen naar jou', b:'Wijzen de punten van de haaientanden naar jou toe, dan moet jij voorrang verlenen. Stoppen hoeft niet als de kruisende weg vrij is. Bij bord B7 moet je altijd stilstaan.', a:'RVV 1990, art. 80'},
    {t:'Afslaan: rechtdoor gaat voor', b:'Sla je af, dan laat je het rechtdoorgaande verkeer op dezelfde weg voorgaan. Dat is dus ook de fietser rechts naast je als jij rechtsaf gaat, en de tegenligger als jij linksaf gaat.', a:'RVV 1990, art. 18 lid 1'},
    {t:'Bijzondere manoeuvre: jij laat iedereen voorgaan', b:'Wegrijden, achteruitrijden, keren, een uitrit of erf uitrijden, van rijstrook wisselen, invoegen en uitvoegen zijn bijzondere manoeuvres. Je laat dan al het overige verkeer voorgaan, dus ook een fietser of voetganger.', a:'RVV 1990, art. 54'},
    {t:'Rotonde', b:'Haaientanden bij de oprit betekenen dat verkeer op de rotonde voorgaat. Verlaat je de rotonde, dan sla je af en laat je fietsers en voetgangers op het fietspad of zebrapad voorgaan. Zonder borden geldt gewoon verkeer van rechts.', a:'RVV 1990, art. 15 en 18'},
    {t:'Voorrangsvoertuig', b:'Een voertuig met blauw zwaailicht en tweetonige hoorn samen is een voorrangsvoertuig. Je laat het voorgaan, ook als jij groen hebt. Alleen zwaailicht zonder sirene geeft geen voorrang.', a:'RVV 1990, art. 50'},
    {t:'Lijnbus binnen de bebouwde kom', b:'Rijdt een lijnbus binnen de bebouwde kom weg vanaf een halte en geeft hij richting aan, dan laat jij hem voorgaan. Buiten de bebouwde kom hoeft dat niet.', a:'RVV 1990, art. 56'},
    {t:'Blokkeer het kruispunt niet', b:'Je mag een kruispunt alleen oprijden als je er ook voorbij kunt komen. Sta je stil op het kruispunt, dan blokkeer je de kruisende richting.', a:'RVV 1990, art. 14'},
    {t:'Voorrang krijg je niet, die geven anderen', b:'Ook als jij voorrang hebt, moet je een botsing voorkomen. Zie je dat iemand jouw voorrang niet geeft, dan rem je. Een ongeluk met voorrang is nog steeds een ongeluk.', a:'WVW 1994, art. 5'}
  ],
  questions: [
    {t:'mc', v:'Je nadert een gelijkwaardig kruispunt zonder borden. Van rechts komt een fietser, van links een auto. Wie laat jij voorgaan?', o:['Alleen de fietser van rechts','Alleen de auto van links','Allebei','Niemand, jij komt als eerste aan'], a:0, u:'Verkeer van rechts gaat voor, en een fietser is ook een bestuurder. De auto van links moet jou voor laten gaan.', art:'RVV 1990, art. 15 lid 1'},
    {t:'jn', v:'Een tram die van links komt op een gelijkwaardig kruispunt moet jou voor laten gaan.', a:1, u:'Nee. Een tram gaat altijd voor, ook vanaf links. Dat is een uitzondering op verkeer van rechts.', art:'RVV 1990, art. 15 lid 2'},
    {t:'mc', v:'Je komt van een zandweg en wilt een asfaltweg oprijden. Er staan geen borden. Wat doe je?', o:['Je hebt voorrang als je van rechts komt','Je verleent voorrang aan al het verkeer op de asfaltweg','Verkeer van rechts gaat voor, verder niets','Je moet verplicht stoppen'], a:1, u:'Vanaf een onverharde weg verleen je voorrang aan bestuurders op de verharde weg, ongeacht uit welke richting ze komen. Stoppen is niet verplicht als het vrij is.', art:'RVV 1990, art. 15 lid 2 onder a'},
    {t:'jn', v:'Bij haaientanden met bord B6 moet je altijd stilstaan.', a:1, u:'Nee. Je moet voorrang verlenen, maar als de kruisende weg vrij is mag je doorrijden. Alleen bij bord B7 (stopbord) is stilstaan verplicht.', art:'RVV 1990, art. 80'},
    {t:'mc', v:'Je slaat rechtsaf. Rechts naast je rijdt een fietser rechtdoor op het fietspad. Wie gaat voor?', o:['Jij, want jij bent eerder bij de zijstraat','De fietser','Wie het eerst gaat','De fietser alleen als die op de rijbaan rijdt'], a:1, u:'Afslaand verkeer laat rechtdoorgaand verkeer op dezelfde weg voorgaan. Dit is een van de vaakst gemaakte fouten.', art:'RVV 1990, art. 18 lid 1'},
    {t:'mc', v:'Je rijdt achteruit een parkeervak uit. Er nadert een bromfietser. Wat geldt?', o:['Bromfietser gaat voor, want achteruitrijden is een bijzondere manoeuvre','Jij gaat voor omdat je al bezig bent','Verkeer van rechts beslist','Jij gaat voor als je richting aangeeft'], a:0, u:'Achteruitrijden is een bijzondere manoeuvre. Je laat al het overige verkeer voorgaan.', art:'RVV 1990, art. 54'},
    {t:'multi', v:'Welke van deze handelingen zijn bijzondere manoeuvres?', o:['Keren','Rechtdoor rijden op een voorrangsweg','Wegrijden vanaf de kant','Van rijstrook wisselen','Rechtsaf slaan op een kruispunt'], a:[0,2,3], u:'Keren, wegrijden en van rijstrook wisselen zijn bijzondere manoeuvres. Afslaan op een kruispunt is dat niet; daarvoor geldt de afslaanregel.', art:'RVV 1990, art. 54'},
    {t:'jn', v:'Een ambulance met alleen blauw zwaailicht aan, zonder sirene, is een voorrangsvoertuig.', a:1, u:'Nee. Er moet zowel een optisch signaal (blauw zwaailicht) als een geluidssignaal (tweetonige hoorn) zijn. Alleen zwaailicht betekent vaak: werkzaamheden of een incident ter plaatse.', art:'RVV 1990, art. 50 en art. 1'},
    {t:'mc', v:'Jij hebt groen licht. Van rechts komt een brandweerauto met zwaailicht en sirene. Wat doe je?', o:['Doorrijden, groen gaat voor','Je laat de brandweerauto voorgaan','Je rijdt het kruispunt op en gaat dan aan de kant','Je claxonneert'], a:1, u:'Een voorrangsvoertuig laat je altijd voorgaan, ook met groen licht. Blijf wel voorspelbaar: stop op een veilige plek en blokkeer de doorgang niet.', art:'RVV 1990, art. 50'},
    {t:'mc', v:'Een lijnbus wil binnen de bebouwde kom wegrijden vanaf een halte en geeft richting aan. Jij nadert.', o:['De bus moet wachten','Jij laat de bus voorgaan','Alleen op een 30 km/h-weg laat je de bus voor','Jij mag beslissen'], a:1, u:'Binnen de bebouwde kom laat je een wegrijdende lijnbus voorgaan. Buiten de bebouwde kom geldt dit niet.', art:'RVV 1990, art. 56'},
    {t:'jn', v:'Op een rotonde met haaientanden bij de oprit heeft verkeer op de rotonde voorrang.', a:0, u:'Ja. De haaientanden wijzen naar de naderende bestuurder, dus die verleent voorrang aan het verkeer dat al op de rotonde rijdt.', art:'RVV 1990, art. 80'},
    {t:'mc', v:'Je verlaat een rotonde. Over het fietspad langs de uitrit rijdt een fietser rechtdoor. Wie gaat voor?', o:['Jij, want je komt van de rotonde','De fietser','Verkeer van rechts','Dat hangt af van de kleur van het fietspad'], a:1, u:'De rotonde verlaten is afslaan. Je laat de rechtdoorgaande fietser voorgaan.', art:'RVV 1990, art. 18 lid 1'},
    {t:'mc', v:'Je rijdt een erf uit (bord G6, einde erf). Wat moet je doen?', o:['Voorrang verlenen aan bestuurders','Al het verkeer voor laten gaan','Niets, verkeer van rechts geldt','Alleen op voetgangers letten'], a:1, u:'Een erf uitrijden is een bijzondere manoeuvre: je laat al het verkeer voorgaan, dus ook voetgangers.', art:'RVV 1990, art. 54'},
    {t:'jn', v:'Als jij voorrang hebt, mag je erop vertrouwen dat de ander stopt.', a:1, u:'Nee. Voorrang krijg je, je neemt het niet. Je blijft verplicht een ongeval te voorkomen.', art:'WVW 1994, art. 5'},
    {t:'mc', v:'Je staat voor een file op het kruispunt. Het licht is groen, maar voorbij het kruispunt is geen ruimte. Wat doe je?', o:['Oprijden, je hebt groen','Wachten voor het kruispunt','Half oprijden','Oprijden en dan de kruisende richting laten passeren'], a:1, u:'Je mag een kruispunt alleen oprijden als je er ook voorbij kunt komen, anders blokkeer je het kruisende verkeer.', art:'RVV 1990, art. 14'},
    {t:'order', v:'Zet op volgorde wie als eerste mag rijden. Gelijkwaardig kruispunt: jij komt uit het zuiden en gaat rechtdoor, een auto uit het oosten (rechts van jou) gaat rechtdoor, een tram uit het westen (links van jou) gaat rechtdoor.', o:['De tram uit het westen','De auto uit het oosten','Jij'], a:[0,1,2], u:'De tram gaat altijd eerst, ook van links. Daarna de auto van rechts, dan jij.', art:'RVV 1990, art. 15 lid 2 onder b'},
    {t:'fill', v:'Wiens aanwijzingen gaan boven alle borden en verkeerslichten? (één woord)', a:'verkeersregelaar', u:'Aanwijzingen van een verkeersregelaar gaan boven verkeerslichten, verkeerstekens en verkeersregels.', art:'RVV 1990, art. 82 en 84'},
    {t:'mc', v:'Je nadert een kruispunt met bord B1 (voorrangsweg). Van rechts komt een auto uit een zijweg. Wat geldt?', o:['Verkeer van rechts gaat voor','Jij hebt voorrang','Je moet stoppen','Allebei langzaam rijden en wie het eerst kan'], a:1, u:'Op een voorrangsweg heb jij voorrang op verkeer uit de zijwegen; het bord gaat boven de regel verkeer van rechts.', art:'RVV 1990, art. 15 en bijlage 1'},
    {t:'jn', v:'Een voetganger die oversteekt bij een zebrapad moet je voor laten gaan.', a:0, u:'Ja. Bij een voetgangersoversteekplaats laat je voetgangers en bestuurders van een gehandicaptenvoertuig die oversteken of op het punt staan over te steken voorgaan.', art:'RVV 1990, art. 49 lid 2'},
    {t:'mc', v:'Je wilt linksaf slaan op een kruispunt. Er komt een tegenligger die rechtdoor gaat. Wie gaat voor?', o:['Jij, als je als eerste het kruispunt op bent','De tegenligger','Wie van rechts komt','Jij, want linksaf heeft voorrang'], a:1, u:'Afslaand verkeer laat rechtdoorgaand verkeer op dezelfde weg voorgaan.', art:'RVV 1990, art. 18 lid 1'},
    {t:'multi', v:'In welke situaties moet je voorrang verlenen of voor laten gaan?', o:['Je voegt in op de snelweg','Je rijdt rechtdoor op een voorrangsweg','Je komt uit een uitrit','Je nadert haaientanden','Een tram kruist van links'], a:[0,2,3,4], u:'Invoegen en uit een uitrit komen zijn bijzondere manoeuvres, haaientanden betekenen voorrang verlenen en een tram gaat altijd voor. Rechtdoor op een voorrangsweg niet.', art:'RVV 1990, art. 15, 54 en 80'},
    {t:'jn', v:'Bij bord B7 mag je doorrijden als de kruisende weg leeg is.', a:1, u:'Nee. Bij een stopbord moet je altijd stilstaan voor de stopstreep, ook als er niemand aankomt.', art:'RVV 1990, bijlage 1 bord B7'},
    {t:'mc', v:'Een militaire colonne rijdt over het kruispunt. Jij hebt voorrang. Wat doe je?', o:['Doorrijden, jij hebt voorrang','Wachten, je mag de colonne niet doorsnijden','Claxonneren','Invoegen tussen twee voertuigen'], a:1, u:'Je mag een militaire colonne en een uitvaartstoet van meer dan één voertuig niet doorsnijden.', art:'RVV 1990, art. 16'},
    {t:'mc', v:'Je voegt in op de autosnelweg vanaf de invoegstrook. Wie gaat voor?', o:['Jij, want de invoegstrook houdt op','Het verkeer op de doorgaande rijbaan','Verkeer van rechts','Niemand, je rijdt gewoon in'], a:1, u:'Invoegen is een bijzondere manoeuvre: je past je snelheid aan en laat het verkeer op de doorgaande rijbaan voorgaan.', art:'RVV 1990, art. 54'},
    {t:'jn', v:'Een blinde met een witte stok die wil oversteken moet je voor laten gaan.', a:0, u:'Ja. Je laat blinden met een witte stok en gehandicapten die moeite hebben met oversteken altijd voorgaan.', art:'RVV 1990, art. 49 lid 1'},
    {t:'mc', v:'Op een gelijkwaardig kruispunt komen jij (zuid, rechtdoor) en een auto van rechts (oost) die linksaf gaat. Wie gaat voor?', o:['Jij, want de ander slaat af','De auto van rechts','Jij, want jij gaat rechtdoor','Wie het eerst er is'], a:1, u:'De afslaanregel geldt alleen voor verkeer op dezelfde weg. Tussen kruisende richtingen beslist verkeer van rechts.', art:'RVV 1990, art. 15 lid 1 en art. 18'},
    {t:'fill', v:'Hoe heet het verkeersteken van driehoekjes op het wegdek dat betekent: voorrang verlenen? (één woord)', a:'haaientanden', u:'De punten van de haaientanden wijzen naar de bestuurder die voorrang moet verlenen.', art:'RVV 1990, art. 80'},
    {t:'mc', v:'Verkeerslichten staan op geel knipperen. Wat geldt er op het kruispunt?', o:['Je mag altijd doorrijden','De verkeerslichten gelden niet; borden en regels bepalen de voorrang','Iedereen moet stoppen','Verkeer van rechts vervalt'], a:1, u:'Bij geel knipperen werken de lichten niet als regeling. Je kijkt naar de borden en wegmarkering, en anders geldt verkeer van rechts.', art:'RVV 1990, art. 75'},
    {t:'jn', v:'Als je van rijstrook wisselt op de snelweg, moet je het verkeer op die rijstrook voor laten gaan.', a:0, u:'Ja. Van rijstrook wisselen is een bijzondere manoeuvre.', art:'RVV 1990, art. 54'},
    {t:'mc', v:'Bij een kruispunt regelt een agent het verkeer. De verkeerslichten staan op groen, de agent geeft jou een stopteken. Wat doe je?', o:['Doorrijden, groen gaat voor','Stoppen','Langzaam doorrijden','Claxonneren en doorrijden'], a:1, u:'Aanwijzingen van een bevoegde verkeersregelaar of agent gaan boven verkeerslichten, borden en regels.', art:'RVV 1990, art. 82 en 84'},
    {t:'multi', v:'Welke voertuigen gaan voor als ze een tweetonige hoorn én blauw zwaailicht voeren?', o:['Ambulance','Brandweer','Politie','Taxi','Een bergingsvoertuig met alleen oranje zwaailicht'], a:[0,1,2], u:'Hulpdiensten met optische én geluidssignalen zijn voorrangsvoertuigen. Oranje zwaailicht geeft geen voorrang; het waarschuwt alleen.', art:'RVV 1990, art. 50'},
    {t:'mc', v:'Je staat stil voor een zebrapad om een voetganger over te laten steken. Achter je wil iemand inhalen. Wat is waar?', o:['Dat mag, als het rustig gebeurt','Inhalen vlak voor of op een zebrapad is verboden','Alleen een fiets mag inhalen','Dat mag als er geen bord staat'], a:1, u:'Je mag niet inhalen vlak voor of op een voetgangersoversteekplaats; de voetganger zou onzichtbaar zijn voor de inhaler.', art:'RVV 1990, art. 12'},
    {t:'jn', v:'Op een gelijkwaardig kruispunt moet je ook een snorfiets van rechts voor laten gaan.', a:0, u:'Ja. Een snorfietser is een bestuurder en valt gewoon onder de regel verkeer van rechts.', art:'RVV 1990, art. 15 lid 1'},
    {t:'mc', v:'Je nadert een onbewaakte spoorwegovergang met een andreaskruis. Een trein nadert. Wat geldt?', o:['Verkeer van rechts','De trein gaat altijd voor','Je mag oversteken als je snel bent','Alleen bij gesloten bomen wachten'], a:1, u:'Bij een spoorwegovergang gaat de trein altijd voor. Steek alleen over als je er helemaal voorbij kunt komen.', art:'RVV 1990, art. 14 en 71'},
    {t:'order', v:'Zet op volgorde wie als eerste mag rijden. Gelijkwaardig kruispunt zonder borden: auto A komt uit het noorden en gaat rechtdoor, auto B uit het oosten gaat rechtdoor, auto C uit het westen gaat rechtdoor. Niemand komt uit het zuiden.', o:['Auto B (oost)','Auto A (noord)','Auto C (west)'], a:[0,1,2], u:'B heeft niemand van rechts (zuid is leeg) en mag eerst. Daarna A, die B rechts had. Dan C.', art:'RVV 1990, art. 15 lid 1'}
  ],
  puzzles: [
    {v:'Gelijkwaardig kruispunt, geen borden. Alle drie gaan rechtdoor. Klik op de volgorde waarin ze mogen rijden.', scene:{type:'kruis', borden:'geen', actors:[{id:'A',van:'zuid',naar:'rd',label:'Jij',kleur:'jij'},{id:'B',van:'oost',naar:'rd',label:'B'},{id:'C',van:'noord',naar:'rd',label:'C'}]}, a:['C','B','A'], u:'C (noord) heeft niemand van rechts: west is leeg. C eerst. Dan B, die C niet rechts heeft maar wel voor jou ligt. Jij (zuid) hebt B rechts, dus jij als laatste.', art:'RVV 1990, art. 15 lid 1'},
    {v:'Jij komt uit het zuiden en gaat rechtdoor. Je hebt haaientanden voor je. Van links komt B rechtdoor op de voorrangsweg. Klik de volgorde.', scene:{type:'kruis', borden:'haaientanden-zuid', actors:[{id:'A',van:'zuid',naar:'rd',label:'Jij',kleur:'jij'},{id:'B',van:'west',naar:'rd',label:'B'}]}, a:['B','A'], u:'De haaientanden wijzen naar jou. Je verleent voorrang aan alle bestuurders op de kruisende weg, ook van links.', art:'RVV 1990, art. 80'},
    {v:'Jij (zuid) gaat linksaf. Tegenligger T (noord) gaat rechtdoor. Klik de volgorde.', scene:{type:'kruis', borden:'geen', actors:[{id:'A',van:'zuid',naar:'links',label:'Jij',kleur:'jij'},{id:'T',van:'noord',naar:'rd',label:'T'}]}, a:['T','A'], u:'Jij slaat af, T gaat rechtdoor op dezelfde weg. Rechtdoor gaat voor.', art:'RVV 1990, art. 18 lid 1'},
    {v:'Jij (zuid) gaat rechtsaf. Naast je rijdt fietser F rechtdoor op het fietspad rechts. Klik de volgorde.', scene:{type:'kruis', borden:'geen', actors:[{id:'A',van:'zuid',naar:'rechts',label:'Jij',kleur:'jij'},{id:'F',van:'zuid',naar:'rd',label:'F',soort:'fiets'}]}, a:['F','A'], u:'De fietser gaat rechtdoor op dezelfde weg. Jij slaat af en laat hem voorgaan. Kijk over je rechterschouder in de dode hoek.', art:'RVV 1990, art. 18 lid 1'},
    {v:'Gelijkwaardig kruispunt. Tram R komt van links, auto B van rechts, jij komt uit het zuiden. Allen rechtdoor. Klik de volgorde.', scene:{type:'kruis', borden:'geen', actors:[{id:'A',van:'zuid',naar:'rd',label:'Jij',kleur:'jij'},{id:'B',van:'oost',naar:'rd',label:'B'},{id:'R',van:'west',naar:'rd',label:'Tram',soort:'tram'}]}, a:['R','B','A'], u:'De tram gaat altijd eerst, ook van links. Daarna de auto van rechts, dan jij.', art:'RVV 1990, art. 15 lid 2 onder b'},
    {v:'Jij staat stil in een uitrit en wilt de weg op. Op de weg nadert auto B, op het trottoir loopt voetganger V langs de uitrit. Klik de volgorde.', scene:{type:'uitrit', actors:[{id:'A',van:'uitrit',naar:'rd',label:'Jij',kleur:'jij'},{id:'B',van:'west',naar:'rd',label:'B'},{id:'V',van:'trottoir',naar:'rd',label:'V',soort:'voet'}]}, a:['V','B','A'], u:'Uit een uitrit komen is een bijzondere manoeuvre: je laat al het verkeer voorgaan. De voetganger kruist je als eerste.', art:'RVV 1990, art. 54'}
  ]
},
{
  id: 'tekens', nr: 5, titel: 'Verkeerstekens', kleur: '--m-tekens',
  samenvatting: 'Borden, verkeerslichten, strepen op de weg en wie wint als ze elkaar tegenspreken.',
  lessons: [
    {t:'De rangorde van verkeerstekens', b:'Aanwijzingen van een verkeersregelaar gaan boven verkeerslichten. Verkeerslichten gaan boven verkeerstekens (borden en strepen). Verkeerstekens gaan boven de verkeersregels. Deze volgorde wordt op het examen vaak gevraagd.', a:'RVV 1990, art. 82 en 84'},
    {t:'Bordgroepen herkennen', b:'A = snelheid, B = voorrang, C = geslotenverklaring, D = gebod, E = parkeren en stilstaan, F = inhalen en doorgang, G = soort weg, H = bebouwde kom, J = waarschuwing, K = voorsorteren, L = informatie.', a:'RVV 1990, bijlage 1'},
    {t:'Vorm en kleur vertellen het verhaal', b:'Rode rand met wit = verbod. Rode driehoek met punt omhoog = waarschuwing. Blauwe cirkel = gebod. Blauw vierkant = informatie of toestemming. Gele ruit = voorrangsweg. Rode achthoek = stop.', a:'RVV 1990, bijlage 1'},
    {t:'Onderborden', b:'Een onderbord beperkt of verruimt het bord erboven: een tijdvak, een soort voertuig, een afstand of een pijl met de richting waarvoor het geldt. Het onderbord kan een verbod ook juist opheffen voor bepaalde voertuigen.', a:'RVV 1990, art. 67'},
    {t:'Verkeerslichten', b:'Rood: stoppen voor de stopstreep. Geel: stoppen, tenzij dat niet meer veilig kan. Groen: doorrijden. Een groene pijl geeft toestemming voor die richting, maar je moet nog steeds voorrang verlenen aan verkeer dat al mag rijden.', a:'RVV 1990, art. 68'},
    {t:'Bijzondere lichten', b:'Rood knipperend bij een spoorwegovergang: stoppen. Geel knipperend: gevaarlijk punt, voorzichtigheid geboden. Een wit licht bij een tram of lijnbus is een richtinglicht voor die bestuurder, niet voor jou. Een rood kruis boven je rijstrook betekent dat die gesloten is.', a:'RVV 1990, art. 70, 71, 73 en 75'},
    {t:'Strepen op de weg', b:'Een doorgetrokken streep mag je niet overschrijden en niet eroverheen rijden. Bij een onderbroken streep naast een doorgetrokken streep geldt de streep die het dichtst bij jou ligt. Een blokmarkering (brede onderbroken streep) scheidt rijstroken en mag je wel overschrijden.', a:'RVV 1990, art. 76'},
    {t:'Haaientanden en stopstreep', b:'Haaientanden: voorrang verlenen, stoppen hoeft niet. Stopstreep bij bord B7 of bij rood licht: altijd voor de streep stilstaan. Een stopstreep zonder bord hoort bij de verkeerslichten.', a:'RVV 1990, art. 80 en 68'},
    {t:'Zebrapad en fietsstrook', b:'Een zebrapad bestaat uit witte banen over de weg: voetgangers voor laten gaan. Een fietsstrook is een strook op de rijbaan met fietssymbolen; je mag er met een motorvoertuig niet op rijden, ook niet om te parkeren.', a:'RVV 1990, art. 10 en 49'},
    {t:'Veel verwarde borden', b:'C2 (wit balkje in rode cirkel) is inrijden verboden; C3 (witte pijl in blauwe cirkel) is eenrichtingsweg waar je juist wel mag rijden. E1 is parkeerverbod, E2 is stilstaan verboden. G11 is verplicht fietspad, G13 is onverplicht fietspad.', a:'RVV 1990, bijlage 1'}
  ],
  questions: [
    {t:'mc', v:'Een verkeersregelaar geeft een stopteken terwijl het verkeerslicht groen is. Wat gaat voor?', o:['Het verkeerslicht','De verkeersregelaar','Het bord bij het kruispunt','De verkeersregel'], a:1, u:'De rangorde is: verkeersregelaar, dan verkeerslichten, dan verkeerstekens, dan verkeersregels.', art:'RVV 1990, art. 82 en 84'},
    {t:'sign', v:'Welk bord is dit?', signCode:'B6', o:['Verleen voorrang aan bestuurders op de kruisende weg','Stop, verleen voorrang','Voorrangsweg','Voorrangskruispunt'], a:0, u:'De omgekeerde driehoek met rode rand is B6: voorrang verlenen. Stoppen hoeft niet als het vrij is.', art:'RVV 1990, bijlage 1 bord B6'},
    {t:'sign', v:'Welk bord is dit?', signCode:'B1', o:['Voorrangskruispunt','Voorrangsweg','Einde voorrangsweg','Erf'], a:1, u:'De gele ruit B1 betekent dat jij op de voorrangsweg rijdt.', art:'RVV 1990, bijlage 1 bord B1'},
    {t:'sign', v:'Welk bord is dit?', signCode:'C2', o:['Eenrichtingsweg','Gesloten in beide richtingen','Eenrichtingsweg, inrijden verboden','Verbod stil te staan'], a:2, u:'Rode cirkel met wit balkje: inrijden verboden. Vanaf de andere kant mag het verkeer er wel in.', art:'RVV 1990, bijlage 1 bord C2'},
    {t:'sign', v:'Welk bord is dit?', signCode:'E2', o:['Parkeerverbod','Verbod stil te staan','Parkeergelegenheid','Laden en lossen'], a:1, u:'Twee rode strepen betekent stilstaan verboden. Eén streep (E1) is alleen parkeerverbod.', art:'RVV 1990, bijlage 1 bord E2'},
    {t:'sign', v:'Welk bord is dit?', signCode:'G5', o:['Woonwijk','Erf','Voetpad','Autoweg'], a:1, u:'Op een erf mag je niet sneller dan 15 km per uur rijden en mogen voetgangers de hele breedte van de weg gebruiken.', art:'RVV 1990, bijlage 1 bord G5'},
    {t:'mc', v:'Wat betekent een gele ruit met witte rand?', o:['Voorrangskruispunt','Voorrangsweg','Einde voorrangsweg','Omleiding'], a:1, u:'B1, voorrangsweg. Dezelfde ruit met een zwarte schuine streep erdoor is B2: einde voorrangsweg.', art:'RVV 1990, bijlage 1'},
    {t:'jn', v:'Een doorgetrokken streep mag je overschrijden om een fietser in te halen.', a:1, u:'Nee. Een doorgetrokken streep mag je niet overschrijden. Je wacht tot de streep onderbroken is of tot er genoeg ruimte is binnen je eigen strook.', art:'RVV 1990, art. 76'},
