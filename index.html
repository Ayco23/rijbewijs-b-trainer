<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Rijbewijs B Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: mobiele app met vaste bovenbalk (XP) en onderbalk (tabs); content scrolt ertussen.
   Palet komt uit de RVV-bordenwereld: bordblauw, bordrood, haaientandwit, asfaltgrijs met blauwe inslag. */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --line:#d6dce6;
  --fg:#15202e; --fg-2:#5a6779; --fg-3:#8793a5;
  --blauw:#0b4ea2; --blauw-zacht:#e4edf9; --rood:#d2272e; --geel:#f2c200;
  --goed:#17794a; --goed-zacht:#e1f3e9; --fout:#c22a2a; --fout-zacht:#fbe6e6;
  --asfalt:#3d4652;
  --m-voorrang:#0b4ea2; --m-tekens:#b4541a; --m-weg:#0e7490; --m-bijzonder:#6d28d9;
  --m-veilig:#b91c1c; --m-milieu:#15803d; --m-wet:#a16207; --m-voertuig:#475569;
  --f-disp:'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --f-body:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:14px; --sh:0 1px 2px rgba(21,32,46,.08), 0 6px 18px rgba(21,32,46,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151c; --surface:#19202a; --surface-2:#222b37; --line:#303b4a;
  --fg:#eaeff6; --fg-2:#a2aebf; --fg-3:#78859a;
  --blauw:#5a9bf0; --blauw-zacht:#1b2736; --rood:#f0646a;
  --goed:#4bd08a; --goed-zacht:#14301f; --fout:#f0646a; --fout-zacht:#311718;
  --asfalt:#aab6c6; --m-voorrang:#5a9bf0; --m-tekens:#e08a4e; --m-weg:#38bdf8; --m-bijzonder:#a78bfa;
  --m-veilig:#f87171; --m-milieu:#4ade80; --m-wet:#fbbf24; --m-voertuig:#94a3b8;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#10151c; --surface:#19202a; --surface-2:#222b37; --line:#303b4a;
  --fg:#eaeff6; --fg-2:#a2aebf; --fg-3:#78859a;
  --blauw:#5a9bf0; --blauw-zacht:#1b2736; --rood:#f0646a;
  --goed:#4bd08a; --goed-zacht:#14301f; --fout:#f0646a; --fout-zacht:#311718;
  --asfalt:#aab6c6; --m-voorrang:#5a9bf0; --m-tekens:#e08a4e; --m-weg:#38bdf8; --m-bijzonder:#a78bfa;
  --m-veilig:#f87171; --m-milieu:#4ade80; --m-wet:#fbbf24; --m-voertuig:#94a3b8;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---- bovenbalk ---- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
header{flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);z-index:20}
.hwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;display:flex;align-items:center;gap:12px}
.lvl{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--blauw);color:#fff;display:grid;place-items:center;
  font-family:var(--f-disp);font-weight:800;font-size:15px}
.xpcol{flex:1 1 auto;min-width:0}
.xptop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--fg-2)}
.xptop b{font-family:var(--f-disp);font-size:13px;color:var(--fg)}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blauw),var(--geel));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hbtn{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;display:grid;place-items:center;font-size:16px}
.streak{flex:0 0 auto;font-size:12px;color:var(--fg-2);text-align:right;line-height:1.2}
.streak b{display:block;font-family:var(--f-disp);font-size:16px;color:var(--fg)}

/* ---- main ---- */
main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 24px;max-width:720px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stack{display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-3);font-weight:600}
.muted{color:var(--fg-2)}
.small{font-size:13px}
.art{font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:11px;border:1px solid transparent;
  background:var(--blauw);color:#fff;font-weight:600;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--surface-2);color:var(--fg);border-color:var(--line)}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.hbtn:focus-visible,.tab:focus-visible{outline:3px solid var(--geel);outline-offset:2px}

/* ---- tabs ---- */
nav{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));
  padding-bottom:env(safe-area-inset-bottom,0px);display:flex}
.tab{flex:1 1 0;min-width:0;background:none;border:0;padding:8px 2px 10px;cursor:pointer;color:var(--fg-3);
  display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--blauw)}

/* ---- quiz ---- */
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;margin:0;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blauw)}
.opt[data-st="sel"]{border-color:var(--blauw);background:var(--blauw-zacht)}
.opt[data-st="goed"]{border-color:var(--goed);background:var(--goed-zacht)}
.opt[data-st="fout"]{border-color:var(--fout);background:var(--fout-zacht)}
.opt:disabled{cursor:default}
.fb{border-radius:11px;padding:13px 14px;border:1.5px solid}
.fb.goed{border-color:var(--goed);background:var(--goed-zacht)}
.fb.fout{border-color:var(--fout);background:var(--fout-zacht)}
.fb h4{font-size:14px;margin-bottom:4px}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--surface-2);color:var(--fg-2)}
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--fg-2)}
.prog .bar{flex:1;margin:0}
.xppop{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--goed);color:#fff;font-family:var(--f-disp);
  font-weight:800;padding:7px 16px;border-radius:99px;z-index:50;pointer-events:none;opacity:0;transition:opacity .25s,transform .4s}
.xppop.on{opacity:1;transform:translateX(-50%) translateY(-10px)}

/* ---- grids ---- */
.grid{display:grid;gap:10px}
.g-mod{grid-template-columns:1fr}
@media(min-width:560px){.g-mod{grid-template-columns:1fr 1fr}}
.g-sign{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.modcard{display:flex;gap:12px;align-items:center;text-align:left;border-left:4px solid var(--c);cursor:pointer;width:100%}
.ring{flex:0 0 auto;width:46px;height:46px}
.signtile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;
  align-items:center;gap:6px;cursor:pointer;text-align:center}
.bord{display:inline-block;line-height:0;vertical-align:middle}
.bord svg{width:100%;height:100%;display:block}
.signtile .bord{margin-inline:auto}
.signtile .code{font-family:var(--f-disp);font-size:11px;color:var(--fg-2)}

/* ---- battle pass ---- */
.pass{display:flex;gap:10px;overflow-x:auto;padding-block:4px 10px;scroll-snap-type:x proximity}
.tier{flex:0 0 118px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px;
  display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;opacity:.55}
.tier.unlocked{opacity:1;border-color:var(--geel);box-shadow:0 0 0 2px rgba(242,194,0,.18)}
.tier .n{font-family:var(--f-disp);font-size:11px;color:var(--fg-3)}
.tier .ic{font-size:24px;line-height:1}
.tier .nm{font-size:11.5px;font-weight:600;line-height:1.3}

/* ---- puzzel ---- */
.scene{width:100%;max-width:340px;margin:0 auto;display:block;border-radius:12px;background:var(--surface-2)}
/* Beeld bij een vraag. max-width gelijk aan .scene zodat een situatie en een puzzel
   even groot ogen; img en svg krijgen dezelfde behandeling. */
.vraagbeeld{width:100%;max-width:340px;margin:0 auto}
.vraagbeeld img,.vraagbeeld svg{width:100%;height:auto;display:block;border-radius:12px;background:var(--surface-2)}
/* Hotspot: het beeld is zelf het invoerveld, dus de markering ligt erbovenop. */
.hotspot{position:relative;width:100%;max-width:340px;margin:0 auto;cursor:crosshair;touch-action:manipulation}
.hotspot[data-vast]{cursor:default}
.hotspot .merk{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
  border:2.5px solid var(--fg);background:rgba(255,255,255,.35);pointer-events:none}
.hotspot .merk.vink{border-radius:6px;background:var(--fg);color:var(--bg);
  display:flex;align-items:center;justify-content:center;font-size:14px;line-height:1}
.hotspot .hotvak{position:absolute;border-radius:8px;pointer-events:none;border:2.5px dashed var(--goed)}
.hotspot .hotvak[data-st=fout]{border-color:var(--fout)}
.actorbtn{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);
  background:var(--surface);cursor:pointer;font-weight:600}
.actorbtn[data-st="sel"]{border-color:var(--blauw);background:var(--blauw-zacht)}
.actorbtn .num{width:22px;height:22px;border-radius:50%;background:var(--blauw);color:#fff;display:grid;place-items:center;font-size:12px;font-family:var(--f-disp)}

/* ---- examen ---- */
.examtop{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;background:var(--bg);padding-block:8px;z-index:5}
.timer{font-family:var(--f-disp);font-size:19px;font-variant-numeric:tabular-nums}
.timer.laag{color:var(--fout)}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:23px;height:23px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:10.5px;cursor:pointer;
  display:grid;place-items:center;padding:0;font-variant-numeric:tabular-nums}
.dot[data-st="done"]{background:var(--blauw);color:#fff;border-color:var(--blauw)}
.dot[data-st="mark"]{background:var(--geel);color:#15202e;border-color:var(--geel)}
.dot[data-st="now"]{outline:2px solid var(--fg);outline-offset:1px}
.score{font-family:var(--f-disp);font-size:46px;line-height:1}
table.res{width:100%;border-collapse:collapse;font-size:13.5px}
table.res td{padding:7px 0;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* ---- de wereld van de weg ---- */
/* Onder de bovenbalk loopt een strook asfalt met belijning: de app begint
   letterlijk op de weg. */
header{position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:5px;
  background:repeating-linear-gradient(90deg,var(--asfalt) 0 14px,transparent 14px 26px);opacity:.45}
.ritwrap{margin:2px -4px 0}
.rit{width:100%;height:auto;display:block}
.klaarvlag{flex:0 0 auto;line-height:0}
.kopRij{display:flex;align-items:center;gap:10px;justify-content:space-between}
.kopRij h2{min-width:0}
.ringwrap{flex:0 0 auto;position:relative;width:46px;height:46px}
.ringwrap .ring{width:46px;height:46px}
.modico{position:absolute;inset:0;display:grid;place-items:center;line-height:0}
.modkaart{border-left:4px solid var(--c)}
.modkop{display:flex;gap:11px;align-items:center}
.modbadge{flex:0 0 auto;width:44px;height:44px;border-radius:12px;background:var(--surface-2);
  display:grid;place-items:center;line-height:0}
.uitslaglicht{display:flex;justify-content:center;line-height:0;margin-bottom:2px}

/* ---- bord in lopende tekst ---- */
.bordchip{display:inline-flex;align-items:center;gap:4px;vertical-align:-7px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:7px;
  padding:2px 6px 2px 3px;margin:0 2px;line-height:0}
.bordchip .bord{width:26px;height:26px}
.bordchip .bc{font-family:var(--f-disp);font-size:11px;font-weight:700;color:var(--fg-2);line-height:1}
.opt .bordchip{vertical-align:-7px}

/* ---- voortgang per module in Leren ---- */
.modstat{display:flex;flex-wrap:wrap;gap:6px}
.pil{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;
  font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--fg-3);border:1px solid var(--line)}
.pil.aan{color:var(--goed);border-color:var(--goed);background:var(--goed-zacht)}
.pil.medaille{color:var(--fg);border-color:var(--geel);background:rgba(242,194,0,.14)}
.pil.nu{color:var(--blauw);border-color:var(--blauw);background:var(--blauw-zacht)}
.pilv{width:13px;height:13px;flex:0 0 auto}
.btn.sec.gedaan{border-color:var(--goed);color:var(--goed)}

/* ---- Leren: segmentknop en accordeon ---- */
.seg{display:flex;gap:4px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:11px}
.segknop{flex:1;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--fg-2);
  font:600 13.5px var(--f-body);cursor:pointer}
.segknop.aan{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
/* Acht rijen van ~56px: samen passen ze op één telefoonscherm, zodat je in
   één blik ziet hoe ver je met elke module bent. */
.leerlijst{padding:0;overflow:hidden}
.leerblok{border-bottom:1px solid var(--line)}
.leerblok:last-child{border-bottom:0}
.leerblok.nu{background:var(--blauw-zacht)}
.leerrij{display:flex;align-items:center;gap:10px;width:100%;min-height:56px;padding:8px 12px;
  background:transparent;border:0;border-left:3px solid transparent;cursor:pointer;text-align:left;color:var(--fg)}
.leerblok.nu>.leerrij{border-left-color:var(--c)}
.leerico{flex:0 0 auto;width:26px;line-height:0}
.leermid{flex:1;min-width:0;display:block}
.leertitel{display:block;font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leerbar{display:block;height:5px;margin-top:5px}
.leerbar i{display:block;height:100%;border-radius:99px;transition:width .3s}
.leerpct{flex:0 0 auto;font-family:var(--f-disp);font-size:12px;font-weight:700;color:var(--fg-2);min-width:34px;text-align:right}
.leermed{flex:0 0 auto;font-size:10.5px;color:var(--fg-3);min-width:46px;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leerchev{flex:0 0 auto;color:var(--fg-3);line-height:0;transition:transform .2s}
.leerblok.open .leerchev{transform:rotate(90deg)}
.leerpaneel{padding:0 12px 14px;border-left:3px solid var(--c)}
@media(max-width:380px){.leermed{display:none}}

/* ---- tekening bij een leskaart ---- */
.lesill{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px;line-height:0}
.lesill svg{display:block;width:100%;height:auto}

/* ---- collectie ---- */
.g-poke{grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px}
.pokevak{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);
  display:grid;place-items:center;padding:2px;cursor:default}
.pokevak img{width:100%;height:auto;max-height:100%;image-rendering:pixelated;display:block}
/* Nog niet gevangen: een silhouet, zodat je wel ziet wat er te halen valt. */
.pokevak:not(.heb) img{filter:brightness(0) opacity(.22)}
:root[data-theme="dark"] .pokevak:not(.heb) img{filter:brightness(0) invert(1) opacity(.2)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pokevak:not(.heb) img{filter:brightness(0) invert(1) opacity(.2)}}
.pokevak.heb{cursor:pointer;background:var(--surface);border-color:var(--line)}
.pokevak.shiny{border-color:var(--geel);box-shadow:inset 0 0 0 1px var(--geel)}
.pokenr{position:absolute;left:4px;bottom:2px;font-family:var(--f-disp);font-size:9px;color:var(--fg-3);line-height:1}
.pokedetail{border-left:4px solid var(--geel)}
.pokekop{display:flex;gap:12px;align-items:center}
.pokegroot{flex:0 0 auto;image-rendering:pixelated}

/* ---- vandaag: cijfers en dagstrip ---- */
.cijfers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.cijfer{background:var(--surface-2);border-radius:10px;padding:9px 8px;text-align:center;min-width:0}
.cijfer .cv{font-family:var(--f-disp);font-weight:800;font-size:16px;line-height:1.2}
.cijfer .cl{font-size:10.5px;color:var(--fg-2);margin-top:2px}
.dagen{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dagvak{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--surface-2);
  display:grid;place-items:center;font-size:11.5px;color:var(--fg-3);font-weight:600}
.dagvak[data-st="af"]{background:var(--goed);border-color:var(--goed);color:#fff}
.dagvak[data-st="nu"]{border-color:var(--blauw);color:var(--blauw);box-shadow:0 0 0 2px rgba(11,78,162,.18)}
.vink{flex:0 0 auto;width:22px;height:22px}
.vink svg{width:100%;height:100%;display:block}
.modcard.gedaan .small{color:var(--goed)}

/* ---- instellingen ---- */
.schakel{display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:10px 0;border-bottom:1px solid var(--line)}
.schakel:last-of-type{border-bottom:0}
.tuimel{flex:0 0 auto;width:46px;height:27px;border-radius:99px;border:1.5px solid var(--line);
  background:var(--surface-2);cursor:pointer;padding:0;position:relative;transition:background .18s,border-color .18s}
.tuimel[data-aan="1"]{background:var(--goed);border-color:var(--goed)}
.tuimel .dop{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;
  background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tuimel[data-aan="1"] .dop{transform:translateX(19px)}

/* ---- confetti ---- */
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

.toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--asfalt);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

8.6022 L 249.94996,233.17472 L 224.2649,215.51257 L 211.02843,186.29729 L 207.08742,169.89849 L 212.605,172.23405 L 219.69999,187.91805 L 224.49529,187.13676 L 218.35296,167.0393 L 199.20457,154.67164 C 195.03318,152.33608 191.09134,154.2145 191.09134,154.2145\" /> </g> </svg>"},{"c":"L8","n":"Doodlopende weg","b":"De weg heeft geen doorgaande verbinding.","svg":"<svg preserveAspectRatio=\"xMidYMid meet\" id=\"Nederlands_verkeersbord_L8\" viewBox=\"0 0 200 300\" xmlns=\"http://www.w3.org/2000/svg\" version=\"1.1\"> <rect id=\"blauw_vlak\" width=\"200\" height=\"300\" fill=\"#0e518d\" /> <path id=\"witte_bies\" style=\"fill:none;stroke:#f7fbf5;stroke-width:6.72582531\" d=\"M 175.62623,292.09141 C 184.58296,292.09141 191.86981,285.0188 191.86981,276.30711 L 191.86981,23.66005 C 191.86981,14.956562 184.58296,7.875758 175.62623,7.875758 L 24.34006,7.875758 C 15.38333,7.875758 8.10491,14.956562 8.10491,23.66005 L 8.10491,276.30711 C 8.10491,285.0188 15.38333,292.09141 24.34006,292.09141 L 175.62623,292.09141\" /> <path id=\"wit_blok\" fill=\"#f7fbf5\" d=\"M 91.339466,266.16306 L 108.86528,266.16306 L 108.86528,77.69097 L 91.339466,77.69097 L 91.339466,266.16306\" /> <path id=\"rood_blok\" fill=\"#c1121c\" d=\"M 64.352496,77.9914 L 135.85138,77.9914 L 135.85138,41.61372 L 64.352496,41.61372 L 64.352496,77.9914\" /> </svg>"}];

<script>
/* Auto-theorie B — modules: lesstof, vragen en situatiepuzzels.
   Verwijzingen naar RVV 1990 / WVW 1994 zodat je het kunt nalezen op wetten.overheid.nl. */
window.MODULES = [
{
  id: 'voorrang', nr: 2, titel: 'Voorrang', kleur: '--m-voorrang',
  samenvatting: 'Wie mag er eerst? Van rechts, haaientanden, afslaan, bijzondere manoeuvres en voorrangsvoertuigen.',
  lessons: [
    {t:'Voorrang verlenen is iets anders dan voor laten gaan', b:'Voorrang verlenen doe je tegenover bestuurders: je stelt ze in staat ongehinderd door te rijden. Voor laten gaan doe je tegenover alle weggebruikers, dus ook voetgangers. Op het examen wordt dit verschil getoetst.', a:'RVV 1990, art. 1', ill:'zebra'},
    {t:'Hoofdregel: verkeer van rechts gaat voor', b:'Op een kruispunt laat je bestuurders die van rechts komen voorgaan. Dat geldt voor alle bestuurders: auto, motor, fiets, bromfiets, ook als ze langzaam zijn.', a:'RVV 1990, art. 15 lid 1'},
    {t:'Twee uitzonderingen op verkeer van rechts', b:'1. Kom je van een onverharde weg, dan verleen je voorrang aan bestuurders op de verharde weg. 2. Een tram gaat altijd voor, ook als die van links komt.', a:'RVV 1990, art. 15 lid 2'},
    {t:'Borden en tekens gaan boven de hoofdregel', b:'Haaientanden met bord B6, een stopstreep met B7, een voorrangsweg B1 of verkeerslichten bepalen de voorrang. Pas als die er niet zijn, geldt verkeer van rechts. Een verkeersregelaar gaat boven alles.', a:'RVV 1990, art. 82 en 84'},
    {t:'Haaientanden: de punten wijzen naar jou', b:'Wijzen de punten van de haaientanden naar jou toe, dan moet jij voorrang verlenen. Stoppen hoeft niet als de kruisende weg vrij is. Bij bord B7 moet je altijd stilstaan.', a:'RVV 1990, art. 80'},
    {t:'Afslaan: rechtdoor gaat voor', b:'Sla je af, dan laat je het rechtdoorgaande verkeer op dezelfde weg voorgaan. Dat is dus ook de fietser rechts naast je als jij rechtsaf gaat, en de tegenligger als jij linksaf gaat.', a:'RVV 1990, art. 18 lid 1'},
    {t:'Bijzondere manoeuvre: jij laat iedereen voorgaan', b:'Wegrijden, achteruitrijden, keren, een uitrit of erf uitrijden, van rijstrook wisselen, invoegen en uitvoegen zijn bijzondere manoeuvres. Je laat dan al het overige verkeer voorgaan, dus ook een fietser of voetganger.', a:'RVV 1990, art. 54'},
    {t:'Rotonde', b:'Haaientanden bij de oprit betekenen dat verkeer op de rotonde voorgaat. Verlaat je de rotonde, dan sla je af en laat je fietsers en voetgangers op het fietspad of zebrapad voorgaan. Zonder borden geldt gewoon verkeer van rechts.', a:'RVV 1990, art. 15 en 18', ill:'rotonde'},
    {t:'Voorrangsvoertuig', b:'Een voertuig met blauw zwaailicht en tweetonige hoorn samen is een voorrangsvoertuig. Je laat het voorgaan, ook als jij groen hebt. Alleen zwaailicht zonder sirene geeft geen voorrang.', a:'RVV 1990, art. 50'},
    {t:'Lijnbus binnen de bebouwde kom', b:'Rijdt een lijnbus binnen de bebouwde kom weg vanaf een halte en geeft hij richting aan, dan laat jij hem voorgaan. Buiten de bebouwde kom hoeft dat niet.', a:'RVV 1990, art. 56'},
    {t:'Blokkeer het kruispunt niet', b:'Je mag een kruispunt alleen oprijden als je er ook voorbij kunt komen. Sta je stil op het kruispunt, dan blokkeer je de kruisende richting.', a:'RVV 1990, art. 14'},
    {t:'Voorrang krijg je niet, die geven anderen', b:'Ook als jij voorrang hebt, moet je een botsing voorkomen. Zie je dat iemand jouw voorrang niet geeft, dan rem je. Een ongeluk met voorrang is nog steeds een ongeluk.', a:'WVW 1994, art. 5'}
  ],
  questions: [
    {t:'hotspot', k:'gelijk-kruis-eerst', b:'bo-gelijk-kruis', v:'Je komt hier van onderaf aanrijden en gaat rechtdoor. Tik aan wie hier als eerste mag rijden.', a:{x:58,y:34,w:30,h:28}, u:'Verkeer van rechts gaat voor. Een fietser is ook een bestuurder, dus ook die laat je voorgaan.', art:'RVV 1990, art. 15 lid 1'},
    {t:'jn', k:'tram-van-links', b:'voorrang-tram', v:'Je gaat hier rechtdoor. Moet je de tram voor laten gaan?', a:0, u:'Ja. Een tram gaat altijd voor, ook als hij van links komt. Dat is een uitzondering op verkeer van rechts.', art:'RVV 1990, art. 15 lid 2'},
    {t:'mc', k:'onverharde-weg', v:'Je komt van een zandweg en wilt de asfaltweg oprijden. Er staan geen borden. Wat moet je doen?', o:['Je laat al het verkeer op de asfaltweg voorgaan','Je laat alleen het verkeer voorgaan dat van rechts komt','Je stopt verplicht en rijdt daarna als eerste weg'], a:0, u:'Kom je van een onverharde weg, dan verleen je voorrang aan bestuurders op de verharde weg, uit welke richting ze ook komen. Stilstaan hoeft niet als het vrij is.', art:'RVV 1990, art. 15 lid 2 onder a'},
    {t:'jn', k:'haaientanden-stoppen', b:'voorrang-b6', v:'Je nadert dit kruispunt. Moet je hier altijd stilstaan?', a:1, u:'Nee. Je moet voorrang verlenen, maar als de kruisende weg vrij is mag je doorrijden. Alleen bij een stopbord is stilstaan verplicht.', art:'RVV 1990, art. 80'},
    {t:'mc', k:'rechtsaf-fietser', v:'Je slaat rechtsaf. Rechts naast je rijdt een fietser rechtdoor op het fietspad. Wat moet je doen?', o:['Je laat de fietser voorgaan','Je gaat voor, want jij bent eerder bij de zijstraat','Je gaat voor zolang je op tijd richting aangeeft'], a:0, u:'Sla je af, dan laat je het rechtdoorgaande verkeer op dezelfde weg voorgaan. Dit is een van de vaakst gemaakte fouten.', art:'RVV 1990, art. 18 lid 1'},
    {t:'mc', k:'achteruit-parkeervak', b:'bijz-achteruit', v:'Je rijdt hier achteruit het parkeervak uit. Er nadert een bromfietser. Wat moet je doen?', o:['Je laat de bromfietser voorgaan','Je rijdt door, je was al begonnen','Je rijdt door en geeft duidelijk richting aan'], a:0, u:'Achteruitrijden is een bijzondere manoeuvre. Je laat al het overige verkeer voorgaan.', art:'RVV 1990, art. 54'},
    {t:'multi', k:'bijzondere-manoeuvres', v:'Bij welke handelingen moet jij al het overige verkeer voor laten gaan? Alleen goed als je ze allemaal aantikt.', o:['Keren','Wegrijden vanaf de kant','Van rijstrook wisselen','Rechtdoor rijden op een voorrangsweg','Rechtsaf slaan op een kruispunt'], a:[0,1,2], u:'Keren, wegrijden en van rijstrook wisselen zijn bijzondere manoeuvres. Afslaan op een kruispunt is dat niet; daarvoor geldt de afslaanregel.', art:'RVV 1990, art. 54'},
    {t:'jn', k:'zwaailicht-zonder-sirene', b:'voorrang-hulpdienst', v:'Achter je komt deze ambulance aan met alleen blauw zwaailicht, zonder sirene. Moet je hem voor laten gaan?', a:1, u:'Nee. Er moet zowel blauw zwaailicht als een tweetonige hoorn zijn. Alleen zwaailicht betekent vaak: werkzaamheden of een incident ter plaatse. Hinder hem niet, maar voorrang verlenen hoeft niet.', art:'RVV 1990, art. 50 en art. 1'},
    {t:'mc', k:'voorrangsvoertuig-groen', v:'Je hebt groen licht. Van rechts komt een brandweerauto met zwaailicht en sirene. Wat moet je doen?', o:['Je laat de brandweerauto voorgaan','Je rijdt door, groen gaat voor','Je rijdt het kruispunt op en gaat daarna pas aan de kant'], a:0, u:'Een voorrangsvoertuig laat je voorgaan, ook met groen licht. Blijf voorspelbaar: stop op een veilige plek en blokkeer de doorgang niet.', art:'RVV 1990, art. 50'},
    {t:'mc', k:'lijnbus-halte', b:'voorrang-bus', v:'Deze lijnbus wil wegrijden van de halte en geeft richting aan. Je rijdt binnen de bebouwde kom. Wat moet je doen?', o:['Je laat de bus voorgaan','Je rijdt door, de bus moet wachten','Je laat de bus alleen voorgaan op een 30 km-weg'], a:0, u:'Binnen de bebouwde kom laat je een wegrijdende lijnbus voorgaan. Buiten de bebouwde kom geldt dit niet.', art:'RVV 1990, art. 56'},
    {t:'jn', k:'rotonde-oprijden', b:'bo-rotonde', v:'Je nadert deze rotonde. Moet je het verkeer dat al op de rotonde rijdt voor laten gaan?', a:0, u:'Ja. De haaientanden wijzen naar jou, dus jij verleent voorrang aan het verkeer op de rotonde.', art:'RVV 1990, art. 80'},
    {t:'mc', k:'rotonde-verlaten', v:'Je verlaat een rotonde. Over het fietspad langs de uitrit rijdt een fietser rechtdoor. Wat moet je doen?', o:['Je laat de fietser voorgaan','Je rijdt door, je komt van de rotonde','Dat hangt af van de kleur van het fietspad'], a:0, u:'De rotonde verlaten is afslaan. Je laat de rechtdoorgaande fietser voorgaan.', art:'RVV 1990, art. 18 lid 1'},
    {t:'mc', k:'erf-uitrijden', b:'bijz-erf-uit', v:'Je rijdt hier het erf uit. Wat moet je doen?', o:['Je laat al het verkeer voorgaan, ook voetgangers','Je laat alleen bestuurders voorgaan','Je let alleen op verkeer dat van rechts komt'], a:0, u:'Een erf uitrijden is een bijzondere manoeuvre: je laat al het verkeer voorgaan, dus ook voetgangers.', art:'RVV 1990, art. 54'},
    {t:'jn', k:'voorrang-vertrouwen', v:'Je hebt voorrang op een kruispunt. Mag je erop vertrouwen dat de ander voor je stopt?', a:1, u:'Nee. Voorrang krijg je, je neemt het niet. Je blijft verplicht een ongeval te voorkomen.', art:'WVW 1994, art. 5'},
    {t:'mc', k:'kruispunt-blokkeren', v:'Je hebt groen licht, maar voorbij het kruispunt staat een file. Wat moet je doen?', o:['Wachten voor het kruispunt','Oprijden, je hebt groen','Tot halverwege oprijden en daar wachten'], a:0, u:'Je mag een kruispunt alleen oprijden als je er ook voorbij kunt komen, anders blokkeer je de kruisende richting.', art:'RVV 1990, art. 14'},
    {t:'order', k:'volgorde-tram-rechts', v:'Je komt uit het zuiden en gaat rechtdoor over een gelijkwaardig kruispunt. Uit het oosten komt een auto rechtdoor, uit het westen een tram. Zet ze op volgorde van wie als eerste mag rijden.', o:['De tram uit het westen','De auto uit het oosten','Jij'], a:[0,1,2], u:'De tram gaat altijd eerst, ook van links. Daarna de auto van rechts, dan jij.', art:'RVV 1990, art. 15 lid 2 onder b'},
    {t:'jn', k:'rangorde-regelaar', b:'tekens-regelaar', v:'Het licht staat hier op groen, maar de verkeersregelaar geeft jou een stopteken. Mag je doorrijden?', a:1, u:'Nee. Aanwijzingen van een verkeersregelaar gaan boven verkeerslichten, verkeerstekens en verkeersregels.', art:'RVV 1990, art. 82 en 84'},
    {t:'mc', k:'voorrangsweg-zijweg', b:'voorrang-voorrangsweg', v:'Je rijdt hier en van rechts komt een auto uit de zijweg. Wat moet je doen?', o:['Je rijdt door, jij hebt voorrang','Je laat de auto van rechts voorgaan','Je stopt en laat de auto erin'], a:0, u:'Op een voorrangsweg heb jij voorrang op het verkeer uit de zijwegen; het bord gaat boven de regel verkeer van rechts.', art:'RVV 1990, art. 15 en bijlage 1'},
    {t:'jn', k:'zebra-voetganger', b:'voorrang-zebra', v:'Deze voetganger staat op het punt om over te steken. Moet je hem voor laten gaan?', a:0, u:'Ja. Bij een voetgangersoversteekplaats laat je voetgangers en bestuurders van een gehandicaptenvoertuig die oversteken of op het punt staan over te steken voorgaan.', art:'RVV 1990, art. 49 lid 2'},
    {t:'mc', k:'linksaf-tegenligger', v:'Je slaat linksaf. Er komt een tegenligger aan die rechtdoor gaat. Wat moet je doen?', o:['Je laat de tegenligger voorgaan','Je gaat voor als jij als eerste het kruispunt op rijdt','Je gaat voor, want jij geeft richting aan'], a:0, u:'Afslaand verkeer laat het rechtdoorgaande verkeer op dezelfde weg voorgaan.', art:'RVV 1990, art. 18 lid 1'},
    {t:'multi', k:'wanneer-voorrang-verlenen', v:'In welke situaties moet jij voorrang verlenen of voor laten gaan? Alleen goed als je ze allemaal aantikt.', o:['Je voegt in op de snelweg','Je rijdt rechtdoor op een voorrangsweg','Je komt uit een uitrit','Je nadert haaientanden','Een tram kruist je weg van links'], a:[0,2,3,4], u:'Invoegen en uit een uitrit komen zijn bijzondere manoeuvres, haaientanden betekenen voorrang verlenen en een tram gaat altijd voor. Rechtdoor op een voorrangsweg niet.', art:'RVV 1990, art. 15, 54 en 80'},
    {t:'jn', k:'stopbord-lege-weg', b:'voorrang-b7', v:'Je nadert dit bord en de kruisende weg is helemaal leeg. Mag je doorrijden zonder stil te staan?', a:1, u:'Nee. Bij een stopbord moet je altijd stilstaan voor de stopstreep, ook als er niemand aankomt.', art:'RVV 1990, bijlage 1 bord B7'},
    {t:'mc', k:'militaire-colonne', v:'Je hebt voorrang, maar er rijdt een militaire colonne over het kruispunt. Wat moet je doen?', o:['Wachten, je mag de colonne niet doorsnijden','Doorrijden, jij hebt voorrang','Tussen twee voertuigen van de colonne door rijden'], a:0, u:'Je mag een militaire colonne en een uitvaartstoet van meer dan één voertuig niet doorsnijden.', art:'RVV 1990, art. 16'},
    {t:'mc', k:'invoegen-snelweg', b:'weg-invoegen', v:'Je voegt hier in op de autosnelweg. Wat moet je doen?', o:['Je past je snelheid aan en laat het verkeer op de rijbaan voorgaan','Je rijdt gewoon in, de invoegstrook houdt op','Het verkeer op de rijbaan moet ruimte voor je maken'], a:0, u:'Invoegen is een bijzondere manoeuvre: je past je snelheid aan en laat het verkeer op de doorgaande rijbaan voorgaan.', art:'RVV 1990, art. 54'},
    {t:'jn', k:'blinde-witte-stok', v:'Een blinde met een witte stok wil voor je oversteken. Moet je hem voor laten gaan?', a:0, u:'Ja. Je laat blinden met een witte stok en gehandicapten die moeite hebben met oversteken altijd voorgaan.', art:'RVV 1990, art. 49 lid 1'},
    {t:'mc', k:'van-rechts-slaat-af', v:'Je gaat rechtdoor over een gelijkwaardig kruispunt. Van rechts komt een auto die linksaf wil. Wat moet je doen?', o:['Je laat de auto van rechts voorgaan','Je gaat voor, want de ander slaat af','Je gaat voor, want jij gaat rechtdoor'], a:0, u:'De afslaanregel geldt alleen voor verkeer op dezelfde weg. Tussen kruisende richtingen beslist verkeer van rechts.', art:'RVV 1990, art. 15 lid 1 en art. 18'},
    {t:'hotspot', k:'haaientanden-aanwijzen', b:'bo-haaientanden', v:'Je komt hier van onderaf aanrijden. Tik het teken op het wegdek aan dat jou vertelt dat je voorrang moet verlenen.', a:{x:28,y:54,w:44,h:26}, u:'De punten van de haaientanden wijzen naar de bestuurder die voorrang moet verlenen. Ze gelden ook zonder bord.', art:'RVV 1990, art. 80'},
    {t:'mc', k:'geel-knipperlicht-kruispunt', b:'tekens-knipper-geel', v:'Je nadert dit kruispunt en het gele licht knippert. Wat moet je doen?', o:['Kijken naar de borden en de markering; staan die er niet, dan geldt verkeer van rechts','Doorrijden, de lichten regelen het kruispunt voor jou','Stoppen, net als bij rood'], a:0, u:'Bij geel knipperen werken de lichten niet als regeling. Je kijkt naar de borden en de wegmarkering, en anders geldt verkeer van rechts.', art:'RVV 1990, art. 75'},
    {t:'jn', k:'rijstrook-wisselen', v:'Je wisselt op de snelweg van rijstrook. Moet je het verkeer op die rijstrook voor laten gaan?', a:0, u:'Ja. Van rijstrook wisselen is een bijzondere manoeuvre.', art:'RVV 1990, art. 54'},
    {t:'sleep', k:'stoppen-bij-stopbord', b:'voorrang-b7', v:'Je moet hier stoppen. Sleep het vinkje naar de plek waar je stilstaat.', a:{x:22,y:58,w:56,h:26}, u:'Bij een stopbord stop je vóór de stopstreep. Pas daarna rij je langzaam naar voren om te kijken.', art:'RVV 1990, bijlage 1 bord B7'},
    {t:'multi', k:'welke-voorrangsvoertuigen', v:'Welke voertuigen moet je voor laten gaan als ze blauw zwaailicht én een sirene voeren? Alleen goed als je ze allemaal aantikt.', o:['Een ambulance','De brandweer','De politie','Een taxi met daklicht','Een bergingsvoertuig met oranje zwaailicht'], a:[0,1,2], u:'Hulpdiensten met optische én geluidssignalen zijn voorrangsvoertuigen. Oranje zwaailicht geeft geen voorrang; het waarschuwt alleen.', art:'RVV 1990, art. 50'},
    {t:'mc', k:'inhalen-bij-zebra', b:'voorrang-zebra', v:'Je staat hier stil om een voetganger te laten oversteken. De auto achter je wil je inhalen. Wat is waar?', o:['Inhalen vlak voor of op een zebrapad is verboden','Dat mag, zolang het rustig gebeurt','Dat mag, want er staat geen inhaalverbodsbord'], a:0, u:'Je mag niet inhalen vlak voor of op een voetgangersoversteekplaats; de voetganger zou onzichtbaar zijn voor de inhaler.', art:'RVV 1990, art. 12'},
    {t:'jn', k:'snorfiets-van-rechts', v:'Op een gelijkwaardig kruispunt komt een snorfietser van rechts. Moet je hem voor laten gaan?', a:0, u:'Ja. Een snorfietser is een bestuurder en valt gewoon onder de regel verkeer van rechts.', art:'RVV 1990, art. 15 lid 1'},
    {t:'mc', k:'overweg-trein', b:'bijz-overweg-and', v:'Je nadert deze overweg en er komt een trein aan. Wat moet je doen?', o:['Wachten, de trein gaat altijd voor','Snel oversteken, je bent er zo overheen','Alleen wachten als er bomen staan'], a:0, u:'Bij een spoorwegovergang gaat de trein altijd voor. Steek alleen over als je er helemaal voorbij kunt komen.', art:'RVV 1990, art. 14 en 71'},
    {t:'order', k:'volgorde-drie-autos', v:'Je kijkt van bovenaf op een gelijkwaardig kruispunt zonder borden. Auto A komt uit het noorden, auto B uit het oosten en auto C uit het westen, alle drie rechtdoor. Uit het zuiden komt niemand. Zet ze op volgorde van wie als eerste mag rijden.', o:['Auto B (oost)','Auto A (noord)','Auto C (west)'], a:[0,1,2], u:'B heeft niemand van rechts, want het zuiden is leeg, en mag eerst. Daarna A, die B rechts had. Dan C.', art:'RVV 1990, art. 15 lid 1'}
  ],
  puzzles: [
    {v:'Gelijkwaardig kruispunt, geen borden. Alle drie gaan rechtdoor. Klik op de volgorde waarin ze mogen rijden.', scene:{type:'kruis', borden:'geen', actors:[{id:'A',van:'zuid',naar:'rd',label:'Jij',kleur:'jij'},{id:'B',van:'oost',naar:'rd',label:'B'},{id:'C',van:'noord',naar:'rd',label:'C'}]}, a:['C','B','A'], u:'C (noord) heeft niemand van rechts: west is leeg. C eerst. Dan B, die C niet rechts heeft maar wel voor jou ligt. Jij (zuid) hebt B rechts, dus jij als laatste.', art:'RVV 1990, art. 15 lid 1'},
    {v:'Jij komt uit het zuiden en gaat rechtdoor. Je hebt haaientanden voor je. Van links komt B rechtdoor op de voorrangsweg. Klik de volgorde.', scene:{type:'kruis', borden:'haaientanden-zuid', actors:[{id:'A',van:'zuid',naar:'rd',label:'Jij',kleur:'jij'},{id:'B',van:'west',naar:'rd',label:'B'}]}, a:['B','A'], u:'De haaientanden wijzen naar jou. Je verleent voorrang aan alle bestuurders op de kruisende weg, ook van links.', art:'RVV 1990, art. 80'},
    {v:'Jij (zuid) gaat linksaf. Tegenligger T (noord) gaat rechtdoor. Klik de volgorde.', scene:{type:'kruis', borden:'geen', actors:[{id:'A',van:'zuid',naar:'links',label:'Jij',kleur:'jij'},{id:'T',van:'noord',naar:'rd',label:'T'}]}, a:['T','A'], u:'Jij slaat af, T gaat rechtdoor op dezelfde weg. Rechtdoor gaat voor.', art:'RVV 1990, art. 18 lid 1'},
    {v:'Jij (zuid) gaat rechtsaf. Naast je rijdt fietser F rechtdoor op het fietspad rechts. Klik de volgorde.', scene:{type:'kruis', borden:'geen', actors:[{id:'A',van:'zuid',naar:'rechts',label:'Jij',kleur:'jij'},{id:'F',van:'zuid',naar:'rd',label:'F',soort:'fiets'}]}, a:['F','A'], u:'De fietser gaat rechtdoor op dezelfde weg. Jij slaat af en laat hem voorgaan. Kijk over je rechterschouder in de dode hoek.', art:'RVV 1990, art. 18 lid 1'},
    {v:'Gelijkwaardig kruispunt. Tram R komt van links, auto B van rechts, jij komt uit het zuiden. Allen rechtdoor. Klik de volgorde.', scene:{type:'kruis', borden:'geen', actors:[{id:'A',van:'zuid',naar:'rd',label:'Jij',kleur:'jij'},{id:'B',van:'oost',naar:'rd',label:'B'},{id:'R',van:'west',naar:'rd',label:'Tram',soort:'tram'}]}, a:['R','B','A'], u:'De tram gaat altijd eerst, ook van links. Daarna de auto van rechts, dan jij.', art:'RVV 1990, art. 15 lid 2 onder b'},
    {v:'Jij staat stil in een uitrit en wilt de weg op. Op de weg nadert auto B, op het trottoir loopt voetganger V langs de uitrit. Klik de volgorde.', scene:{type:'uitrit', actors:[{id:'A',van:'uitrit',naar:'rd',label:'Jij',kleur:'jij'},{id:'B',van:'west',naar:'rd',label:'B'},{id:'V',van:'trottoir',naar:'rd',label:'V',soort:'voet'}]}, a:['V','B','A'], u:'Uit een uitrit komen is een bijzondere manoeuvre: je laat al het verkeer voorgaan. De voetganger kruist je als eerste.', art:'RVV 1990, art. 54'}
  ]
},
{
  id: 'tekens', nr: 5, titel: 'Verkeerstekens', kleur: '--m-tekens',
  samenvatting: 'Borden, verkeerslichten, strepen op de weg en wie wint als ze elkaar tegenspreken.',
  lessons: [
    {t:'De rangorde van verkeerstekens', b:'Aanwijzingen van een verkeersregelaar gaan boven verkeerslichten. Verkeerslichten gaan boven verkeerstekens (borden en strepen). Verkeerstekens gaan boven de verkeersregels. Deze volgorde wordt op het examen vaak gevraagd.', a:'RVV 1990, art. 82 en 84'},
    {t:'Bordgroepen herkennen', b:'A = snelheid, B = voorrang, C = geslotenverklaring, D = gebod, E = parkeren en stilstaan, F = inhalen en doorgang, G = soort weg, H = bebouwde kom, J = waarschuwing, K = voorsorteren, L = informatie.', a:'RVV 1990, bijlage 1'},
    {t:'Vorm en kleur vertellen het verhaal', b:'Rode rand met wit = verbod. Rode driehoek met punt omhoog = waarschuwing. Blauwe cirkel = gebod. Blauw vierkant = informatie of toestemming. Gele ruit = voorrangsweg. Rode achthoek = stop.', a:'RVV 1990, bijlage 1'},
    {t:'Onderborden', b:'Een onderbord beperkt of verruimt het bord erboven: een tijdvak, een soort voertuig, een afstand of een pijl met de richting waarvoor het geldt. Het onderbord kan een verbod ook juist opheffen voor bepaalde voertuigen.', a:'RVV 1990, art. 67'},
    {t:'Verkeerslichten', b:'Rood: stoppen voor de stopstreep. Geel: stoppen, tenzij dat niet meer veilig kan. Groen: doorrijden. Een groene pijl geeft toestemming voor die richting, maar je moet nog steeds voorrang verlenen aan verkeer dat al mag rijden.', a:'RVV 1990, art. 68'},
    {t:'Bijzondere lichten', b:'Rood knipperend bij een spoorwegovergang: stoppen. Geel knipperend: gevaarlijk punt, voorzichtigheid geboden. Een wit licht bij een tram of lijnbus is een richtinglicht voor die bestuurder, niet voor jou. Een rood kruis boven je rijstrook betekent dat die gesloten is.', a:'RVV 1990, art. 70, 71, 73 en 75'},
    {t:'Strepen op de weg', b:'Een doorgetrokken streep mag je niet overschrijden en niet eroverheen rijden. Bij een onderbroken streep naast een doorgetrokken streep geldt de streep die het dichtst bij jou ligt. Een blokmarkering (brede onderbroken streep) scheidt rijstroken en mag je wel overschrijden.', a:'RVV 1990, art. 76'},
    {t:'Haaientanden en stopstreep', b:'Haaientanden: voorrang verlenen, stoppen hoeft niet. Stopstreep bij bord B7 of bij rood licht: altijd voor de streep stilstaan. Een stopstreep zonder bord hoort bij de verkeerslichten.', a:'RVV 1990, art. 80 en 68'},
    {t:'Zebrapad en fietsstrook', b:'Een zebrapad bestaat uit witte banen over de weg: voetgangers voor laten gaan. Een fietsstrook is een strook op de rijbaan met fietssymbolen; je mag er met een motorvoertuig niet op rijden, ook niet om te parkeren.', a:'RVV 1990, art. 10 en 49', ill:'zebra'},
    {t:'Veel verwarde borden', b:'C2 (wit balkje in rode cirkel) is inrijden verboden; C3 (witte pijl in blauwe cirkel) is eenrichtingsweg waar je juist wel mag rijden. E1 is parkeerverbod, E2 is stilstaan verboden. G11 is verplicht fietspad, G13 is onverplicht fietspad.', a:'RVV 1990, bijlage 1'}
  ],
  questions: [
    {t:'mc', k:'regelaar-boven-licht', b:'tekens-regelaar', v:'Het licht staat hier op groen, maar de verkeersregelaar geeft jou een stopteken. Wat moet je doen?', o:['Stoppen','Doorrijden, het groene licht gaat voor','Langzaam doorrijden en oogcontact maken'], a:0, u:'De rangorde is: verkeersregelaar, dan verkeerslichten, dan verkeerstekens, dan de verkeersregels.', art:'RVV 1990, art. 82 en 84'},
    {t:'sign', k:'bord-b6', v:'Je ziet dit bord bij een kruispunt. Wat moet je doen?', signCode:'B6', o:['Voorrang verlenen aan de bestuurders op de kruisende weg','Stilstaan voor de stopstreep en dan voorrang verlenen','Doorrijden, jij hebt voorrang'], a:0, u:'De omgekeerde driehoek met rode rand betekent voorrang verlenen. Stoppen hoeft niet als het vrij is.', art:'RVV 1990, bijlage 1 bord B6'},
    {t:'sign', k:'bord-b1', v:'Je ziet dit bord naast de weg. Wat betekent dat voor jou?', signCode:'B1', o:['Je rijdt op een voorrangsweg','Je nadert een voorrangskruispunt','De voorrangsweg houdt hier op'], a:0, u:'De gele ruit met witte rand betekent dat jij op de voorrangsweg rijdt. Dezelfde ruit met een zwarte streep erdoor is het eindbord.', art:'RVV 1990, bijlage 1 bord B1'},
    {t:'sign', k:'bord-c2', v:'Je wilt deze straat inrijden en ziet dit bord. Mag dat?', signCode:'C2', o:['Nee, inrijden is verboden; uit de andere richting mag het wel','Nee, de straat is in beide richtingen gesloten','Ja, het is een eenrichtingsweg waar jij op mag'], a:0, u:'Rode cirkel met een wit balkje: inrijden verboden. Het verkeer uit de andere richting mag de straat wel in.', art:'RVV 1990, bijlage 1 bord C2'},
    {t:'sign', k:'bord-e2', v:'Je wilt hier even stoppen om iemand te laten uitstappen en ziet dit bord. Mag dat?', signCode:'E2', o:['Nee, stilstaan is hier verboden','Ja, alleen parkeren is verboden','Ja, uitstappen mag overal'], a:0, u:'Twee rode strepen betekent stilstaan verboden. Eén streep is alleen een parkeerverbod; dan mag je wel even stoppen.', art:'RVV 1990, bijlage 1 bord E2'},
    {t:'sign', k:'bord-g5', v:'Je rijdt dit gebied in. Waar moet je rekening mee houden?', signCode:'G5', o:['Niet harder dan 15 km per uur, en voetgangers mogen de hele weg gebruiken','Niet harder dan 30 km per uur, en voetgangers horen op het trottoir','Niet harder dan 15 km per uur, en je mag overal parkeren'], a:0, u:'Op een erf rijd je stapvoets: niet harder dan 15 km per uur. Voetgangers mogen de hele breedte van de weg gebruiken en parkeren mag alleen in de vakken.', art:'RVV 1990, art. 44, 45 en 46'},
    {t:'jn', k:'voorrangsweg-ruit', b:'voorrang-voorrangsweg', v:'Je rijdt op deze weg. Moet je het verkeer uit de zijwegen voor laten gaan?', a:1, u:'Nee. De gele ruit betekent dat jij op de voorrangsweg rijdt; het verkeer uit de zijwegen verleent jou voorrang.', art:'RVV 1990, bijlage 1 bord B1'},
    {t:'jn', k:'doorgetrokken-streep', b:'weg-inhalen-streep', v:'Voor je rijdt een fietser. Mag je hier de doorgetrokken streep overschrijden om hem in te halen?', a:1, u:'Nee. Een doorgetrokken streep mag je niet overschrijden. Je wacht tot de streep onderbroken is, of je blijft binnen je eigen strook.', art:'RVV 1990, art. 76'},
    {t:'mc', k:'dubbele-streep', b:'weg-inhalen-streep', v:'Links van je ligt een doorgetrokken streep met daarnaast een onderbroken streep. Wat geldt voor jou?', o:['De streep die het dichtst bij jou ligt','De onderbroken streep, dus inhalen mag','Allebei, dus inhalen mag nooit'], a:0, u:'Bij een dubbele streep geldt de streep die het dichtst bij jou ligt. Ligt de doorgetrokken streep aan jouw kant, dan mag je niet overschrijden.', art:'RVV 1990, art. 76'},
    {t:'mc', k:'licht-op-geel', b:'tekens-licht-geel', v:'Je rijdt hier en het licht springt op geel. Wat moet je doen?', o:['Stoppen, tenzij dat niet meer veilig kan','Altijd stoppen, ook als je vol moet remmen','Doorrijden, bij geel mag je nog'], a:0, u:'Bij geel moet je stoppen, tenzij dat redelijkerwijs niet meer kan. Veiligheid gaat voor.', art:'RVV 1990, art. 68'},
    {t:'jn', k:'groene-pijl', v:'Je krijgt een groene pijl naar rechts. Hoef je dan geen voorrang meer te verlenen?', a:1, u:'Nee. Een groene pijl geeft toestemming voor die richting, maar je laat fietsers en voetgangers die al groen hebben gewoon voorgaan.', art:'RVV 1990, art. 68 en 18'},
    {t:'sign', k:'bord-g11', v:'Je rijdt met de auto en ziet dit bord naast de rijbaan. Wat betekent het voor jou?', signCode:'G11', o:['Fietsers en snorfietsers moeten hier rijden; jij mag er niet op','Fietsers mogen hier rijden maar hoeven niet','Dit is een voetpad'], a:0, u:'Blauwe cirkel met een fiets: verplicht fietspad. Het blauwe rechthoekige bord met een fiets is een onverplicht fietspad.', art:'RVV 1990, bijlage 1 bord G11'},
    {t:'sign', k:'bord-f1', v:'Je ziet dit bord. Wat mag je hierna niet meer doen?', signCode:'F1', o:['Een andere auto inhalen','Een fietser of bromfietser inhalen','Een vrachtauto inhalen; andere auto’s mogen wel'], a:0, u:'Twee auto’s waarvan één rood: motorvoertuigen mogen elkaar onderling niet inhalen. Een fiets of bromfiets inhalen mag wel.', art:'RVV 1990, bijlage 1 bord F1'},
    {t:'mc', k:'onderbord-tijdvak', b:'tekens-bord-onderbord', v:'Onder dit snelheidsbord staat een onderbord met de tekst 06-19 h. Wat betekent dat voor jou?', o:['De snelheid geldt alleen tussen 06.00 en 19.00 uur','De snelheid geldt juist buiten die uren','Het bord geldt nog zes kilometer'], a:0, u:'Een onderbord met een tijdvak beperkt het bord erboven tot die uren.', art:'RVV 1990, art. 67'},
    {t:'jn', k:'bord-na-kruispunt', v:'Je bent een snelheidsbord gepasseerd. Blijft dat bord altijd gelden, ook na het eerstvolgende kruispunt?', a:1, u:'Nee. Veel borden gelden tot het eerstvolgende kruispunt of tot een eindbord. Na een zijweg wordt een snelheidsbord vaak herhaald.', art:'RVV 1990, bijlage 1'},
    {t:'multi', k:'blauwe-cirkel-gebod', v:'Je herkent een gebod aan de blauwe cirkel. Welke van deze borden zijn een blauwe cirkel? Alleen goed als je ze allemaal aantikt.', o:['Verplicht fietspad','Rotonde, verplichte rijrichting','Parkeergelegenheid','Gebod rechtsaf','Maximumsnelheid'], a:[0,1,3], u:'Een blauwe cirkel is een gebod. Parkeergelegenheid is een blauw vierkant (informatie) en de maximumsnelheid staat in een witte cirkel met rode rand (verbod).', art:'RVV 1990, bijlage 1'},
    {t:'sign', k:'bord-j37', v:'Je ziet dit bord met een onderbord eronder. Wat betekent het?', signCode:'J37', o:['Gevaar; het onderbord vertelt welk gevaar','Werk in uitvoering','Slipgevaar bij regen'], a:0, u:'Het uitroepteken in een rode driehoek waarschuwt voor een gevaar waarvoor geen apart bord bestaat. Het onderbord zegt waar het om gaat.', art:'RVV 1990, bijlage 1 bord J37'},
    {t:'sign', k:'bord-h1', v:'Je passeert dit bord. Hoe hard mag je daarna nog rijden?', signCode:'H1', o:['50 km per uur','30 km per uur','80 km per uur'], a:0, u:'Het blauwe komgrensbord: vanaf hier geldt de bebouwde kom, standaard 50 km per uur tenzij een bord anders aangeeft.', art:'RVV 1990, art. 20'},
    {t:'mc', k:'overweg-rode-lichten', b:'bijz-overweg-licht', v:'Je nadert deze overweg. De rode lichten knipperen en de bomen zijn nog open. Wat moet je doen?', o:['Stoppen','Snel oversteken voordat de bomen sluiten','Langzaam doorrijden en goed kijken'], a:0, u:'Knipperende rode lichten betekenen stoppen, ongeacht de stand van de bomen.', art:'RVV 1990, art. 71'},
    {t:'jn', k:'geel-knipperlicht-voorrang', b:'tekens-knipper-geel', v:'Je nadert dit kruispunt met een geel knipperlicht. Betekent dat dat jij voorrang hebt?', a:1, u:'Nee. Geel knipperlicht betekent: gevaarlijk punt, voorzichtigheid geboden. Je kijkt naar de borden en de markering, en anders geldt verkeer van rechts.', art:'RVV 1990, art. 75'},
    {t:'sign', k:'bord-b7', v:'Je nadert dit bord en de kruisende weg is leeg. Wat moet je doen?', signCode:'B7', o:['Stilstaan voor de stopstreep en dan voorrang verlenen','Voorrang verlenen; stoppen hoeft niet','Doorrijden, er komt niemand aan'], a:0, u:'De rode achthoek met STOP: altijd stilstaan voor de stopstreep, ook als de weg leeg is.', art:'RVV 1990, bijlage 1 bord B7'},
    {t:'mc', k:'fietsstrook-doorgetrokken', v:'Naast je ligt een fietsstrook met een doorgetrokken streep. Wat geldt voor jou?', o:['Je mag er niet op rijden en er niet stilstaan','Je mag erop rijden als het druk is','Je mag er even stilstaan om te laden'], a:0, u:'Op een fietsstrook met doorgetrokken streep mag je met een motorvoertuig niet rijden. Stilstaan en parkeren zijn er bovendien verboden.', art:'RVV 1990, art. 10, 23 en 76'},
    {t:'sign', k:'bord-c12', v:'Je rijdt in een personenauto en ziet dit bord. Mag je hier in?', signCode:'C12', o:['Nee, alle motorvoertuigen zijn uitgesloten','Ja, het bord geldt alleen voor vrachtauto’s','Ja, het bord geldt alleen voor motoren'], a:0, u:'Dit bord sluit alle motorvoertuigen uit: auto, motor en bromfiets. Fietsers en voetgangers mogen er wel langs.', art:'RVV 1990, bijlage 1 bord C12'},
    {t:'fill', k:'erf-snelheid', b:'bijz-erf', v:'Je rijdt dit erf op. Hoe hard mag je hier hoogstens rijden? Vul het getal in zonder eenheid.', a:'15', u:'Op een erf mag je niet sneller rijden dan 15 km per uur.', art:'RVV 1990, art. 45'},
    {t:'mc', k:'rood-kruis-rijstrook', b:'weg-rijstrook-kruis', v:'Je rijdt op de snelweg en ziet dit boven jouw rijstrook. Wat moet je doen?', o:['De rijstrook op tijd en rustig verlaten','Doorrijden met een lagere snelheid','Stoppen op die rijstrook'], a:0, u:'Een rood kruis boven een rijstrook betekent dat die strook gesloten is. Je mag hem pas weer gebruiken als het kruis weg is.', art:'RVV 1990, art. 73'},
    {t:'hotspot', k:'rijstrook-gesloten-aanwijzen', b:'weg-rijstrook-kruis', v:'Je rijdt hier op de snelweg. Tik de rijstrook aan waar je niet op mag rijden.', a:{x:30,y:28,w:40,h:52}, u:'De strook onder het rode kruis is gesloten. Verlaat hem op tijd en rij niet door tot vlak voor de afzetting.', art:'RVV 1990, art. 73'},
    {t:'jn', k:'onderbord-uitzondering', b:'tekens-bord-onderbord', v:'Onder een geslotenverklaring staat het onderbord "uitgezonderd bestemmingsverkeer". Mag je er dan in als je in die straat moet zijn?', a:0, u:'Ja. Een onderbord kan een verbod beperken en ook opheffen voor bepaalde voertuigen of voor bestemmingsverkeer.', art:'RVV 1990, art. 67'},
    {t:'sign', k:'bord-d1', v:'Je nadert een rotonde en ziet dit bord. Wat moet je doen?', signCode:'D1', o:['De rotonde rechtsom volgen','Verplicht de eerste afslag rechts nemen','Voorrang verlenen aan het verkeer op de rotonde'], a:0, u:'Drie pijlen in een blauwe cirkel: je volgt de rotonde rechtsom. Over de voorrang zeggen de haaientanden iets, niet dit bord.', art:'RVV 1990, bijlage 1 bord D1'},
    {t:'jn', k:'parkeerverbod-stilstaan', v:'Je ziet een bord met één rode schuine streep in een blauwe cirkel. Mag je daar even stilstaan om iemand te laten uitstappen?', a:0, u:'Ja. Eén streep is een parkeerverbod: kort stilstaan om te laden of iemand te laten uitstappen mag. Twee strepen verbieden elk stilstaan.', art:'RVV 1990, bijlage 1 borden E1 en E2'},
    {t:'multi', k:'tekens-voorrang-verlenen', v:'Bij welke tekens moet jij voorrang verlenen? Alleen goed als je ze allemaal aantikt.', o:['Haaientanden op het wegdek','De omgekeerde driehoek met rode rand','De gele ruit','Het achthoekige stopbord','Een geel knipperlicht'], a:[0,1,3], u:'Haaientanden, de omgekeerde driehoek en het stopbord leggen de voorrangsplicht bij jou. De gele ruit geeft jou juist voorrang en een geel knipperlicht zegt niets over voorrang.', art:'RVV 1990, art. 80 en bijlage 1'},
    {t:'sign', k:'bord-g3', v:'Je passeert dit bord. Wat geldt er vanaf hier?', signCode:'G3', o:['Alleen motorvoertuigen die minstens 50 km per uur kunnen en mogen rijden','Je mag hier 130 km per uur rijden','Fietsers mogen hier op de rijbaan rijden'], a:0, u:'Het autowegbord. Op een autoweg mogen alleen motorvoertuigen die minimaal 50 km per uur kunnen en mogen rijden.', art:'RVV 1990, art. 42'},
    {t:'jn', k:'wit-licht-tram', b:'tekens-bus-licht', v:'Je nadert dit kruispunt en ziet een wit balklicht branden. Geldt dat licht ook voor jou?', a:1, u:'Nee. De witte lichten zijn bestemd voor bestuurders van een tram of een lijnbus. Jij volgt het gewone verkeerslicht.', art:'RVV 1990, art. 70'},
    {t:'mc', k:'einde-kom-snelheid', v:'Je rijdt 50 binnen de bebouwde kom en passeert het bord einde bebouwde kom. Hoe hard mag je dan rijden?', o:['80 km per uur','50 km per uur','100 km per uur'], a:0, u:'Buiten de bebouwde kom geldt standaard 80 km per uur voor een personenauto, tenzij een bord anders aangeeft.', art:'RVV 1990, art. 21'},
    {t:'sign', k:'bord-f5', v:'Je nadert een wegversmalling en ziet dit bord. Wat moet je doen?', signCode:'F5', o:['Wachten als er verkeer tegemoet komt','Doorrijden, de tegenligger moet wachten','Altijd stoppen voor de versmalling'], a:0, u:'Bij dit bord wacht jij. Het blauwe bord met de grote witte pijl betekent juist dat de tegenligger wacht.', art:'RVV 1990, bijlage 1 bord F5'},
    {t:'mc', k:'blokmarkering', b:'tekens-markering-blok', v:'Je rijdt op de snelweg en ziet deze brede onderbroken streep. Wat betekent die voor jou?', o:['Hij scheidt rijstroken bij een uitvoeging of versmalling; overschrijden mag','Je mag hem niet overschrijden','Het is een fietsstrook'], a:0, u:'Een blokmarkering scheidt bijvoorbeeld een uitvoegstrook van de doorgaande rijbaan. Overschrijden mag, maar doe het bewust en op tijd.', art:'RVV 1990, wegmarkering'},
    {t:'fill', k:'matrixbord-snelheid', b:'tekens-matrix', v:'Je rijdt op de snelweg en ziet dit matrixbord boven je rijstrook. Hoe hard mag je hier nog rijden? Vul het getal in zonder eenheid.', a:'90', u:'Een snelheid op een matrixbord is een gewoon snelheidsbord: hij gaat boven de snelheid die er normaal geldt.', art:'RVV 1990, bijlage 1 bord A1'}
  ],
  puzzles: []
}

<script>
/* Auto-theorie B — modules 1, 3, 4, 6, 7 en 8.
   Bronnen: RVV 1990, WVW 1994, Reglement rijbewijzen, Regeling voertuigen.
